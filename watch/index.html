<!DOCTYPE html>
<html lang="en">
<head>
<!-- first, before any game code reads storage: per-account local data (site/account_silo.js) -->
<script src="/site/account_silo.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magepunk — Watch</title>
<meta name="description" content="Watch your friends play live in every Magepunk game, and rewatch your own replays.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
<!-- the site's Balatro-style UI kit (site/ui/): its tokens, the m6x11 font, the .bal-* components -->
<link rel="preload" href="/micatro/assets/fonts/m6x11plus.ttf?v=2" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="/site/ui/balatro.css">
<style>
	/* The Balatro look (site/ui/balatro.css): the felt, the m6x11 font, every live game a kit panel on a dark lip,
	   kit buttons by meaning (Watch blue, Bet gold, TV mode purple). One look, so the light theme is gone. The page's
	   own names map onto the kit's tokens. */
	:root { --panel: var(--bal-panel); --panel-2: var(--bal-panel-d); --panel-3: var(--bal-panel-dd); --border: var(--bal-panel-line); --text: var(--bal-text); --muted: var(--bal-text-muted);
		--gold: var(--bal-money); --blue: var(--bal-blue); --violet: var(--bal-purple); --green: var(--bal-green); --red: var(--bal-red); }
	* { box-sizing: border-box; }
	main { max-width: 960px; margin: 0 auto; padding: 8px 16px 48px; }
	h1 { font-size: 46px; font-weight: normal; margin: 10px 0 2px; text-shadow: 0 .09em 0 rgba(0,0,0,.35); }
	.lede { color: var(--bal-text-soft); margin: 0 0 18px; }
	h2 { font-size: 30px; font-weight: normal; margin: 26px 0 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; text-shadow: var(--bal-text-shadow); }
	h2 .grow { flex: 1; }
	.note { color: var(--muted); font-size: 18px; margin: 6px 0; text-shadow: none; }
	.note a { color: #9fd3ff; }
	.live-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
	.live { display: flex; flex-direction: column; gap: 6px; background: var(--panel); border-radius: 16px; padding: 12px 14px; box-shadow: 0 7px 0 var(--panel-3), inset 0 0 0 3px var(--border); }
	.live .who { font-size: 22px; display: flex; align-items: center; gap: 8px; }
	.live .who .dot { color: var(--red); font-size: 15px; letter-spacing: .5px; }
	.live .what { color: var(--muted); font-size: 17px; min-height: 1.2em; }
	.live .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
	.live .eyes { color: var(--muted); font-size: 16px; flex: 1; }
	/* the pool riding on a game (live-friends `pool`): one line; a big one stands out in gold */
	.live .pool { font-size: 16px; color: var(--text); background: var(--panel-2); border-radius: 9px; padding: 6px 9px 4px; line-height: 1.15; }
	.live .pool.open { box-shadow: inset 4px 0 0 var(--bal-gold); }
	.live.big { box-shadow: 0 7px 0 var(--panel-3), inset 0 0 0 3px var(--bal-gold); }
	.live .big-badge { color: #fff; background: var(--bal-gold); border-radius: 999px; padding: 2px 8px 0; font-size: 15px; white-space: nowrap; }
	.live .row { flex-wrap: wrap; }
	.order { min-height: 40px; font-size: 18px; padding-top: 6px; padding-bottom: 4px; }
	#tv .bar .now small.tv-pool { color: var(--bal-money); }
	/* kit buttons (sized for the pixel font; a ghost = grey) */
	.btn { min-height: 40px; font-size: 19px; text-shadow: var(--bal-text-shadow); }
	.btn.bet { --bal-b: var(--bal-gold); --bal-bd: var(--bal-gold-d); }
	.btn.ghost { --bal-b: var(--bal-purple); --bal-bd: var(--bal-purple-d); }
	.btn[disabled] { opacity: .5; cursor: default; }
	.bal-page a.bal-btn { color: #fff; }   /* (the kit tints plain links blue; these are buttons) */
	a:focus-visible, button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

	/* TV mode: one live friend's game at a time, full screen; the bar is the kit's dark banner */
	#tv { position: fixed; inset: 0; z-index: 1000; background: #000; display: none; flex-direction: column; }
	#tv.open { display: flex; }
	#tv iframe { flex: 1; width: 100%; border: 0; background: #000; pointer-events: none; }   /* (passive: the keys and the pad stay with TV mode) */
	#tv .bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--bal-panel-dd); color: #fff; flex-wrap: wrap; font-size: 20px; box-shadow: 0 -4px 0 var(--bal-panel-d); }
	#tv .bar .now { flex: 1; min-width: 160px; }
	#tv .bar .now small { display: block; color: var(--muted); font-size: 16px; }
	#tv .bar button { --bal-b: var(--bal-grey); --bal-bd: var(--bal-grey-d); min-height: 44px; min-width: 44px; font-size: 19px; }
	#tv .bar button#tv-leave { --bal-b: var(--bal-orange); --bal-bd: var(--bal-orange-d); }
	#tv .empty { flex: 1; display: grid; place-items: center; color: var(--muted); font-size: 24px; text-align: center; padding: 20px; }
	#tv .empty[hidden] { display: none; }
	#tv .prog { height: 4px; background: var(--bal-blue); width: 0; transition: width .5s linear; }
</style>
</head>
<body class="bal-page">
<main>
	<h1>📺 Watch</h1>
	<p class="lede">Your friends playing live in every game, and your own replays from every game.</p>

	<h2><span class="grow">Live now</span><label class="note" for="live-order">Order</label><select class="order bal-select" id="live-order" title="How the live games are ordered"><option value="live">As they come</option><option value="pool">Biggest pools</option></select><button class="btn ghost bal-btn" id="tv-open" type="button" title="TV mode: one live game at a time, full screen (←/→ or Q/E change, X leaves)">📺 TV mode</button></h2>
	<div id="live"><p class="note">Loading…</p></div>

	<h2>Your replays</h2>
	<div id="library"></div>
</main>

<div id="tv" role="dialog" aria-modal="true" aria-label="TV mode">
	<div class="prog" id="tv-prog"></div>
	<iframe id="tv-frame" title="A friend's live game" tabindex="-1"></iframe>
	<div class="empty" id="tv-empty" hidden>Nobody is live right now. TV mode waits for the next friend to start a game…</div>
	<div class="bar">
		<button type="button" class="bal-btn" id="tv-prev" aria-label="Previous game">◀ Prev</button>
		<div class="now" id="tv-now" aria-live="polite"></div>
		<button type="button" class="bal-btn" id="tv-next" aria-label="Next game">Next ▶</button>
		<button type="button" class="bal-btn bal-back" id="tv-leave" aria-label="Leave TV mode">✕ Leave</button>
	</div>
</div>

<script type="module" src="/watch/watch.js"></script>
<!-- no mouse needed: arrows / WASD / d-pad move, Z / Enter / A picks (site/focusnav.js); TV mode takes the keys while open -->
<script type="module">import { initFocusNav } from '/site/focusnav.js'; initFocusNav();</script>
<script type="module" src="/site/topbar.js"></script>
<!-- Balatro's button sounds on every button and link (site/pagesounds.js; nothing plays before a press, no music) -->
<script type="module">import { wirePage } from '/site/pagesounds.js'; wirePage();</script>
</body>
</html>
