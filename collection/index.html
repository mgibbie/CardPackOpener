<style>
	/* Battlecards dark identity (battlecards/theme.css tokens) laid over the
	   wiki's light shell — the collection is a Battlecards-facing page and was
	   the last light one standing */
	:root { --bg-0:#0c1122; --bg-1:#141a35; --panel:#1a2140; --panel-2:#212a52; --border:#2e3a63; --text:#e8eaf6; --muted:#9aa3c8; --gold:#ffcf6b; --blue:#6ea8ff; --violet:#a688ff; --green:#6bd6a0; }
	body { color: var(--text); background: radial-gradient(1100px 560px at 12% -10%, rgba(166,136,255,.16), transparent 60%), radial-gradient(900px 480px at 92% 0%, rgba(255,207,107,.12), transparent 55%), linear-gradient(180deg, var(--bg-1), var(--bg-0) 60%); background-attachment: fixed; }
	a { color: var(--blue); }
	header { background: var(--panel); border-bottom: 1px solid var(--border); }
	.wiki-card:hover .wiki-face { box-shadow: 0 5px 16px rgba(166,136,255,.4); }
	/* the page keeps its own single header; the floating compact topbar cluster
	   (site/topbar.js) sits top-right, so clear room for it */
	header { padding-right: 104px; }
	header .right { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; }
	header .right a { color: #ffe9a8; font-weight: 600; }
	#content { max-width: 1180px; margin: 0 auto; }
	.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 14px 0 4px; }
	.toolbar input[type=search] { flex: 1; min-width: 160px; max-width: 300px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; font: inherit; background: var(--panel); color: var(--text); }
	.toolbar select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font: inherit; background: var(--panel); color: var(--text); }
	.own-summary { color: var(--muted); margin: 6px 0 0; }
	.dust-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 8px 0 0; }
	.dust-chip { background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 5px 14px; color: var(--text); font-weight: 600; }
	.dust-btn { background: #2b6cb0; color: #fff; border: 0; border-radius: 8px; padding: 7px 14px; font: 600 13px system-ui, sans-serif; cursor: pointer; }
	.dust-btn:hover { filter: brightness(1.08); }
	.dust-hint { color: var(--muted); font-size: 12.5px; }
	.wiki-card .craft-btn { position: absolute; left: 50%; bottom: 26%; transform: translateX(-50%); z-index: 2;
		background: #6b4fd4; color: #fff; border: 0; border-radius: 8px; padding: 5px 12px; font: 700 12px system-ui, sans-serif; cursor: pointer; opacity: 0; transition: opacity .15s; }
	.wiki-card:hover .craft-btn, .wiki-card:focus-within .craft-btn { opacity: 1; }
	.craft-btn:disabled { background: #3a4266; cursor: default; }
	.count-line { color: var(--muted); font-size: 12.5px; margin: 8px 0 0; }
	/* completion meter + per-class breakdown */
	.completion { margin: 10px 0 4px; }
	.meter { position: relative; height: 26px; border-radius: 999px; background: var(--panel); border: 1px solid var(--border); overflow: hidden; }
	.meter-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #6ea8ff, #7a5bd6); transition: width .6s ease; }
	.meter-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 700; color: var(--text); text-shadow: 0 1px 2px rgba(0,0,0,.55); }
	.class-breakdown { margin-top: 10px; }
	.class-breakdown > summary { cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 600; user-select: none; }
	.cb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px 16px; margin-top: 10px; }
	.cb-row { font-size: 12.5px; }
	.cb-row .cb-top { display: flex; justify-content: space-between; color: var(--muted); }
	.cb-row .cb-top b { color: var(--text); }
	.cb-bar { height: 7px; border-radius: 999px; background: var(--panel); border: 1px solid var(--border); overflow: hidden; margin-top: 3px; }
	.cb-bar > div { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #6ea8ff, #7a5bd6); }
	@media (prefers-reduced-motion: reduce) { .meter-fill { transition: none; } }
	/* cards you don't own, shown in Missing / All view */
	.wiki-card.unowned img { filter: grayscale(1) brightness(.62); opacity: .72; }
	.wiki-card.unowned { position: relative; }
	.wiki-card.unowned::after { content: 'Not owned'; position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%); background: rgba(20,15,32,.82); color: #cbd2e6; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px; letter-spacing: .3px; }
	/* hover tooltip — same voice as the pack-opening inspect tip */
	#tip {
		display: none; position: fixed; z-index: 50; max-width: 300px;
		background: #1c1830f2; color: #e8e2f4; border: 1px solid #4a4066;
		border-radius: 10px; padding: 10px 12px; pointer-events: none;
		font-size: 13px; line-height: 1.35; box-shadow: 0 6px 22px rgba(0,0,0,0.5);
	}
	#tip b { color: #e8e2f4; }
	#tip .nm { font-weight: 700; font-size: 15px; }
	#tip .nm .cost { color: #ffd25f; }
	#tip .meta { color: #c9b8ff; font-size: 12px; text-transform: capitalize; }
	#tip .kws { color: #9fd0ff; font-size: 12px; }
	#tip .rules { margin-top: 5px; }
	#tip .kwline { margin-top: 5px; padding-top: 5px; border-top: 1px solid rgba(255,255,255,0.12); font-size: 11.5px; line-height: 1.3; }
	#tip .kwline b { color: #9fd0ff; }
</style>

</head>
<body>
<header>
	<a class="brand" href="/">Magepunk</a>
	<a href="/profile/">Profile</a>
	<a href="/designwiki/">Design Wiki</a>
	<div class="right"><a id="who" href="/profile/"></a></div>
</header>
<div id="content">
	<h1>Your Collection</h1>
	<p class="own-summary" id="summary">Loading your collection…</p>
	<p class="dust-row" id="dust-row" hidden>
		<span class="dust-chip">💎 <b id="dust-amt">0</b> dust</span>
		<button id="dust-extras" class="dust-btn" hidden>♻️ Dust extras <span id="dust-preview"></span></button>
		<span class="dust-hint">Extra copies beyond a playset convert to dust; craft any missing card from its tile (Show: Missing).</span>
	</p>
	<div class="completion" id="completion" hidden>
		<div class="meter"><div class="meter-fill" id="meter-fill"></div><span class="meter-label" id="meter-label"></span></div>
		<details class="class-breakdown"><summary>Completion by class</summary><div class="cb-grid" id="cb-grid"></div></details>
	</div>
	<div class="toolbar" id="toolbar" hidden>
		<input type="search" id="q" placeholder="Search cards…">
		<select id="f-owned">
			<option value="owned">Show: Owned</option>
			<option value="missing">Show: Missing</option>
			<option value="all">Show: All cards</option>
		</select>
		<select id="f-class"><option value="">All classes</option></select>
		<select id="f-type"><option value="">All types</option></select>
		<select id="f-rarity"><option value="">All rarities</option></select>
		<select id="f-sort">
			<option value="cost">Sort: cost</option>
			<option value="name">Sort: name</option>
			<option value="count">Sort: copies</option>
			<option value="rarity">Sort: rarity</option>
		</select>
		<select id="f-size">
			<option value="small">Small</option>
			<option value="medium" selected>Medium</option>
			<option value="large">Large</option>
		</select>
	</div>
	<p class="count-line" id="countline"></p>
	<div class="card-grid size-medium" id="grid"></div>
</div>
<div id="tip"></div>

<script type="module">
import * as MP from '../battlecards/mpmode.js';
import { keywordsFor, richHtml } from '../battlecards/keywords.js';
if (!MP.hasToken()) location.replace('/login/?next=' + encodeURIComponent('/collection/'));

const $ = id => document.getElementById(id);
const grid = $('grid');
const RARITY_ORDER = ['common', 'uncommon', 'rare', 'epic', 'legendary', 'special'];

let CardArt, cards = [], byId = {}, owned = [], poolSize = 0, poolIds = [], state = null, poolData = null;

// dust economy (mirror of the server's tables — server validates)
const CRAFT_COST = { common: 40, uncommon: 80, rare: 100, epic: 400, legendary: 1600 };
const DUST_VALUE = { common: 5, uncommon: 10, rare: 20, epic: 100, legendary: 400 };
const capFor = r => r === 'legendary' ? 1 : 2;
function extrasPreview() {
	const col = state.collection || {};
	let gained = 0;
	for (const [id, n] of Object.entries(col)) {
		const info = poolData?.[id];
		if (!info || n <= 0) continue;
		const extra = n - capFor(info[0]);
		if (extra > 0 && DUST_VALUE[info[0]]) gained += extra * DUST_VALUE[info[0]];
	}
	return gained;
}
function refreshDustUi() {
	$('dust-row').hidden = false;
	$('dust-amt').textContent = (state.dust || 0).toLocaleString();
	const gain = extrasPreview();
	$('dust-extras').hidden = gain <= 0;
	$('dust-preview').textContent = `(+${gain.toLocaleString()})`;
}
function refreshOwned() {
	const col = state.collection || {};
	owned = Object.entries(col).filter(([id, n]) => n > 0 && byId[id]).map(([id, n]) => ({ card: byId[id], count: n }));
}

(async () => {
	// account state (server-owned collection) + the card database + the renderer
	try { state = await MP.freshState(); } catch (e) { state = MP.cachedState(); }
	if (!state) { location.replace('/login/?next=' + encodeURIComponent('/collection/')); return; }
	$('who').textContent = state.username;

	const [art, raw, pool] = await Promise.all([
		import('../battlecards/cardart.js'),
		fetch('../battlecards/cards.json').then(r => r.json()),
		fetch('/server/pool-rarity.json').then(r => r.json()).catch(() => null),
	]);
	CardArt = art;
	cards = raw.cards;
	for (const c of cards) byId[c.id] = c;
	poolData = pool;
	poolSize = pool ? Object.keys(pool).length : 0;

	const col = state.collection || {};
	owned = Object.entries(col)
		.filter(([id, n]) => n > 0 && byId[id])
		.map(([id, n]) => ({ card: byId[id], count: n }));

	// the collectible universe = the pack pool (fall back to owned if it's missing)
	poolIds = pool ? Object.keys(pool).filter(id => byId[id]) : owned.map(o => o.card.id);
	poolSize = poolIds.length;
	const canon = c => CardArt.canonClass(c) || 'neutral';
	const clsName = v => (CardArt.classNameOf ? CardArt.classNameOf(v) : v);

	// completion meter (distinct pool cards owned / pool size)
	const ownedDistinct = poolIds.filter(id => (col[id] || 0) > 0).length;
	const copies = owned.reduce((a, o) => a + o.count, 0);
	const pct = poolSize ? Math.round(ownedDistinct / poolSize * 100) : 0;
	$('meter-fill').style.width = pct + '%';
	$('meter-label').textContent = `${ownedDistinct.toLocaleString()} / ${poolSize.toLocaleString()} collected · ${pct}%`;
	$('summary').textContent = `${copies.toLocaleString()} total copies across ${owned.length.toLocaleString()} different cards.`;

	// per-class breakdown
	const poolByClass = {}, ownedByClass = {};
	for (const id of poolIds) { const k = canon(byId[id].cardClass); poolByClass[k] = (poolByClass[k] || 0) + 1; if ((col[id] || 0) > 0) ownedByClass[k] = (ownedByClass[k] || 0) + 1; }
	const classesBySize = Object.keys(poolByClass).sort((a, b) => poolByClass[b] - poolByClass[a] || a.localeCompare(b));
	const cbGrid = $('cb-grid');
	for (const k of classesBySize) {
		const tot = poolByClass[k], own = ownedByClass[k] || 0, p = tot ? Math.round(own / tot * 100) : 0;
		const row = document.createElement('div'); row.className = 'cb-row';
		row.innerHTML = `<div class="cb-top"><span>${esc(clsName(k))}</span><b>${own}/${tot}</b></div><div class="cb-bar"><div style="width:${p}%"></div></div>`;
		cbGrid.appendChild(row);
	}
	$('completion').hidden = false;

	// filter options span the whole pool so Missing / All can filter too
	const opts = (sel, values, label) => {
		for (const v of values) { const o = document.createElement('option'); o.value = v; o.textContent = label ? label(v) : v; sel.appendChild(o); }
	};
	opts($('f-class'), [...classesBySize].sort((a, b) => clsName(a).localeCompare(clsName(b))), clsName);
	opts($('f-type'), [...new Set(poolIds.map(id => byId[id].type))].sort());
	opts($('f-rarity'), RARITY_ORDER.filter(r => poolIds.some(id => (byId[id].rarity || 'common') === r)));
	$('toolbar').hidden = false;

	for (const id of ['q', 'f-owned', 'f-class', 'f-type', 'f-rarity', 'f-sort']) $(id).addEventListener('input', render);
	$('f-size').addEventListener('input', () => { grid.className = 'card-grid size-' + $('f-size').value; });
	// dust & crafting
	refreshDustUi();
	$('dust-extras').addEventListener('click', async () => {
		const btn = $('dust-extras');
		btn.disabled = true;
		try {
			const r = await MP.call('dust-extras');
			if (r.error) { $('summary').textContent = r.error; }
			else {
				if (r.state) state = r.state;
				refreshOwned(); refreshDustUi(); render();
				$('summary').textContent = r.dusted
					? `♻️ Dusted ${r.dusted.toLocaleString()} extra cop${r.dusted === 1 ? 'y' : 'ies'} for 💎 ${r.gained.toLocaleString()} dust.`
					: 'No extra copies to dust.';
			}
		} catch (e) { $('summary').textContent = 'Dusting failed: ' + String(e.message || e).slice(0, 80); }
		btn.disabled = false;
	});
	render();
})().catch(e => { $('summary').textContent = 'Could not load your collection: ' + e.message; });

let gen = 0; // render generation — a filter change cancels the in-flight chunked render
const RENDER_CAP = 750; // Missing / All can span the whole pool — cap the render, note the rest
async function render() {
	const my = ++gen;
	const q = $('q').value.trim().toLowerCase();
	const mode = $('f-owned').value;
	const fc = $('f-class').value, ft = $('f-type').value, fr = $('f-rarity').value, sort = $('f-sort').value;
	const col = state.collection || {};
	// the working universe depends on the Owned / Missing / All mode
	let universe = owned;
	if (mode !== 'owned') {
		universe = poolIds.map(id => ({ card: byId[id], count: col[id] || 0 }));
		if (mode === 'missing') universe = universe.filter(o => o.count === 0);
	}
	let list = universe.filter(({ card: c }) =>
		(!q || c.name.toLowerCase().includes(q) || (c.description || '').toLowerCase().includes(q)) &&
		(!fc || CardArt.canonClass(c.cardClass) === fc) &&
		(!ft || c.type === ft) &&
		(!fr || (c.rarity || 'common') === fr));
	const rk = c => RARITY_ORDER.indexOf(c.rarity || 'common');
	list.sort((a, b) =>
		sort === 'name' ? a.card.name.localeCompare(b.card.name) :
		sort === 'count' ? b.count - a.count || a.card.name.localeCompare(b.card.name) :
		sort === 'rarity' ? rk(b.card) - rk(a.card) || (a.card.cost ?? 0) - (b.card.cost ?? 0) :
		(a.card.cost ?? 0) - (b.card.cost ?? 0) || a.card.name.localeCompare(b.card.name));

	const total = list.length;
	if (total > RENDER_CAP) list = list.slice(0, RENDER_CAP);
	const kind = mode === 'missing' ? 'missing' : mode === 'all' ? 'total' : 'owned';
	$('countline').textContent = total > RENDER_CAP
		? `Showing ${RENDER_CAP.toLocaleString()} of ${total.toLocaleString()} ${kind} cards — narrow with the filters.`
		: `${total.toLocaleString()} ${kind} card${total === 1 ? '' : 's'}.`;
	grid.replaceChildren();

	// chunked: preload each chunk's real art, snapshot the in-game faces, keep the page responsive
	const CHUNK = 48;
	for (let i = 0; i < list.length; i += CHUNK) {
		if (gen !== my) return;
		const chunk = list.slice(i, i + CHUNK);
		try { await CardArt.preloadArt(chunk.map(o => o.card.id)); } catch (e) {}
		if (gen !== my) return;
		const frag = document.createDocumentFragment();
		for (const { card, count } of chunk) {
			const canvas = CardArt.drawCardFace(card, { count });
			const img = document.createElement('img');
			img.className = 'wiki-face'; img.loading = 'lazy'; img.alt = card.name;
			img.src = canvas.toDataURL();
			const a = document.createElement('a');
			a.className = 'wiki-card' + (count === 0 ? ' unowned' : ''); // dim the ones you don't own
			a.dataset.cid = card.id; a.dataset.count = count;
			a.href = '/designwiki/#/cards/' + card.id;
			a.appendChild(img);
			// craft a missing pool card in place (server validates cost + caps)
			const cost = count === 0 && poolData?.[card.id] && CRAFT_COST[poolData[card.id][0]];
			if (cost) {
				const cb = document.createElement('button');
				cb.className = 'craft-btn';
				cb.textContent = `⚒ Craft (${cost})`;
				cb.title = `Craft ${card.name} for ${cost} dust`;
				cb.addEventListener('click', async (ev) => {
					ev.preventDefault(); ev.stopPropagation();
					cb.disabled = true;
					try {
						const r = await MP.call('craft', { id: card.id });
						if (r.error) { cb.textContent = r.error.slice(0, 26); setTimeout(() => { cb.textContent = `⚒ Craft (${cost})`; cb.disabled = false; }, 1600); return; }
						if (r.state) state = r.state;
						refreshOwned(); refreshDustUi();
						a.classList.remove('unowned'); a.dataset.count = r.count;
						cb.textContent = '✓ Crafted!';
						setTimeout(() => cb.remove(), 1200);
					} catch (e) { cb.textContent = 'failed'; setTimeout(() => { cb.textContent = `⚒ Craft (${cost})`; cb.disabled = false; }, 1600); }
				});
				a.appendChild(cb);
			}
			frag.appendChild(a);
		}
		grid.appendChild(frag);
		await new Promise(r => requestAnimationFrame(r));
	}
}

// ---------- hover tooltip (packs-style inspect) ----------
const tipEl = document.getElementById('tip');
const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
function tipHtml(def, count) {
	const stat = def.type === 'creature' ? ` · ${def.attack}/${def.health}`
		: def.type === 'weapon' ? ` · ${def.attack}/${def.durability}`
		: def.type ? ` · ${esc(def.type)}` : '';
	const cls = ` ${esc(CardArt.classNameOf(def.cardClass))}`;
	const kw = def.keywords?.length ? `<div class="kws">${esc(def.keywords.join(', '))}</div>` : '';
	const kwLines = keywordsFor(def).map(k =>
		`<div class="kwline"><b>${esc(k.label)}</b> <span style="opacity:0.85">${esc(k.text)}</span></div>`).join('');
	return `<div class="nm">${esc(def.name)} <span class="cost">(${def.cost ?? 0})</span></div>`
		+ `<div class="meta">${esc(def.rarity || 'common')}${cls}${stat}${def.tribe ? ' · ' + esc(def.tribe) : ''} · ${count > 0 ? '×' + count + ' owned' : 'not owned'}</div>`
		+ kw
		+ (def.description ? `<div class="rules">${richHtml(def.description)}</div>` : '')
		+ kwLines;
}
function placeTip(e) {
	if (tipEl.style.display !== 'block') return;
	const x = Math.min(e.clientX + 16, innerWidth - tipEl.offsetWidth - 8);
	const y = Math.min(e.clientY + 16, innerHeight - tipEl.offsetHeight - 8);
	tipEl.style.left = Math.max(8, x) + 'px';
	tipEl.style.top = Math.max(8, y) + 'px';
}
grid.addEventListener('mouseover', e => {
	const a = e.target.closest('.wiki-card');
	const def = a && byId[a.dataset.cid];
	if (!def) { tipEl.style.display = 'none'; return; }
	tipEl.innerHTML = tipHtml(def, +a.dataset.count || 0);
	tipEl.style.display = 'block';
	placeTip(e);
});
grid.addEventListener('mousemove', placeTip);
grid.addEventListener('mouseleave', () => { tipEl.style.display = 'none'; });
</script>
	<script type="module" src="/site/topbar.js"></script>
