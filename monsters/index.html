<!DOCTYPE html>
<html lang="en">
<head>
<!-- first, before any game code reads storage: per-account local data (site/account_silo.js) -->
<script src="/site/account_silo.js"></script>
	<title>Your Monsters — Magepunk</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%90%BE</text></svg>">
	<meta name="description" content="The Pokémon in your party and PC boxes from the Magepunk Overworld.">
	<meta name="robots" content="noindex">
	<!-- the site's Balatro-style UI kit (site/ui/): its tokens, the m6x11 font, the .bal-* components -->
	<link rel="preload" href="/micatro/assets/fonts/m6x11plus.ttf?v=2" as="font" type="font/ttf" crossorigin>
	<link rel="stylesheet" href="/site/ui/balatro.css">
	<style>
	/* the Balatro look (site/ui/balatro.css): the page's own colour names map onto the kit's tokens (one look: no
	   light theme); the block at the end of this sheet turns each Pokémon into a kit panel */
	:root { --bg-0:var(--bal-bg); --bg-1:var(--bal-panel-dd); --panel:var(--bal-panel); --panel-2:var(--bal-panel-d); --border:var(--bal-panel-line); --text:var(--bal-text); --muted:var(--bal-text-muted); --gold:var(--bal-money); --blue:var(--bal-blue); --violet:var(--bal-purple); --green:var(--bal-green); --shadow:0 6px 0 var(--bal-panel-dd); }
	* { margin:0; padding:0; box-sizing:border-box; }
	a { color:inherit; text-decoration:none; }
	.wrap { max-width:1040px; margin:0 auto; padding:18px 20px 64px; }
	.back { display:inline-flex; align-items:center; gap:7px; color:var(--muted); font-weight:600; font-size:.92rem; padding:6px 10px; border-radius:8px; }
	.back:hover { color:var(--text); background:var(--panel); }
	.hero { text-align:center; padding:22px 12px 4px; }
	.hero .glyph { font-size:2.6rem; }
	.hero h1 { font-size:clamp(2rem,6vw,3rem); font-weight:900; letter-spacing:-1px; margin-top:4px; background:linear-gradient(120deg, var(--gold) 10%, var(--violet) 60%, var(--blue) 95%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
	.hero .tag { margin-top:8px; color:var(--muted); }
	.section-label { display:flex; align-items:center; gap:12px; margin:30px 4px 14px; color:var(--muted); font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:2px; }
	.section-label::after { content:""; flex:1; height:1px; background:linear-gradient(90deg, var(--border), transparent); }
	.section-label .count { letter-spacing:0; color:var(--gold); }
	.mon-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:14px; }
	.mon { display:flex; gap:12px; align-items:center; padding:14px; border-radius:14px; background:var(--panel); border:1px solid var(--border); box-shadow:var(--shadow); }
	.mon.fainted { opacity:.6; }
	.mon .sprite { flex:0 0 64px; width:64px; height:64px; display:grid; place-items:center; background:var(--panel-2); border-radius:12px; }
	.mon .sprite img { max-width:60px; max-height:60px; image-rendering:pixelated; }
	.mon .info { flex:1; min-width:0; }
	.mon .nm { font-weight:800; font-size:1rem; display:flex; align-items:center; gap:6px; }
	.mon .nm .lv { color:var(--muted); font-weight:700; font-size:.82rem; }
	.mon .nm .g { font-size:.9rem; }
	.mon .g.m { color:var(--blue); } .mon .g.f { color:#ff8ab4; }
	.mon .types { display:flex; gap:5px; margin:6px 0; }
	.mon .t { font-size:.6rem; font-weight:800; letter-spacing:.4px; color:#fff; padding:2px 7px; border-radius:999px; text-shadow:0 1px 1px rgba(0,0,0,.35); }
	.mon .hp { height:8px; border-radius:999px; background:var(--panel-2); overflow:hidden; }
	.mon .hp > span { display:block; height:100%; border-radius:999px; background:var(--green); }
	.mon .hpn { font-size:.7rem; color:var(--muted); margin-top:3px; }
	.mon .ab { font-size:.72rem; color:var(--muted); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
	.mon .dex { font-size:.66rem; color:var(--muted); }
	.empty { text-align:center; color:var(--muted); padding:44px 20px; line-height:1.7; }
	.empty a { color:var(--blue); font-weight:700; }
	footer { margin-top:40px; text-align:center; color:var(--muted); font-size:.84rem; }
	footer a { color:var(--blue); font-weight:600; }

	/* ---- the Balatro look: the felt + m6x11 (body.bal-page); the rem sizes above grow a step for the pixel font */
	html { font-size:19px; }
	.bal-page b, .bal-page strong { font-weight:normal; }
	.bal-page a.back { --b:var(--bal-orange); --bd:var(--bal-orange-d); background:var(--b); color:#fff; box-shadow:0 4px 0 var(--bd); text-shadow:0 2px 0 rgba(0,0,0,.3); font-weight:normal; border-radius:10px; padding:8px 12px 6px; }
	.bal-page a.back:hover { filter:brightness(1.1); background:var(--b); }
	.bal-page a.back:active { transform:translateY(3px); box-shadow:0 1px 0 var(--bd); }
	.hero h1 { font-weight:normal; font-size:clamp(40px, 11vw, 64px); letter-spacing:0; background:none; -webkit-text-fill-color:currentColor; color:#fff; text-shadow:.03em .04em 0 var(--bal-red), .06em .08em 0 var(--bal-blue), .07em .12em 0 rgba(0,0,0,.3); }
	.hero .tag, .empty, footer { color:var(--bal-text-soft); }
	.section-label { font-weight:normal; font-size:1.2rem; text-transform:none; letter-spacing:0; color:var(--bal-text-soft); text-shadow:var(--bal-text-shadow); }
	.section-label::after { height:4px; border-radius:2px; background:rgba(0,0,0,.22); }
	.mon { border:0; border-radius:16px; box-shadow:0 6px 0 var(--bal-panel-dd), inset 0 0 0 3px var(--bal-panel-line); }
	.mon .sprite { background:var(--bal-panel-dd); }
	.mon .nm { font-weight:normal; font-size:1.15rem; }
	.mon .nm .lv { font-weight:normal; }
	.mon .t { font-weight:normal; font-size:.75rem; padding:2px 8px 0; border-radius:7px; box-shadow:0 2px 0 rgba(0,0,0,.25); }
	.mon .hp { height:12px; border-radius:6px; background:rgba(0,0,0,.4); }
	.mon .hp > span { border-radius:6px; }
	.bal-page .empty a, .bal-page footer a { color:#9fd3ff; font-weight:normal; }
	</style>
</head>
<body class="bal-page">
	<div class="wrap">
		<a class="back" href="/">← Magepunk</a>
		<header class="hero">
			<div class="glyph">🐾</div>
			<h1>Your Monsters</h1>
			<p class="tag">The Pokémon in your party and PC boxes from the Overworld.</p>
		</header>
		<div id="content"></div>
		<footer>Roaming in the <a href="/overworld/">Overworld</a>. Your team lives on this device.</footer>
	</div>
	<script type="module" src="./monsters.js"></script>
	<!-- no mouse needed: arrows / WASD / d-pad move, Z / Enter / A picks, X / B backs out (site/focusnav.js) -->
	<script type="module">import { initFocusNav } from '/site/focusnav.js'; initFocusNav();</script>
	<script type="module" src="/site/topbar.js"></script>
	<!-- Balatro's button sounds on every button and link (site/pagesounds.js; nothing plays before a press, no music) -->
	<script type="module">import { wirePage } from '/site/pagesounds.js'; wirePage();</script>
</body>
</html>
