<!DOCTYPE html>
<html lang="en">
<head>
	<title>Magepunk — Report a Bug</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="robots" content="noindex">
	<link rel="icon" href="data:,">
	<style>
		html, body { margin: 0; min-height: 100%; background: #0d0a14; color: #e8e2f4; font: 14px 'Segoe UI', system-ui, sans-serif; }
		.wrap { max-width: 760px; margin: 0 auto; padding: 22px 16px 60px; }
		header { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
		h1 { font-size: 22px; margin: 0; }
		a { color: #9d8fd4; }
		.hint { color: #8b82a8; font-size: 12.5px; margin: 4px 0 18px; line-height: 1.5; }
		label { display: block; font-weight: 600; margin: 14px 0 5px; }
		input, select, textarea { width: 100%; box-sizing: border-box; background: #241b38; color: #e8e2f4; border: 1px solid #4a3f6b; border-radius: 8px; padding: 9px 11px; font: 13.5px 'Segoe UI', sans-serif; }
		textarea { min-height: 260px; resize: vertical; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; line-height: 1.5; }
		.row { display: flex; gap: 12px; } .row > div { flex: 1; }
		button { background: #3a2e5c; color: #e8e2f4; border: 1px solid #6a5f8a; border-radius: 8px; padding: 9px 18px; cursor: pointer; font: 600 14px 'Segoe UI', sans-serif; margin-top: 16px; }
		button:hover { background: #4c3d78; } button:disabled { opacity: .5; cursor: default; }
		.ctx { background: #171226; border: 1px solid #352c52; border-radius: 10px; padding: 9px 12px; margin-top: 14px; font: 12px ui-monospace, Consolas, monospace; color: #b9b0d4; white-space: pre-wrap; }
		#msg { min-height: 20px; margin-top: 10px; color: #9fd8b0; }
		#msg.err { color: #f0b8b8; }
		#mine { margin-top: 30px; } #mine h2 { font-size: 15px; margin: 0 0 8px; }
		#mine li { color: #c3bbdc; margin: 4px 0; } #mine .when { color: #8b82a8; font-size: 12px; }
		@media (max-width: 560px) { .row { flex-direction: column; gap: 0; } }
	</style>
</head>
<body>
	<div class="wrap">
		<header><a href="/" title="Magepunk home" style="text-decoration:none;font-size:20px;">⚙️</a><h1>Report a Bug</h1></header>
		<div class="hint">For playtesters. Describe what you did, what happened, and what you expected — paste a whole report if you have one (markdown is fine).
			Opened from the game, the map and position are attached for you. Michael reviews these on the Bug Report Review list.</div>
		<form id="f">
			<label for="title">Title</label>
			<input id="title" maxlength="140" placeholder="e.g. Aqua Hideout Electrode ball becomes a junk item">
			<div class="row">
				<div><label for="area">Where</label>
					<select id="area"><option value="overworld">Pokémon overworld</option><option value="battlecards">Battlecards</option><option value="site">Website / other</option></select></div>
				<div><label for="severity">How bad</label>
					<select id="severity"><option value="blocker">Blocker — can't continue</option><option value="bug" selected>Bug</option><option value="cosmetic">Cosmetic</option><option value="idea">Idea / improvement</option></select></div>
			</div>
			<label for="text">What happened</label>
			<textarea id="text" required placeholder="Steps to reproduce, what you saw, what you expected…"></textarea>
			<div class="ctx" id="ctx" hidden></div>
			<button id="send" type="submit">Send report</button>
			<div id="msg"></div>
		</form>
		<div id="mine" hidden><h2>Your open reports</h2><ul id="mine-list"></ul></div>
	</div>
	<script type="module">
	import * as MP from '/battlecards/mpmode.js';
	const $ = id => document.getElementById(id);
	const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
	if (MP.requireLogin()) {
		// context handed over by the game (OPTIONS > REPORT A BUG): only these keys
		const qp = new URLSearchParams(location.search);
		const context = {};
		for (const k of ['map', 'x', 'y', 'region', 'rev', 'facing', 'party', 'build', 'from']) if (qp.has(k)) context[k] = /^-?\d+$/.test(qp.get(k)) ? +qp.get(k) : qp.get(k);
		if (qp.get('area')) $('area').value = qp.get('area');
		context.ua = navigator.userAgent.slice(0, 160);
		context.screen = innerWidth + 'x' + innerHeight;
		const shown = Object.entries(context).filter(([k]) => k !== 'ua');
		if (shown.length > 1) { $('ctx').hidden = false; $('ctx').textContent = 'Attached: ' + shown.map(([k, v]) => k + '=' + v).join('  '); }

		async function loadMine() {
			try {
				const r = await MP.call('bug-mine');
				if (r.error) { $('send').disabled = true; $('msg').className = 'err'; $('msg').textContent = r.error; return; }
				const bugs = (r.bugs || []).sort((a, b) => b.ts - a.ts);
				$('mine').hidden = !bugs.length;
				$('mine-list').innerHTML = bugs.map(b => `<li>${esc(b.title || '(untitled)')} <span class="when">— ${esc(b.severity)} · ${esc(new Date(b.ts).toLocaleString())}</span></li>`).join('');
			} catch (e) {}
		}
		$('f').addEventListener('submit', async e => {
			e.preventDefault();
			const text = $('text').value.trim();
			if (!text) return;
			$('send').disabled = true; $('msg').className = ''; $('msg').textContent = 'sending…';
			try {
				const r = await MP.call('bug-add', { title: $('title').value.trim(), area: $('area').value, severity: $('severity').value, text, context });
				if (r.error) throw new Error(r.error);
				$('msg').textContent = 'Sent ✓ — thank you!';
				$('text').value = ''; $('title').value = '';
				loadMine();
			} catch (err) { $('msg').className = 'err'; $('msg').textContent = 'Could not send: ' + String(err.message || err).slice(0, 120); }
			$('send').disabled = false;
		});
		loadMine();
	}
	</script>
</body>
</html>
