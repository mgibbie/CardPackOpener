<!DOCTYPE html>
<html>
<head>
	<title>Magepunk — Overworld (web-native)</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<link rel="icon" href="data:,">
	<style>
		html, body { margin: 0; height: 100%; background: #0d0a14; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none;
			user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
		#screen { image-rendering: pixelated; border: 2px solid #2a2340; border-radius: 4px; max-width: 98vw; height: auto; }
		#bar { color: #9d8fd4; font-size: 13px; margin-top: 8px; display: flex; gap: 18px; }
		#hud { color: #e8e2f4; font-weight: 600; }
		a { color: #9d8fd4; }

		/* virtual controls: shown on touch devices */
		.tbtn {
			position: fixed; z-index: 20; display: none; align-items: center; justify-content: center;
			background: rgba(42,35,64,0.65); border: 1px solid rgba(157,143,212,0.5);
			color: #e8e2f4; border-radius: 12px; font-size: 20px; font-weight: 700;
			user-select: none; -webkit-user-select: none; touch-action: none;
			/* stop iOS from firing the text-selection loupe/magnifier on the glyphs */
			-webkit-touch-callout: none; -webkit-user-modify: read-only; cursor: default;
		}
		.tbtn:active { background: rgba(107,79,212,0.75); }
		body.touch .tbtn { display: flex; }
		/* d-pad, bottom-left */
		#t-up    { left: 74px;  bottom: 138px; width: 58px; height: 58px; }
		#t-down  { left: 74px;  bottom: 18px;  width: 58px; height: 58px; }
		#t-left  { left: 12px;  bottom: 78px;  width: 58px; height: 58px; }
		#t-right { left: 136px; bottom: 78px;  width: 58px; height: 58px; }
		/* A / B, bottom-right */
		#t-a { right: 16px; bottom: 84px; width: 72px; height: 72px; border-radius: 50%; background: rgba(107,79,212,0.55); }
		#t-b { right: 96px; bottom: 22px; width: 60px; height: 60px; border-radius: 50%; }
		/* menu / party / bag, top-right */
		#t-start { right: 12px; top: 12px; width: 62px; height: 40px; font-size: 13px; }
		#t-party { right: 12px; top: 60px; width: 62px; height: 40px; font-size: 13px; }
		#t-bag   { right: 12px; top: 108px; width: 62px; height: 40px; font-size: 13px; }
		body.touch #bar { display: none; }
	</style>
</head>
<body>
	<canvas id="screen"></canvas>
	<div id="bar">
		<span id="hud">Loading…</span>
		<span>arrows/WASD move · Z interact · P party · B bag</span>
		<a href="../">home</a>
	</div>
	<div class="tbtn" id="t-up">▲</div>
	<div class="tbtn" id="t-down">▼</div>
	<div class="tbtn" id="t-left">◀</div>
	<div class="tbtn" id="t-right">▶</div>
	<div class="tbtn" id="t-a">A</div>
	<div class="tbtn" id="t-b">B</div>
	<div class="tbtn" id="t-start">MENU</div>
	<div class="tbtn" id="t-party">PARTY</div>
	<div class="tbtn" id="t-bag">BAG</div>
	<script type="module" src="main.js"></script>
</body>
</html>
