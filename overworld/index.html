<!DOCTYPE html>
<html lang="en">
<head>
	<title>Magepunk — Overworld (web-native)</title>
	<meta charset="UTF-8">
	<link rel="preconnect" href="https://magepunk-owdata.pages.dev" crossorigin>
	<link rel="dns-prefetch" href="https://magepunk-owdata.pages.dev">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<link rel="icon" href="data:,">
	<style>
		html, body { margin: 0; height: 100%; background: #0d0a14; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none;
			user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
		/* main.js sizes the canvas to an exact integer device-pixel scale (no CSS
		   max-* here: a fractional cap on one axis would distort the aspect) */
		#screen { image-rendering: pixelated; border: 2px solid #2a2340; border-radius: 4px; }
		#bar { color: #9d8fd4; font-size: 13px; margin-top: 8px; display: flex; gap: 18px; }
		#hud { color: #e8e2f4; font-weight: 600; }
		#objective { color: #ffd479; font-weight: 600; }
		#objective:empty { display: none; }
		a { color: #9d8fd4; }

		/* virtual controls: shown on touch devices */
		.tbtn {
			position: fixed; z-index: 20; display: none; align-items: center; justify-content: center;
			background: rgba(42,35,64,0.65); border: 1px solid rgba(157,143,212,0.5);
			color: #e8e2f4; border-radius: 12px; font-size: 20px; font-weight: 700;
			user-select: none; -webkit-user-select: none; touch-action: none;
			/* stop iOS from firing the text-selection loupe/magnifier on the glyphs */
			-webkit-touch-callout: none; -webkit-user-modify: read-only; cursor: default;
		}
		.tbtn:active { background: rgba(107,79,212,0.75); }
		body.touch .tbtn { display: flex; }
		/* d-pad, bottom-left — insets keep DOWN off the iOS/Android home-gesture
		   strip and the cluster out of curved corners */
		#t-up    { left: calc(74px + env(safe-area-inset-left, 0px));  bottom: calc(138px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; }
		#t-down  { left: calc(74px + env(safe-area-inset-left, 0px));  bottom: calc(18px + env(safe-area-inset-bottom, 0px));  width: 58px; height: 58px; }
		#t-left  { left: calc(12px + env(safe-area-inset-left, 0px));  bottom: calc(78px + env(safe-area-inset-bottom, 0px));  width: 58px; height: 58px; }
		#t-right { left: calc(136px + env(safe-area-inset-left, 0px)); bottom: calc(78px + env(safe-area-inset-bottom, 0px));  width: 58px; height: 58px; }
		/* A / B, bottom-right */
		#t-a { right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); width: 72px; height: 72px; border-radius: 50%; background: rgba(107,79,212,0.55); }
		#t-b { right: calc(96px + env(safe-area-inset-right, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); width: 60px; height: 60px; border-radius: 50%; }
		/* menu / party / bag, top-right — below the compact topbar's ~48px corner
		   cluster (z-index 55): at top:12 the topbar sat ON TOP of MENU, so phones
		   couldn't open the start menu at all */
		#t-start { right: 12px; top: max(58px, calc(env(safe-area-inset-top, 0px) + 48px)); width: 62px; height: 40px; font-size: 13px; }
		#t-party { right: 12px; top: max(104px, calc(env(safe-area-inset-top, 0px) + 94px)); width: 62px; height: 40px; font-size: 13px; }
		#t-bag   { right: 12px; top: max(150px, calc(env(safe-area-inset-top, 0px) + 140px)); width: 62px; height: 40px; font-size: 13px; }
		body.touch #bar { display: none; }
		/* portrait battle/pvp: main.js grows the canvas to fill the screen
		   (body.scene-tall); the on-canvas buttons are thumb-sized so the
		   virtual pad is redundant — hide it and pin the canvas under the topbar */
		body.scene-tall { justify-content: flex-end; padding-bottom: max(6px, env(safe-area-inset-bottom, 0px)); }
		body.scene-tall .tbtn { display: none !important; }
		body.scene-tall #bar { display: none; }
		body.scene-tall #screen { border-radius: 0; border-left: none; border-right: none; }
		/* on desktop (fine pointer) the d-pad/A/B stay keyboard-only, but keep the
		   top-right utility buttons clickable. Mouse hover for affordance. */
		@media (pointer: fine) {
			body:not(.touch) #t-start,
			body:not(.touch) #t-party,
			body:not(.touch) #t-bag { display: flex; cursor: pointer; }
			body:not(.touch) .tbtn:hover { background: rgba(107,79,212,0.55); border-color: rgba(157,143,212,0.9); }
		}
	</style>
	<meta name="mp-topbar" content="compact">
</head>
<body>
	<canvas id="screen"></canvas>
	<div id="bar">
		<span id="hud">Loading…</span>
		<span id="objective"></span>
		<span>arrows/WASD move · Z interact · Enter menu · P party · B bag</span>
		<a href="../">home</a>
	</div>
	<div class="tbtn" id="t-up">▲</div>
	<div class="tbtn" id="t-down">▼</div>
	<div class="tbtn" id="t-left">◀</div>
	<div class="tbtn" id="t-right">▶</div>
	<div class="tbtn" id="t-a">A</div>
	<div class="tbtn" id="t-b">B</div>
	<div class="tbtn" id="t-start">MENU</div>
	<div class="tbtn" id="t-party">PARTY</div>
	<div class="tbtn" id="t-bag">BAG</div>
	<script type="module" src="main.js"></script>
	<script type="module" src="/site/topbar.js"></script>
</body>
</html>
