<!DOCTYPE html>
<html lang="en">
<head>
<!-- first, before any game code reads storage: per-account local data (site/account_silo.js) -->
<script src="/site/account_silo.js"></script>
	<title>Magepunk — Overworld (web-native)</title>
	<meta charset="UTF-8">
	<link rel="preconnect" href="https://magepunk-owdata.pages.dev" crossorigin>
	<link rel="dns-prefetch" href="https://magepunk-owdata.pages.dev">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<link rel="icon" href="data:,">
	<!-- the site's Balatro-style kit (site/ui/): tokens, the m6x11 font, the felt page -->
	<link rel="preload" href="/micatro/assets/fonts/m6x11plus.ttf?v=2" as="font" type="font/ttf" crossorigin>
	<link rel="stylesheet" href="/site/ui/balatro.css">
	<style>
		html, body { margin: 0; height: 100%; background: #0d0a14; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none;
			user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
		/* main.js sizes the canvas to an exact integer device-pixel scale (no CSS
		   max-* here: a fractional cap on one axis would distort the aspect) */
		#screen { image-rendering: pixelated; border: 2px solid var(--bal-panel-dd); border-radius: 6px; box-shadow: 0 5px 0 rgba(0,0,0,.35); }
		/* the bar under the frame: the kit's dark info strip (m6x11, muted hints, white status, gold objective) */
		#bar { color: var(--bal-text-muted); font-family: var(--bal-font); font-size: 16px; margin-top: 10px; display: flex; gap: 18px;
			background: var(--bal-panel-dd); border-radius: 8px; padding: 5px 12px; box-shadow: 0 3px 0 rgba(0,0,0,.35); }
		#hud { color: var(--bal-text); }
		#objective { color: var(--bal-gold); }
		#objective:empty { display: none; }
		/* .bal-page is for scrolling pages: its min-height (100vh) would stop this body shrinking inside the flex <html>,
		   and with the tall view's padding it then overflows and is centred 27px up, under the topbar (CLOSE could not be
		   tapped); and its 20px type would grow the shared topbar. This page keeps its own sizing: the felt, the font
		   and the kit's components are what it takes from the kit */
		/* and the background is the kit's FLAT --bal-bg, not its fixed felt gradient: under a canvas that redraws every
		   frame the fixed gradient makes Chrome repaint the whole page each frame (MicaSurvivor's pad suite dropped
		   presses to it; micasurvivor/css/bal.css does the same) */
		body.bal-page { min-height: 0; font-size: 16px; background: var(--bal-bg); }
		a { color: #9fd3ff; }

		/* virtual controls: shown on touch devices */
		/* the kit's buttons (balatro.css .bal-btn): a face standing on its darker lip, sinking onto it when pressed;
		   A is the kit's blue (go), B orange (back), MENU orange (Balatro's Options), the rest grey */
		.tbtn {
			position: fixed; z-index: 20; display: none; align-items: center; justify-content: center;
			--face: var(--bal-grey); --lip: var(--bal-grey-d);
			background: var(--face); border: none; box-shadow: 0 5px 0 var(--lip);
			color: var(--bal-text); border-radius: 12px; font-size: 22px; font-family: var(--bal-font); text-shadow: 0 2px 0 rgba(0,0,0,.3);
			opacity: .9;
			user-select: none; -webkit-user-select: none; touch-action: none;
			/* stop iOS from firing the text-selection loupe/magnifier on the glyphs */
			-webkit-touch-callout: none; -webkit-user-modify: read-only; cursor: default;
		}
		.tbtn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--lip); }
		#t-a { --face: var(--bal-blue); --lip: var(--bal-blue-d); }
		#t-b, #t-start { --face: var(--bal-orange); --lip: var(--bal-orange-d); }
		body.touch .tbtn { display: flex; }
		/* d-pad, bottom-left — insets keep DOWN off the iOS/Android home-gesture
		   strip and the cluster out of curved corners */
		#t-up    { left: calc(74px + env(safe-area-inset-left, 0px));  bottom: calc(138px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; }
		#t-down  { left: calc(74px + env(safe-area-inset-left, 0px));  bottom: calc(18px + env(safe-area-inset-bottom, 0px));  width: 58px; height: 58px; }
		#t-left  { left: calc(12px + env(safe-area-inset-left, 0px));  bottom: calc(78px + env(safe-area-inset-bottom, 0px));  width: 58px; height: 58px; }
		#t-right { left: calc(136px + env(safe-area-inset-left, 0px)); bottom: calc(78px + env(safe-area-inset-bottom, 0px));  width: 58px; height: 58px; }
		/* A / B, bottom-right */
		#t-a { right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); width: 72px; height: 72px; border-radius: 50%; }
		#t-b { right: calc(96px + env(safe-area-inset-right, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); width: 60px; height: 60px; border-radius: 50%; }
		/* menu / party / bag, top-right — below the compact topbar's ~48px corner
		   cluster (z-index 55): at top:12 the topbar sat ON TOP of MENU, so phones
		   couldn't open the start menu at all */
		#t-start { right: 12px; top: max(58px, calc(env(safe-area-inset-top, 0px) + 48px)); width: 62px; height: 40px; font-size: 17px; }
		#t-party { right: 12px; top: max(104px, calc(env(safe-area-inset-top, 0px) + 94px)); width: 62px; height: 40px; font-size: 17px; }
		#t-bag   { right: 12px; top: max(150px, calc(env(safe-area-inset-top, 0px) + 140px)); width: 62px; height: 40px; font-size: 17px; }
		body.touch #bar { display: none; }
		/* the shared battle chat (chat.js) docks bottom-left, where the touch
		   d-pad lives on this page — lift it clear */
		body.touch #mp-chat { bottom: 205px; }
		/* portrait overworld: the canvas grows downward (fitCanvas budgets the
		   space below the topbar and above the touch pad) — anchor it to the top
		   so that budget lands where the canvas actually is */
		body.ow-tall:not(.scene-tall) { justify-content: flex-start; padding-top: max(54px, env(safe-area-inset-top, 0px)); }
		/* while a canvas menu is open on the tall canvas, its band sits right
		   under these buttons — hide them (CLOSE / Escape closes the menu) */
		body.ow-tall.ow-menu #t-start, body.ow-tall.ow-menu #t-party, body.ow-tall.ow-menu #t-bag { display: none !important; }
		/* portrait battle/pvp: main.js grows the canvas to fill the screen
		   (body.scene-tall); the on-canvas buttons are thumb-sized so the
		   virtual pad is redundant — hide it and pin the canvas under the topbar */
		body.scene-tall { justify-content: flex-end; padding-bottom: max(6px, env(safe-area-inset-bottom, 0px)); }
		body.scene-tall .tbtn { display: none !important; }
		body.scene-tall #bar { display: none; }
		body.scene-tall #screen { border-radius: 0; border-left: none; border-right: none; }
		/* on desktop (fine pointer) the d-pad/A/B stay keyboard-only, but keep the
		   top-right utility buttons clickable. Mouse hover for affordance. */
		@media (pointer: fine) {
			body:not(.touch) #t-start,
			body:not(.touch) #t-party,
			body:not(.touch) #t-bag { display: flex; cursor: pointer; }
			body:not(.touch) .tbtn:hover { filter: brightness(1.1); opacity: 1; }
		}
	</style>
	<meta name="mp-topbar" content="compact">
	<script type="module" src="/site/zoomfix.js"></script> <!-- iPhone: no stuck zoom -->
</head>
<body class="bal-page">
	<canvas id="screen"></canvas>
	<div id="bar">
		<span id="hud">Loading…</span>
		<span id="objective"></span>
		<span id="keyhints">Arrows/WASD move · [Z] talk · hold [X]/Shift run · [Enter] menu · [Backspace] party · [C] bag · [V] bike · hold Esc: games</span>
		<a href="../" class="bal-btn bal-sm bal-orange bal-back" id="bar-home">home</a>
	</div>
	<div class="tbtn" id="t-up">▲</div>
	<div class="tbtn" id="t-down">▼</div>
	<div class="tbtn" id="t-left">◀</div>
	<div class="tbtn" id="t-right">▶</div>
	<div class="tbtn" id="t-a">A</div>
	<div class="tbtn" id="t-b">B</div>
	<div class="tbtn" id="t-start">MENU</div>
	<div class="tbtn" id="t-party">PARTY</div>
	<div class="tbtn" id="t-bag">BAG</div>
	<script type="module" src="main.js"></script>
	<script type="module" src="/site/topbar.js"></script>
	<!-- the kit's button sounds for the page's own DOM controls (the bar's "home"); the canvas menus play the game's -->
	<script type="module">import { sfx } from '/site/ui/sfx.js'; sfx.wire(document.getElementById('bar'));</script>
</body>
</html>
