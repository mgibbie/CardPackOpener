<!DOCTYPE html>
<html>
<head>
	<title>Mike's Card Pack Opening Simulator</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
	<style>
	/* account corner (top right): Log in when signed out, username chip when in */
	#account-corner {
		position: absolute; top: 14px; right: 16px;
		display: flex; align-items: center; gap: 8px;
		font: 14px system-ui, sans-serif;
	}
	#account-corner a {
		display: inline-block; padding: 7px 16px; border-radius: 8px;
		text-decoration: none; font-weight: 600;
	}
	#login-btn { background: #2b6cb0; color: #fff; }
	#login-btn:hover { background: #245a96; }
	#user-chip { background: #1f2a44; color: #ffe9a8; border: 1px solid #3a4a74; }
	#user-chip:hover { background: #2a3a5e; }
	#user-chip::before { content: '👤 '; }
	</style>
</head>
<body>
	<div id="account-corner"></div>
	<h1>Mike's Card Pack Opening Simulator</h1>
	<p>
		<a href="overworld/">Overworld (web-native)</a> &middot;
		<a href="battlecards/">Battlecards 3D</a> &middot;
		<span id="nav-collection" hidden><a href="collection/">Collection</a> &middot;</span>
		<a href="overworld/pokechess.html">PokéChess</a> &middot;
		<a href="pairofpears/">Pair of Pears</a> &middot;
		<a href="learnmagepunk/">Learn Magepunk</a> &middot;
		<a href="magepunknews/">Magepunk News</a> &middot;
		<a href="designwiki/">Design Wiki</a>
	</p>

	<!-- account corner: Log in button, or username -> /profile/ + the Collection link -->
	<script type="module">
	import * as MP from './battlecards/mpmode.js';
	const corner = document.getElementById('account-corner');
	if (MP.hasToken()) {
		// cached state only — never force a network round-trip (or a logout
		// redirect) just to render the landing page
		const name = MP.cachedState()?.username || 'Account';
		corner.innerHTML = `<a id="user-chip" href="profile/" title="Your profile">${name}</a>`;
		document.getElementById('nav-collection').hidden = false;
	} else {
		corner.innerHTML = `<a id="login-btn" href="login/?next=/">Log in</a>`;
	}
	</script>
</body>
</html>
