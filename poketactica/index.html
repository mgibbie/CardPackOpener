<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
	<title>Poketactica</title>
	<meta name="description" content="Poketactica: an isometric tactics game of Pokémon figurines, with Disgaea's turns, Geo Panels and throws.">
	<meta name="mp-topbar" content="compact">
	<link rel="preload" href="/micatro/assets/fonts/m6x11plus.ttf?v=2" as="font" type="font/ttf" crossorigin>
	<link rel="stylesheet" href="/site/ui/balatro.css">
	<link rel="stylesheet" href="css/poketactica.css">
	<!-- the PMD SpriteCollab sheets' table (MicaSurvivor's): G.SPRITE_META -->
	<script>window.G = window.G || {};</script>
	<script src="/micasurvivor/js/data/sprites-meta.js"></script>
	<script type="importmap">
	{ "imports": { "three": "/battlecards/vendor/three.module.min.js" } }
	</script>
</head>
<body class="bal-page">
	<canvas id="c" aria-label="The battlefield"></canvas>
	<canvas id="nums" aria-hidden="true"></canvas>

	<!-- the battle's HUD (Disgaea's): the turn and the Bonus Gauge on top, what to do next under it -->
	<div id="hud-top" class="pt-top">
		<span id="turn" class="bal-badge bal-blue">Turn 1</span>
		<span id="dive-tag" class="bal-badge bal-purple pt-dive-tag" hidden></span>
		<span id="turn-clock" class="bal-badge bal-grey pt-clock" hidden aria-live="off"></span>
		<span id="queue" class="bal-muted"></span>
		<div class="pt-gauge" title="Bonus Gauge">
			<span class="pt-gauge-label">Bonus</span>
			<div class="bal-bar"><div id="gauge-fill" class="bal-bar-fill"></div></div>
			<span id="gauge-lv" class="bal-badge bal-orange">0</span>
		</div>
	</div>
	<div id="hint" class="pt-hint" aria-live="polite"></div>
	<!-- the first battle's coach: one step at a time (deploy, move, attack, Execute, End turn) -->
	<div id="coach" class="bal-panel bal-outlined pt-coach" hidden>
		<div class="pt-coach-head"><span id="coach-n" class="bal-badge bal-orange"></span><b id="coach-title">Tutorial</b><button id="coach-skip" class="bal-btn bal-sm bal-grey">Skip</button></div>
		<div id="coach-text"></div>
	</div>
	<!-- the FORECAST while aiming (Disgaea's): each target's hit chance, damage and KO -->
	<div id="fc" class="bal-panel pt-fc" hidden></div>
	<!-- what just happened: the enemy phase's summary, or the battle log (the field menu) -->
	<div id="log" class="bal-panel pt-log" hidden></div>

	<!-- the unit under the cursor (C / Status: its moves and Geo effects) -->
	<div id="unit" class="bal-panel pt-unit" hidden>
		<div class="pt-unit-head"><b id="u-name"></b> <span id="u-side" class="bal-badge"></span></div>
		<div class="bal-bar"><div id="u-hpbar" class="bal-bar-fill"></div></div>
		<div class="pt-row"><span id="u-hp"></span> <span id="u-sp" class="bal-muted"></span></div>
		<div id="u-more" class="pt-more">
			<div id="u-stats" class="bal-muted pt-ustats"></div>
			<ul id="u-moves" class="pt-moves"></ul>
		</div>
		<div id="u-geo" class="bal-muted pt-geo"></div>
	</div>

	<!-- the command window: a unit's commands, the base panel's deploy list, the field menu -->
	<div id="menu" class="bal-panel pt-menu" hidden>
		<div id="menu-title" class="pt-menu-title"></div>
		<div id="menu-items" class="pt-menu-items"></div>
	</div>

	<div class="pt-bar">
		<div class="pt-cam">
			<button id="b-left" class="bal-btn bal-sm bal-grey" aria-label="Turn the camera left"><span class="pt-cam-g">⟲</span><span class="pt-cam-w">Left</span></button>
			<button id="b-zoom" class="bal-btn bal-sm bal-grey" aria-label="Zoom"><span class="pt-cam-g">＋</span><span class="pt-cam-w">Zoom</span></button>
			<button id="b-right" class="bal-btn bal-sm bal-grey" aria-label="Turn the camera right"><span class="pt-cam-g">⟳</span><span class="pt-cam-w">Right</span></button>
			<button id="b-danger" class="bal-btn bal-sm bal-grey" aria-label="Show where the foes can reach" aria-pressed="false"><span class="pt-cam-g">👁</span><span class="pt-cam-w">Reach</span></button>
		</div>
		<button id="b-back" class="bal-btn bal-grey pt-touchonly" hidden aria-label="Back">‹<span class="pt-bk-t"> Back</span></button>
		<button id="b-end" class="bal-btn bal-purple">Menu <span class="bal-key">⏎</span></button>
		<button id="b-exec" class="bal-btn bal-orange">Execute <span id="b-exec-n" class="pt-n"></span><span class="bal-key">V</span></button>
	</div>

	<!-- a replay (?replay=<id>): step, play, back to the start, a link to this moment -->
	<div id="rp-bar" class="bal-panel pt-rpbar" hidden>
		<button id="rp-start" class="bal-btn bal-sm bal-grey" aria-label="Back to the start">⏮ <span class="bal-key">X</span></button>
		<button id="rp-back" class="bal-btn bal-sm bal-blue" aria-label="Step back">◀</button>
		<span id="rp-pos" class="bal-badge bal-blue">0 / 0</span>
		<button id="rp-fwd" class="bal-btn bal-sm bal-blue" aria-label="Step forward">▶</button>
		<button id="rp-play" class="bal-btn bal-sm bal-orange">▶ Play <span class="bal-key">Z</span></button>
		<button id="rp-clip" class="bal-btn bal-sm bal-grey">🔗 Moment <span class="bal-key">V</span></button>
	</div>
	<div id="banner" class="pt-banner" hidden></div>
	<div id="toast" class="bal-toast pt-toast" hidden></div>
	<div id="tip" class="bal-panel bal-outlined pt-tip" hidden></div>

	<div id="result" class="bal-modal" hidden>
		<div class="bal-modal-box">
			<div id="r-title" class="bal-modal-title">Victory!</div>
			<div id="r-body"></div>
			<div class="bal-modal-acts"><button id="r-again" class="bal-btn bal-blue">Play again</button></div>
		</div>
	</div>

	<!-- the camp (js/hub.js): every screen outside a battle -->
	<div id="hub" class="ph-root" hidden></div>

	<div id="boot" class="pt-boot">Loading the board…</div>

	<script type="module" src="/site/topbar.js"></script>
	<script type="module" src="js/main.js"></script>
</body>
</html>
