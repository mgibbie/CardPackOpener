	<style>
		html, body { margin: 0; height: 100%; background: #0d0a14; font-family: 'Segoe UI', sans-serif; user-select: none; color: #e8e2f4; overflow: hidden; }
		body {
			background: radial-gradient(ellipse at 50% -10%, #241a3e 0%, #0d0a14 60%);
			display: flex; flex-direction: column;
		}
		#topbar { padding: 12px 20px 4px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
		#topbar h1 { font-size: 17px; letter-spacing: 1px; margin: 0; }
		#topbar a { color: #9d8fd4; font-size: 13px; text-decoration: none; }
		#topbar a:hover { text-decoration: underline; }
		#count { color: #9d8fd4; font-size: 13px; margin-left: auto; }

		#filters { padding: 6px 20px 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
		#search {
			background: #1d1530; border: 1px solid #4a3f6b; border-radius: 8px;
			color: #e8e2f4; padding: 7px 12px; width: 210px; font-size: 13.5px;
		}
		#mana-row { display: flex; gap: 4px; }
		.crystal {
			width: 34px; height: 34px; border-radius: 50%; border: 2px solid #2c3f77;
			background: radial-gradient(circle at 35% 30%, #6f8fe6, #1c4fd6 55%, #0d2a78);
			color: #fff; font-weight: 800; font-size: 14px; cursor: pointer;
			display: flex; align-items: center; justify-content: center; opacity: 0.55;
		}
		.crystal:hover { opacity: 0.85; }
		.crystal.on { opacity: 1; border-color: #ffd25f; box-shadow: 0 0 10px rgba(255,210,95,0.6); }
		select {
			background: #1d1530; color: #e8e2f4; border: 1px solid #4a3f6b;
			border-radius: 8px; padding: 7px 8px; font-size: 13px;
		}
		label.chk { font-size: 13px; color: #b9b0d4; display: flex; align-items: center; gap: 5px; cursor: pointer; }

		#book { flex: 1; display: flex; align-items: center; justify-content: center; gap: 14px; min-height: 0; padding: 0 8px 14px; }
		.arrow {
			width: 52px; height: 52px; border-radius: 50%; border: 2px solid #4a3f6b;
			background: #241b38; color: #c9b8ff; font-size: 24px; cursor: pointer; flex: none;
		}
		.arrow:hover:not(:disabled) { background: #35284f; }
		.arrow:disabled { opacity: 0.3; cursor: default; }

		#grid {
			flex: 1; max-width: 1180px; height: 100%; min-height: 0;
			display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: 1fr 1fr;
			gap: 10px 12px; padding: 10px 6px; align-items: stretch; justify-items: stretch;
		}
		/* each card is bounded by its cell's width AND height so every row fits (no cut-off) */
		.tile { position: relative; display: flex; align-items: center; justify-content: center;
			min-height: 0; min-width: 0; transition: transform 0.12s; cursor: pointer; }
		.tile:hover { transform: scale(1.35); z-index: 5; }
		.tile:focus-visible { outline: 3px solid #a688ff; outline-offset: 2px; z-index: 5; }
		.tile canvas { max-width: 100%; max-height: 100%; width: auto; height: auto; display: block; border-radius: 10px; }
		.tile.unowned canvas { filter: grayscale(0.95) brightness(0.55); }
		.tile .owned {
			position: absolute; right: 4%; top: 3%;
			background: #241b38; border: 1px solid #8f6fff; border-radius: 10px;
			color: #ffd25f; font-size: 12px; font-weight: 800; padding: 2px 7px;
		}
		/* the live iridescent rules gem */
		.tile .gemfx {
			position: absolute; left: 50%; top: 78.2%;
			width: 23.4%; aspect-ratio: 1; transform: translate(-50%, -50%);
			border-radius: 50%; pointer-events: none; mix-blend-mode: screen; opacity: 0.85;
			background: conic-gradient(#ff5f4f, #ffd25f, #57e389, #4fc3ff, #8f6fff, #ff5fd2, #ff5f4f);
			animation: gemspin 14s linear infinite;
		}
		@keyframes gemspin { to { filter: hue-rotate(360deg); } }
		@media (prefers-reduced-motion: reduce) { .tile .gemfx { animation: none; } .tile, .tile * { transition: none !important; } }

		#pageinfo { text-align: center; color: #9d8fd4; font-size: 13px; padding-bottom: 12px; }

		#tip {
			position: fixed; display: none; z-index: 20; width: 264px; pointer-events: none;
			background: rgba(22,16,36,0.97); border: 1px solid #8f6fff; border-radius: 10px;
			padding: 10px 12px; box-shadow: 0 6px 22px rgba(0,0,0,0.7);
		}
		#tip .tt-name { font-weight: 800; font-size: 15px; color: #f4eede; }
		#tip .tt-type { font-size: 10.5px; letter-spacing: 1px; color: #9d8fd4; margin: 2px 0 6px; }
		#tip .tt-desc { font-size: 13px; line-height: 1.45; }
		#tip .tt-kw { margin-top: 5px; padding-top: 5px; border-top: 1px solid rgba(255,255,255,0.12); font-size: 11.5px; line-height: 1.3; }
		#tip .tt-kw b { color: #9fd0ff; }

		/* card zoom: tap any card for a big look + its full info */
		#zoom {
			position: fixed; inset: 0; z-index: 30; display: none;
			background: rgba(8,6,14,0.94);
			align-items: center; justify-content: center; gap: 26px; padding: 18px;
		}
		#zoom.open { display: flex; }
		#zoom-card { flex: none; }
		#zoom-card canvas { display: block; border-radius: 14px; max-height: 82vh; max-width: 58vw; height: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
		#zoom-info { max-width: 320px; }
		#zoom-info .z-name { font-size: 24px; font-weight: 800; color: #f4eede; }
		#zoom-info .z-type { font-size: 12px; letter-spacing: 1.5px; color: #9d8fd4; margin: 4px 0 12px; }
		#zoom-info .z-stats { font-size: 14px; color: #ffd25f; margin-bottom: 12px; }
		#zoom-info .z-desc { font-size: 15px; line-height: 1.55; }
		#zoom-info .tt-kw { margin-top: 7px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.14); font-size: 13px; line-height: 1.35; }
		#zoom-info .tt-kw b { color: #9fd0ff; }
		#zoom-info .z-owned { margin-top: 14px; font-size: 13px; color: #57e389; }
		#zoom-close {
			position: absolute; top: 14px; right: 18px; width: 44px; height: 44px;
			border-radius: 50%; border: 1px solid #6a5f8a; background: #2a2440;
			color: #e8e2f4; font-size: 20px; cursor: pointer;
		}

		/* phones: 2x3 grid, stacked zoom, bigger touch targets */
		@media (max-width: 760px) {
			#topbar { padding: 8px 10px 2px; gap: 10px; }
			#topbar h1 { font-size: 14px; }
			#filters { padding: 4px 10px 6px; gap: 6px; }
			#search { width: 130px; font-size: 12px; padding: 6px 9px; }
			.crystal { width: 27px; height: 27px; font-size: 11px; }
			select { font-size: 11.5px; padding: 5px 5px; }
			#book { gap: 4px; padding: 0 2px 8px; }
			.arrow { width: 38px; height: 38px; font-size: 17px; }
			#grid { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 1fr); gap: 8px; padding: 4px 2px; }
			.tile:hover { transform: none; } /* hover-zoom sticks on touch */
			#zoom { flex-direction: column; gap: 12px; overflow-y: auto; justify-content: flex-start; padding-top: 46px; }
			#zoom-card canvas { max-height: 56vh; max-width: 86vw; }
			#zoom-info { max-width: 92vw; }
			#zoom-info .z-name { font-size: 19px; }
			#zoom-info .z-desc { font-size: 14px; }
		}
	</style>

	{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js" } }

<body>
	<div id="topbar">
		<h1>COLLECTION</h1>
		<a href="index.html">play</a>
		<a href="packs.html">packs</a>
		<a href="deck.html">deck builder</a>
		<span id="count"></span>
	</div>
	<div id="filters">
		<input id="search" type="search" placeholder="Search cards…">
		<div id="mana-row"></div>
		<select id="class-filter" aria-label="Filter by class">
			<option value="">All classes</option>
		</select>
		<select id="type-filter" aria-label="Filter by type">
			<option value="">All types</option>
			<option value="creature">Creatures</option>
			<option value="sorcery">Spells</option>
			<option value="weapon">Weapons</option>
			<option value="secret">Secrets</option>
			<option value="trap">Traps</option>
			<option value="land">Lands</option>
			<option value="heropower">Hero Powers</option>
			<option value="quest">Quests</option>
			<option value="planeswalker">Planeswalkers</option>
			<option value="enchantment">Enchantments</option>
			<option value="artifact">Artifacts</option>
		</select>
		<select id="rarity-filter" aria-label="Filter by rarity">
			<option value="">All rarities</option>
			<option value="common">Common</option>
			<option value="uncommon">Uncommon</option>
			<option value="rare">Rare</option>
			<option value="epic">Epic</option>
			<option value="legendary">Legendary</option>
		</select>
		<label class="chk"><input id="owned-only" type="checkbox"> owned only</label>
		<label class="chk"><input id="show-uncollectible" type="checkbox"> show uncollectible</label>
	</div>
	<div id="book">
		<button class="arrow" id="prev" aria-label="Previous page">◀</button>
		<div id="grid"></div>
		<button class="arrow" id="next" aria-label="Next page">▶</button>
	</div>
	<div id="pageinfo"></div>
	<div id="tip"></div>
	<div id="zoom">
		<button id="zoom-close" aria-label="Close">✕</button>
		<div id="zoom-card"></div>
		<div id="zoom-info"></div>
	</div>
	<!-- bump ?v=… (here and on the ./cardart.js / ./keywords.js imports in
	     viewer.js) on a release to push fresh gallery code+data to all clients -->
	<script type="module" src="viewer.js?v=20260912a"></script>
	<script type="module" src="nav.js?v=20260848a"></script>
