	<style>
		/* Balatro style (site/ui/balatro.css): the felt, kit inputs + buttons, card-like tooltips (a panel over white
		   card text), and the zoom as an outlined kit dialog. The card faces themselves are the game's. */
		html, body { margin: 0; height: 100%; user-select: none; overflow: hidden; }
		body { display: flex; flex-direction: column; }
		/* right padding clears the floating home/inbox cluster (site/topbar.js compact) */
		#topbar { padding: 12px 104px 4px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
		#topbar h1 { font-size: 30px; letter-spacing: .04em; margin: 0; font-weight: normal; text-shadow: .03em .05em 0 var(--bal-red), .06em .1em 0 rgba(0,0,0,.3); }
		#topbar a { color: #9fd3ff; font-size: 20px; text-decoration: none; text-shadow: var(--bal-text-shadow); }
		#topbar a:hover { text-decoration: underline; }
		#count { color: var(--bal-text-soft); font-size: 20px; margin-left: auto; text-shadow: var(--bal-text-shadow); }

		#filters { padding: 6px 20px 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
		#search { width: 220px; font-size: 20px; }
		#mana-row { display: flex; gap: 5px; }
		.crystal { --bal-b: var(--bal-grey); --bal-bd: var(--bal-grey-d);
			width: 36px; height: 36px; border-radius: 9px; font-size: 20px; padding: 0 0 2px;
			display: flex; align-items: center; justify-content: center; margin-bottom: 4px;
			font-family: var(--bal-font); color: #fff; border: 0; cursor: pointer; text-shadow: 0 .08em 0 rgba(0,0,0,.3);
			background: var(--bal-b); box-shadow: 0 .22em 0 var(--bal-bd); transition: transform .06s, box-shadow .06s, filter .1s; }
		.crystal:hover { filter: brightness(1.1); }
		.crystal:active { transform: translateY(.15em); box-shadow: 0 .07em 0 var(--bal-bd); }
		.crystal.on { --bal-b: var(--bal-blue); --bal-bd: var(--bal-blue-d); box-shadow: 0 .22em 0 var(--bal-bd), 0 0 0 3px #fff; }
		.crystal:focus-visible { outline: none; box-shadow: 0 .22em 0 var(--bal-bd), 0 0 0 3px #fff; }
		#filters select { font-size: 20px; padding-top: 6px; padding-bottom: 4px; }
		label.chk { font-size: 20px; color: var(--bal-text-soft); display: flex; align-items: center; gap: 7px; cursor: pointer; text-shadow: var(--bal-text-shadow); }

		#book { flex: 1; display: flex; align-items: center; justify-content: center; gap: 14px; min-height: 0; padding: 0 8px 14px; }
		.arrow { width: 54px; height: 54px; font-size: 24px; padding: 0; flex: none; }

		#grid {
			flex: 1; max-width: 1180px; height: 100%; min-height: 0;
			display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: 1fr 1fr;
			gap: 10px 12px; padding: 10px 6px; align-items: stretch; justify-items: stretch;
		}
		/* each card is bounded by its cell's width AND height so every row fits (no cut-off) */
		.tile { position: relative; display: flex; align-items: center; justify-content: center;
			min-height: 0; min-width: 0; transition: transform 0.12s; cursor: pointer; }
		.tile:hover { transform: scale(1.35); z-index: 5; }
		.tile:focus-visible { outline: 4px solid #fff; outline-offset: 2px; border-radius: 12px; z-index: 5; }
		.tile canvas { max-width: 100%; max-height: 100%; width: auto; height: auto; display: block; border-radius: 10px; filter: drop-shadow(0 5px 0 rgba(0,0,0,.3)); }
		.tile.unowned canvas { filter: grayscale(0.95) brightness(0.55) drop-shadow(0 5px 0 rgba(0,0,0,.3)); }
		/* craft-from-gallery: the ⚒ overlay rides the hover zoom on missing tiles */
		.tile .craft-btn { --bal-b: var(--bal-green); --bal-bd: var(--bal-green-d);
			position: absolute; left: 50%; bottom: 24%; transform: translateX(-50%); z-index: 6;
			border-radius: 8px; padding: 4px 9px 2px; font-size: 14px; white-space: nowrap; opacity: 0;
			font-family: var(--bal-font); color: #fff; border: 0; cursor: pointer; text-shadow: 0 .08em 0 rgba(0,0,0,.3);
			background: var(--bal-b); box-shadow: 0 .22em 0 var(--bal-bd); transition: transform .06s, box-shadow .06s, filter .1s; }
		.tile .craft-btn { transition: opacity .15s; }
		.tile:hover .craft-btn, .tile:focus-visible .craft-btn, .tile:focus-within .craft-btn { opacity: 1; }
		.tile .craft-btn:disabled { --bal-b: var(--bal-disabled); --bal-bd: var(--bal-disabled-d); color: var(--bal-disabled-text); cursor: default; }
		.tile .owned {
			position: absolute; right: 4%; top: 3%;
			background: var(--bal-red); border-radius: 8px; box-shadow: 0 3px 0 var(--bal-red-d);
			color: #fff; font-size: 16px; line-height: 1; padding: 3px 7px 1px; text-shadow: var(--bal-text-shadow);
		}
		/* the live iridescent rules gem */
		.tile .gemfx {
			position: absolute; left: 50%; top: 78.2%;
			width: 23.4%; aspect-ratio: 1; transform: translate(-50%, -50%);
			border-radius: 50%; pointer-events: none; mix-blend-mode: screen; opacity: 0.85;
			background: conic-gradient(#ff5f4f, #ffd25f, #57e389, #4fc3ff, #8f6fff, #ff5fd2, #ff5f4f);
			animation: gemspin 14s linear infinite;
		}
		@keyframes gemspin { to { filter: hue-rotate(360deg); } }
		@media (prefers-reduced-motion: reduce) { .tile .gemfx { animation: none; } .tile, .tile * { transition: none !important; } }

		#pageinfo { text-align: center; color: var(--bal-text-soft); font-size: 20px; padding-bottom: 12px; text-shadow: var(--bal-text-shadow); }
		#pageinfo input {
			width: 64px; font-family: var(--bal-font); font-size: 20px; color: #fff; text-align: center;
			background: var(--bal-panel-dd); border: 3px solid var(--bal-outline-light); border-radius: 8px; padding: 2px 4px 0;
		}
		#zoom-craft { --bal-b: var(--bal-green); --bal-bd: var(--bal-green-d);
			margin-top: 14px; padding: 9px 14px 7px; font-size: 20px; border-radius: 10px;
			font-family: var(--bal-font); color: #fff; border: 0; cursor: pointer; text-shadow: 0 .08em 0 rgba(0,0,0,.3);
			background: var(--bal-b); box-shadow: 0 .22em 0 var(--bal-bd); transition: transform .06s, box-shadow .06s, filter .1s; }
		#zoom-craft:hover:not(:disabled) { filter: brightness(1.1); }
		#zoom-craft:active:not(:disabled) { transform: translateY(.15em); box-shadow: 0 .07em 0 var(--bal-bd); }
		#zoom-craft:disabled { --bal-b: var(--bal-disabled); --bal-bd: var(--bal-disabled-d); color: var(--bal-disabled-text); cursor: default; }

		/* hover tip: Balatro's tooltip — a panel, the name on it, the rules on white card text */
		#tip {
			position: fixed; display: none; z-index: 20; width: 280px; pointer-events: none;
			background: var(--bal-panel); border-radius: 14px; padding: 8px;
			box-shadow: 0 6px 0 var(--bal-panel-dd), inset 0 0 0 3px var(--bal-outline-light);
		}
		#tip .tt-name { font-size: 24px; text-align: center; color: #fff; padding: 2px 6px 0; text-shadow: var(--bal-text-shadow); }
		#tip .tt-type { font-size: 16px; text-align: center; color: var(--bal-text-muted); margin: 2px 0 6px; }
		#tip .tt-desc { font-size: 18px; line-height: 1.1; background: #fff; color: var(--bal-text-dark); border-radius: 9px; padding: 7px 9px 5px; }
		#tip .tt-kw { margin-top: 6px; padding: 6px 8px 4px; border-radius: 9px; background: var(--bal-panel-d); font-size: 16px; line-height: 1.1; color: var(--bal-text-soft); }
		#tip .tt-kw b { color: var(--bal-attn); }

		/* card zoom: tap any card for a big look + its full info */
		#zoom {
			position: fixed; inset: 0; z-index: 30; display: none;
			background: rgba(15,22,24,0.82);
			align-items: center; justify-content: center; gap: 26px; padding: 18px;
		}
		#zoom.open { display: flex; }
		#zoom-card { flex: none; }
		#zoom-card canvas { display: block; border-radius: 14px; max-height: 82vh; max-width: 58vw; height: auto; filter: drop-shadow(0 10px 0 rgba(0,0,0,.35)); }
		#zoom-info { max-width: 340px; background: var(--bal-panel); border-radius: 18px; padding: 14px;
			box-shadow: 0 8px 0 var(--bal-panel-dd), inset 0 0 0 4px var(--bal-outline-light); }
		#zoom-info .z-name { font-size: 34px; color: #fff; text-align: center; text-shadow: .03em .05em 0 var(--bal-red), .06em .1em 0 rgba(0,0,0,.3); }
		#zoom-info .z-type { font-size: 17px; text-align: center; color: var(--bal-text-muted); margin: 4px 0 10px; }
		#zoom-info .z-stats { font-size: 20px; text-align: center; color: var(--bal-money); margin-bottom: 10px; }
		#zoom-info .z-desc { font-size: 20px; line-height: 1.12; background: #fff; color: var(--bal-text-dark); border-radius: 10px; padding: 9px 11px 7px; }
		#zoom-info .tt-kw { margin-top: 7px; padding: 7px 10px 5px; border-radius: 10px; background: var(--bal-panel-d); font-size: 17px; line-height: 1.12; color: var(--bal-text-soft); }
		#zoom-info .tt-kw b { color: var(--bal-attn); }
		#zoom-info .z-owned { margin-top: 12px; font-size: 18px; color: var(--bal-green); text-align: center; }
		#zoom-close { position: absolute; top: 64px; right: 18px; width: 48px; height: 48px; padding: 0; font-size: 24px; /* below the top bar, which covers the corner */
			z-index: 2; /* over the big card: its drop-shadow filter stacks it above earlier positioned siblings */ }

		/* phones: 2x3 grid, stacked zoom, bigger touch targets */
		@media (max-width: 760px) {
			/* left clears the fixed Back button (nav.js), right clears the floating topbar cluster */
			#topbar { padding: 8px 104px 2px 96px; gap: 10px; }
			#topbar h1 { font-size: 22px; }
			#topbar a { font-size: 17px; }
			#filters { padding: 4px 10px 6px; gap: 6px; }
			#search { width: 140px; font-size: 17px; padding: 5px 8px 3px; }
			.crystal { width: 30px; height: 30px; font-size: 16px; }
			#filters select { font-size: 16px; padding: 4px 26px 2px 8px; background-position: right 8px center; }
			label.chk { font-size: 16px; }
			#book { gap: 4px; padding: 0 2px 8px; }
			.arrow { width: 40px; height: 44px; font-size: 18px; }
			#grid { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 1fr); gap: 8px; padding: 4px 2px; }
			.tile:hover { transform: none; } /* hover-zoom sticks on touch */
			#zoom { flex-direction: column; gap: 12px; overflow-y: auto; justify-content: flex-start; padding-top: 46px; }
			#zoom-card canvas { max-height: 56vh; max-width: 86vw; }
			#zoom-info { max-width: 92vw; }
			#zoom-info .z-name { font-size: 26px; }
			#zoom-info .z-desc { font-size: 18px; }
		}
	</style>

<body class="bal-page">
	<div id="topbar">
		<h1>COLLECTION</h1>
		<a href="index.html">play</a>
		<a href="packs.html">packs</a>
		<a href="deck.html">deck builder</a>

	</div>
	<div id="filters">
		<input id="search" class="bal-input" type="search" placeholder="Search cards…">
		<div id="mana-row"></div>
		<select id="class-filter" class="bal-select" aria-label="Filter by class">
			<option value="">All classes</option>
		</select>
		<select id="type-filter" class="bal-select" aria-label="Filter by type">
			<option value="">All types</option>
			<option value="creature">Creatures</option>
			<option value="sorcery">Spells</option>
			<option value="weapon">Weapons</option>
			<option value="secret">Secrets</option>
			<option value="trap">Traps</option>
			<option value="land">Lands</option>
			<option value="heropower">Hero Powers</option>
			<option value="quest">Quests</option>
			<option value="planeswalker">Planeswalkers</option>
			<option value="enchantment">Enchantments</option>
			<option value="artifact">Artifacts</option>
		</select>
		<select id="rarity-filter" class="bal-select" aria-label="Filter by rarity">
			<option value="">All rarities</option>
			<option value="common">Common</option>
			<option value="uncommon">Uncommon</option>
			<option value="rare">Rare</option>
			<option value="epic">Epic</option>
			<option value="legendary">Legendary</option>
		</select>
		<label class="chk"><input id="owned-only" class="bal-check" type="checkbox"> owned only</label>
		<label class="chk"><input id="show-uncollectible" class="bal-check" type="checkbox"> show uncollectible</label>
	</div>
	<div id="book">
		<button class="arrow bal-btn bal-blue" id="prev" aria-label="Previous page">◀</button>
		<div id="grid"></div>
		<button class="arrow bal-btn bal-blue" id="next" aria-label="Next page">▶</button>
	</div>
	<div id="pageinfo"></div>
	<div id="tip"></div>
	<div id="zoom" role="dialog" aria-modal="true" aria-label="Card">
		<button id="zoom-close" class="bal-btn bal-orange bal-back" aria-label="Close">✕</button>
		<div id="zoom-card"></div>
		<div id="zoom-info"></div>
	</div>
	<!-- bump ?v=… (here and on the ./cardart.js / ./keywords.js imports in
	     viewer.js) on a release to push fresh gallery code+data to all clients -->
	<script type="module" src="viewer.js?v=20261110a"></script>
