	<style>
	/* Balatro style (site/ui/balatro.css + bal-skin.css): kit tabs, the board a panel of inset rows like Micatro's run info */
	.wrap { max-width:780px; margin:0 auto; padding:18px 20px 64px; }
	.hero { text-align:center; padding:24px 12px 6px; }
	.hero .glyph { font-size:2.6rem; }
	.hero h1 { font-size:clamp(2.8rem,8vw,4.2rem); margin-top:4px; line-height:1; }
	.hero .tag { margin-top:10px; }
	.tabs { margin:18px 0 20px; }
	.tabs .bal-tab { font-size:20px; }
	#board { background:var(--bal-panel); border-radius:18px; padding:10px; display:flex; flex-direction:column; gap:6px;
		box-shadow:0 7px 0 var(--bal-panel-dd), inset 0 0 0 3px var(--bal-panel-line); }
	.row { display:flex; align-items:center; gap:12px; padding:9px 14px 7px; border-radius:10px; background:var(--bal-panel-d); font-size:21px; }
	.row.head { background:none; color:var(--bal-text-muted); font-size:17px; padding-top:4px; padding-bottom:0; }
	.row.you { box-shadow:inset 0 0 0 3px var(--bal-attn); }
	.row .rk { width:44px; color:var(--bal-text-muted); flex-shrink:0; }
	.row.top1 .rk { color:var(--bal-gold); }
	.row.top2 .rk { color:#dfe7e8; }
	.row.top3 .rk { color:#e4955f; }
	.row .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
	.row .hv { color:var(--bal-text-muted); font-size:18px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:34%; }
	.row .sc { color:var(--bal-money); flex-shrink:0; min-width:66px; text-align:right; }
	.row.head .sc { color:var(--bal-text-muted); }
	.empty { text-align:center; padding:42px 20px; line-height:1.3; }
	#you-line { text-align:center; color:var(--bal-text-soft); margin-top:16px; min-height:20px; text-shadow:var(--bal-text-shadow); }
	#you-line b { color:var(--bal-money); }
	footer { margin-top:36px; text-align:center; font-size:.9rem; }
	</style>
	<link rel="stylesheet" href="bal-skin.css">
</head>
<body class="bal-page">
	<div class="wrap">
		<a class="back" href="start.html">← Battlecards</a>
		<header class="hero">
			<div class="glyph">🏆</div>
			<h1>Leaderboards</h1>
			<p class="tag">The PvP ladder, the Arena board, and every run mode's best climbs.</p>
		</header>
		<div class="tabs bal-tabs" id="tabs" role="tablist"></div>
		<div id="board"><div class="empty">Loading…</div></div>
		<div id="you-line"></div>
		<footer>Boards show the top 50. A run counts its best result; PvP is Elo (K=32, everyone starts at 1000).</footer>
	</div>
	<script type="module">
	import * as MP from './mpmode.js';
	import { initFocusNav, isTyping } from '/site/focusnav.js';
	const $ = id => document.getElementById(id);
	const esc = s => { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; };

	// tab key -> [label, api action, extra payload, row renderer]
	const runBoard = mode => ['run-leaderboard', { mode }];
	const TABS = {
		pvp: ['PvP', () => ['pvp-leaderboard', {}]],
		arena: ['Arena', () => ['arena-leaderboard', {}]],
		duels: ['Duels', () => runBoard('duels')],
		lorequest: ['Lorequest', () => runBoard('lorequest')],
		middleearth: ['Middle-earth', () => runBoard('middleearth')],
		swordcoast: ['Sword Coast', () => runBoard('swordcoast')],
		finalfantasy: ['Final Fantasy', () => runBoard('finalfantasy')],
		multiverse: ['Multiverse', () => runBoard('multiverse')],
	};
	let current = location.hash.slice(1) in TABS ? location.hash.slice(1) : 'pvp';

	const tabsEl = $('tabs');
	for (const [key, [label]] of Object.entries(TABS)) {
		const b = document.createElement('button');
		b.className = 'bal-btn bal-tab';
		b.setAttribute('role', 'tab');
		b.textContent = label;
		b.dataset.key = key;
		b.addEventListener('click', () => { current = key; location.hash = key; paint(); load(); });
		tabsEl.appendChild(b);
	}
	function paint() {
		for (const b of tabsEl.children) { const on = b.dataset.key === current; b.classList.toggle('on', on); b.classList.toggle('is-on', on); b.setAttribute('aria-selected', String(on)); }
	}

	const scoreOf = e => current === 'pvp' ? `${e.rating}` : `${e.wins}–${e.losses}`;
	const heroOf = e => current === 'pvp' ? (e.wins ? `${e.wins} win${e.wins === 1 ? '' : 's'}` : '') : (e.hero || '');

	function render(data) {
		const board = $('board');
		const top = (data && data.top) || [];
		const me = MP.cachedState()?.username || null;
		if (!top.length) {
			board.innerHTML = `<div class="empty">No entries yet — be the first!<br>${current === 'pvp'
				? 'Win a live duel to claim a rating.' : 'Finish a strong run and it lands here.'}</div>`;
		} else {
			board.innerHTML = `<div class="row head"><span class="rk">#</span><span class="nm">Player</span><span class="hv">${current === 'pvp' ? 'Record' : 'Hero'}</span><span class="sc">${current === 'pvp' ? 'Rating' : 'Best run'}</span></div>`
				+ top.map((e, i) => `<div class="row${i < 3 ? ' top' + (i + 1) : ''}${e.name === me ? ' you' : ''}">`
					+ `<span class="rk">${i + 1}</span><span class="nm">${esc(e.name)}</span>`
					+ `<span class="hv">${esc(heroOf(e))}</span><span class="sc">${esc(scoreOf(e))}</span></div>`).join('');
		}
		const you = data && data.you;
		$('you-line').innerHTML = you
			? (current === 'pvp'
				? `You: <b>${esc(you.rating)}</b> rating${you.rank ? ` — rank <b>#${you.rank}</b>` : ' — outside the top 100'}`
				: `Your best: <b>${esc(you.wins)}–${esc(you.losses)}</b>${you.hero ? ` as ${esc(you.hero)}` : ''}${you.rank ? ` — rank <b>#${you.rank}</b>` : ' — outside the top 100'}`)
			: '';
	}

	async function load() {
		$('board').innerHTML = '<div class="empty">Loading…</div>';
		$('you-line').textContent = '';
		const [action, payload] = TABS[current][1]();
		try { render(await MP.call(action, payload)); }
		catch (e) { $('board').innerHTML = `<div class="empty">Couldn't load this board — ${esc(e.message || 'network error')}</div>`; }
	}

	// keyboard + controller (controls sweep B3): arrows / WASD / d-pad move a focus
	// ring over the tabs and links, Z / Enter / A pick, Q / E / L / R switch tabs
	// (focusnav sends them as ← / → keydowns), X / Esc / B go back to Battlecards
	const nav = initFocusNav();
	const keys = Object.keys(TABS);
	addEventListener('keydown', e => {
		if (isTyping(document.activeElement)) return;
		if (e.key === 'Escape' && !e.defaultPrevented) { location.href = 'start.html'; return; }
		if (e.isTrusted || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
		const i = (keys.indexOf(current) + (e.key === 'ArrowLeft' ? -1 : 1) + keys.length) % keys.length;
		const b = tabsEl.children[i];
		b.click();
		if (nav && nav.nav.ringOn) nav.nav.focusTo(b);
	});
	window.__boards = { render, get current() { return current; } }; // headless smoke hook
	paint();
	if (!MP.hasToken()) {
		$('board').innerHTML = '<div class="empty">Log in to see the boards (and your own rank).<br><a href="/login/?next=%2Fbattlecards%2Fboards.html">Log in →</a></div>';
	} else load();
	</script>
	<script type="module" src="/site/topbar.js"></script>
	<script type="module" src="/battlecards/bal-ui.js"></script>
</body>
</html>
