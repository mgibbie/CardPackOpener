<!DOCTYPE html>
<html lang="en">
<head>
	<title>Magepunk — Card Art Tuner</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="data:,">
	<style>
		html, body { margin: 0; height: 100%; background: #0d0a14; color: #e8e2f4; font: 13px 'Segoe UI', sans-serif; }
		#app { display: flex; height: 100vh; }
		#side { width: 290px; display: flex; flex-direction: column; border-right: 1px solid #352c52; }
		#side input { margin: 10px; padding: 7px 9px; background: #241b38; color: #e8e2f4; border: 1px solid #4a3f6b; border-radius: 8px; }
		#list { flex: 1; overflow-y: auto; }
		#list .row { padding: 6px 12px; cursor: pointer; border-bottom: 1px solid #1d1730; }
		#list .row:hover { background: #241b38; }
		#list .row.sel { background: #33265c; }
		#list .row .id { opacity: 0.55; font-size: 11px; }
		#list .row .tuned { color: #ffd25f; }
		#list .row.noart { opacity: 0.55; }
		#list .row.noart .id::after { content: ' · no art'; color: #d98a8a; }
		#main { flex: 1; overflow-y: auto; padding: 18px; }
		#previews { display: flex; gap: 22px; flex-wrap: wrap; align-items: flex-start; }
		.pv { text-align: center; }
		.pv .label { margin-bottom: 6px; opacity: 0.75; letter-spacing: 1px; font-size: 11px; }
		.pv canvas { border-radius: 12px; cursor: grab; touch-action: none; display: block; }
		.pv canvas:active { cursor: grabbing; }
		#controls { margin-top: 16px; max-width: 560px; }
		#controls .rowc { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
		#controls input[type=range] { flex: 1; }
		button { background: #2a2440; color: #e8e2f4; border: 1px solid #6a5f8a; border-radius: 8px; padding: 7px 14px; cursor: pointer; }
		button:hover { background: #3a3258; }
		#save { background: #6b4fd4; }
		pre { background: #100c1e; border: 1px solid #352c52; border-radius: 8px; padding: 8px; white-space: pre-wrap; word-break: break-all; }
		#msg { min-height: 16px; color: #9fd8b0; }
		.hint { opacity: 0.6; font-size: 12px; margin-top: 4px; }
		/* phones: stack the card list above the previews */
		@media (max-width: 700px) {
			#app { flex-direction: column; }
			#side { width: 100%; flex: none; border-right: 0; border-bottom: 1px solid #352c52; }
			#list { max-height: 34vh; }
			#main { padding: 12px; }
			#previews .pv canvas { width: min(300px, 78vw) !important; }
		}
	</style>
</head>
<body>
	<div id="app">
		<div id="side">
			<input id="search" placeholder="search cards with art…">
			<div id="list"></div>
		</div>
		<div id="main">
			<h2 style="margin:0 0 4px;">Card Art Tuner</h2>
			<div class="hint">Drag a preview to move the focus · scroll to zoom · arrows nudge, +/- zoom. Zoom 1 = the default cover fit.</div>
			<div id="previews" style="margin-top:14px;">
				<div class="pv"><div class="label">CARD FACE</div><canvas id="face" width="512" height="716" style="width:300px;"></canvas></div>
				<div class="pv" id="tokenwrap"><div class="label">BOARD TOKEN</div><canvas id="token" width="320" height="400" style="width:220px;"></canvas></div>
			</div>
			<div id="controls">
				<div class="rowc"><span style="width:44px;">zoom</span><input id="zoom" type="range" min="1" max="4" step="0.02" value="1"><span id="zoomval" style="width:44px;text-align:right;">1.00</span></div>
				<div class="rowc">
					<button id="prev">◀ prev</button>
					<button id="next">next ▶</button>
					<button id="reset">Reset card</button>
					<button id="copy">Copy all</button>
					<button id="save">Save</button>
				</div>
				<div class="rowc">
					<button id="upload">Replace image…</button>
					<input id="file" type="file" accept="image/*" style="display:none;">
					<span id="artstate" style="color:#ffd25f;"></span>
				</div>
				<div class="hint">…or drop an image file onto a preview. Uploads are re-encoded to jpg (max 768px) and saved to battlecards/art/&lt;id&gt;.jpg on Save.</div>
				<div id="msg"></div>
				<pre id="json">{}</pre>
			</div>
		</div>
	</div>
	<script type="importmap">
	{ "imports": { "three": "/battlecards/vendor/three.module.min.js" } }
	</script>
	<script type="module" src="arttune.js"></script>
</body>
</html>
