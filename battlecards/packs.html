<!DOCTYPE html>
<html>
<head>
	<title>Magepunk Battlecards — Packs</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="data:,">
	<style>
		html, body { margin: 0; height: 100%; overflow: hidden; background: #0e0b16; font-family: 'Segoe UI', sans-serif; user-select: none; }
		#scene { position: fixed; inset: 0; }
		.hud { position: fixed; color: #e8e2f4; text-shadow: 0 2px 6px #000; pointer-events: none; }
		#title { top: 12px; left: 18px; font-size: 17px; font-weight: 700; letter-spacing: 1px; }
		#title a { color: #9d8fd4; font-weight: 400; font-size: 13px; text-decoration: none; margin-left: 12px; pointer-events: auto; }
		#title a:hover { text-decoration: underline; }
		#gold { top: 14px; right: 20px; font-size: 16px; font-weight: 700; color: #ffd25f; }
		#hint { bottom: 22px; left: 50%; transform: translateX(-50%); font-size: 15px; color: #c9b8ff; }
		#toast {
			top: 18%; left: 50%; transform: translateX(-50%);
			font-size: 30px; font-weight: 900; letter-spacing: 2px; color: #ffd25f;
			text-shadow: 0 0 18px rgba(255,210,95,0.8), 0 3px 10px #000;
			opacity: 0; transition: opacity 0.3s;
		}
		#next-btn {
			position: fixed; bottom: 52px; left: 50%; transform: translateX(-50%);
			padding: 12px 26px; border-radius: 10px; border: 1px solid #6a5a9a;
			background: linear-gradient(180deg, #4d3c80, #33285c); color: #f2ecff;
			font: 600 16px 'Segoe UI', sans-serif; letter-spacing: 0.5px; cursor: pointer;
			box-shadow: 0 6px 22px rgba(0,0,0,0.55);
		}
		#next-btn:hover { filter: brightness(1.18); }
	</style>
	<script type="importmap">
	{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js" } }
	</script>
</head>
<body>
	<div id="scene"></div>
	<div id="title" class="hud">PACK OPENING <a href="index.html">play</a> <a href="deck.html">deck builder</a> <a href="viewer.html">gallery</a></div>
	<div id="gold" class="hud">…</div>
	<div id="hint" class="hud"></div>
	<div id="toast" class="hud"></div>
	<button id="next-btn" hidden>Open another pack</button>
	<script type="module" src="packs.js"></script>
	<script type="module" src="nav.js"></script>
</body>
</html>
