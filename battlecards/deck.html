	<style>
		/* Balatro style (site/ui/balatro.css): the felt, kit buttons / tabs / inputs, the deck panel a kit panel of
		   inset rows, dialogs as outlined kit boxes, card-like tooltips. Card faces stay the game's. */
		* { box-sizing: border-box; }
		html, body { margin: 0; height: 100%; -webkit-text-size-adjust: 100%; }
		body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
		/* the kit's button look on the controls deck.js builds (and the ones that keep their ids) */
		.crystal, #filters .ftoggle, .slot-row .s-share, #pager button, .tab {
			font-family: var(--bal-font); color: #fff; border: 0; cursor: pointer; text-shadow: 0 .08em 0 rgba(0,0,0,.3);
			background: var(--bal-b); box-shadow: 0 .22em 0 var(--bal-bd); transition: transform .06s, box-shadow .06s, filter .1s; }
		.crystal:hover, #filters .ftoggle:hover, .slot-row .s-share:hover, #pager button:hover:not(:disabled), .tab:hover { filter: brightness(1.1); }
		.crystal:active, #filters .ftoggle:active, .slot-row .s-share:active, #pager button:active:not(:disabled), .tab:active { transform: translateY(.15em); box-shadow: 0 .07em 0 var(--bal-bd); }
		.crystal:focus-visible, #filters .ftoggle:focus-visible, .slot-row .s-share:focus-visible, #pager button:focus-visible, .tab:focus-visible { outline: none; box-shadow: 0 .22em 0 var(--bal-bd), 0 0 0 3px #fff; }

		/* right padding clears the floating home/inbox cluster (site/topbar.js compact) */
		#topbar { display: flex; align-items: center; gap: 10px; padding: 10px 104px 8px 14px; flex-wrap: wrap; }
		#topbar .brand { font-size: 30px; letter-spacing: .04em; font-weight: normal; margin: 0; text-shadow: .03em .05em 0 var(--bal-red), .06em .1em 0 rgba(0,0,0,.3); }
		#topbar a { color: #9fd3ff; text-decoration: none; font-size: 20px; text-shadow: var(--bal-text-shadow); }
		#topbar a:hover { text-decoration: underline; }
		#class-select { font-size: 20px; padding-top: 5px; padding-bottom: 3px; }
		#topbar .spacer { flex: 1; }
		/* dust lives in the top bar so the cost of a missing card is always in view */
		#dust-bal { background: var(--bal-panel-dd); border-radius: 10px; padding: 6px 12px 4px; font-size: 20px; color: var(--bal-money); white-space: nowrap; }
		#dust-extras { white-space: nowrap; }
		#toggle-deck { display: none; }
		#toggle-deck.is-full { --bal-b: var(--bal-green); --bal-bd: var(--bal-green-d); }

		/* CLASS / NEUTRAL: kit tabs (the chosen one red with a white ring) */
		#tabs { display: flex; gap: 10px; padding: 8px 14px 4px; }
		.tab { --bal-b: var(--bal-tab-off); --bal-bd: var(--bal-tab-off-d); flex: 0 0 auto; border-radius: 10px; padding: 7px 20px 5px; font-size: 20px; margin-bottom: 5px; }
		.tab.on { --bal-b: var(--bal-red); --bal-bd: var(--bal-red-d); box-shadow: 0 .22em 0 var(--bal-red-d), 0 0 0 3px #fff; }

		#filters { display: flex; align-items: center; gap: 10px; padding: 6px 14px 8px; flex-wrap: wrap; }
		#search { font-size: 20px; padding-top: 5px; padding-bottom: 3px; min-width: 140px; flex: 1 1 160px; max-width: 260px; }
		#mana-row { display: flex; gap: 5px; flex-wrap: wrap; }
		.crystal { --bal-b: var(--bal-grey); --bal-bd: var(--bal-grey-d); width: 34px; height: 34px; border-radius: 9px; font-size: 20px; padding: 0 0 2px; margin-bottom: 4px; }
		.crystal.on { --bal-b: var(--bal-blue); --bal-bd: var(--bal-blue-d); box-shadow: 0 .22em 0 var(--bal-bd), 0 0 0 3px #fff; }
		#filters .dd { font-size: 18px; padding: 5px 30px 3px 10px; max-width: 170px; background-position: right 10px center; }
		#filters .ftoggle { --bal-b: var(--bal-grey); --bal-bd: var(--bal-grey-d); border-radius: 9px; padding: 6px 16px 4px; font-size: 20px; margin-bottom: 4px; }
		#filters .ftoggle.on { --bal-b: var(--bal-red); --bal-bd: var(--bal-red-d); }

		#main { flex: 1; display: grid; grid-template-columns: 1fr 340px; min-height: 0; }
		#collection { display: flex; flex-direction: column; min-height: 0; }
		#grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
			gap: 14px 12px; padding: 12px; align-content: start; -webkit-overflow-scrolling: touch; }
		.tile { position: relative; cursor: pointer; transition: transform .08s; }
		.tile:hover { transform: translateY(-3px); }
		.tile:focus-visible { outline: 4px solid #fff; outline-offset: 2px; border-radius: 8px; }
		.tile:active { transform: scale(0.96); }
		.tile canvas { width: 100%; display: block; filter: drop-shadow(0 5px 0 rgba(0,0,0,.3)); }
		.tile.depleted { opacity: 0.38; }
		.tile .owned { position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%);
			background: var(--bal-red); box-shadow: 0 3px 0 var(--bal-red-d); color: #fff; font-size: 16px; line-height: 1;
			padding: 4px 12px 2px; border-radius: 8px; white-space: nowrap; pointer-events: none; text-shadow: var(--bal-text-shadow); }
		.tile.depleted .owned { background: var(--bal-disabled); box-shadow: 0 3px 0 var(--bal-disabled-d); color: var(--bal-disabled-text); }
		#empty-hint { grid-column: 1 / -1; padding: 22px; color: var(--bal-text-soft); font-size: 20px; line-height: 1.2; text-shadow: var(--bal-text-shadow); }
		#pager { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 8px 8px 10px; }
		#pager button { --bal-b: var(--bal-blue); --bal-bd: var(--bal-blue-d); border-radius: 9px; width: 46px; height: 38px; font-size: 22px; padding: 0; }
		#pager button:disabled { --bal-b: var(--bal-disabled); --bal-bd: var(--bal-disabled-d); color: var(--bal-disabled-text); cursor: default; }
		#pageinfo { font-size: 20px; color: var(--bal-text-soft); min-width: 90px; text-align: center; text-shadow: var(--bal-text-shadow); }
		#page-jump { width: 64px; font-size: 20px; height: 38px; text-align: center; padding: 2px 4px 0; }

		/* ---------- deck panel (My Decks list  ||  deck editor) ---------- */
		#deck-panel { background: var(--bal-panel); display: flex; flex-direction: column; min-height: 0; margin: 0 10px 10px 0; border-radius: 18px;
			box-shadow: 0 7px 0 var(--bal-panel-dd), inset 0 0 0 3px var(--bal-panel-line); }
		#deck-panel h3 { font-size: 24px; font-weight: normal; margin: 12px 14px 8px; color: #fff; text-shadow: var(--bal-text-shadow); }
		#slot-count { color: var(--bal-text-muted); font-size: 18px; }

		#decks-view, #edit-view { display: flex; flex-direction: column; min-height: 0; flex: 1; }
		#slot-list { flex: 1; overflow-y: auto; padding: 0 12px 14px; }
		.slot-row { position: relative; display: flex; align-items: center; height: 56px; margin-bottom: 10px; border-radius: 12px;
			overflow: hidden; cursor: pointer; box-shadow: 0 4px 0 var(--bal-panel-dd), inset 0 0 0 3px rgba(255,255,255,.18); }
		.slot-row:hover { filter: brightness(1.12); box-shadow: 0 4px 0 var(--bal-panel-dd), inset 0 0 0 3px #fff; }
		.slot-row.active { box-shadow: 0 4px 0 var(--bal-panel-dd), inset 0 0 0 4px var(--bal-attn); }
		.slot-row .s-name { flex: 1; font-size: 22px; padding-left: 14px; color: #fff; text-shadow: 0 2px 0 #000, 0 0 6px #000; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		.slot-row .s-count { font-size: 16px; line-height: 1; padding: 4px 9px 2px; border-radius: 8px; margin-right: 10px; color: #fff; text-shadow: var(--bal-text-shadow); }
		.s-count.full { background: var(--bal-green); box-shadow: 0 3px 0 var(--bal-green-d); }
		.s-count.partial { background: var(--bal-orange); box-shadow: 0 3px 0 var(--bal-orange-d); }
		.slot-row .s-share { --bal-b: var(--bal-blue); --bal-bd: var(--bal-blue-d); flex: 0 0 auto; margin: 0 10px 4px 0; width: 34px; height: 32px; border-radius: 8px; font-size: 15px; padding: 0; display: flex; align-items: center; justify-content: center; }
		#new-deck { width: 100%; height: 52px; }
		#decks-empty { padding: 8px 4px 14px; color: var(--bal-text-soft); font-size: 18px; line-height: 1.2; }
		#starter-section { padding: 4px 12px 16px; margin-top: 10px; }
		.starter-h { margin: 12px 0 2px; }
		.starter-note { font-size: 17px; color: var(--bal-text-soft); margin: 0 0 10px; line-height: 1.15; }
		#starter-list { display: flex; flex-direction: column; gap: 6px; }
		.starter-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px 6px; border-radius: 10px; background: var(--bal-panel-d); border: 0; cursor: pointer; color: #fff; font-family: var(--bal-font); font-size: 20px; text-align: left; width: 100%; }
		.starter-row:hover, .starter-row:focus-visible { outline: none; box-shadow: inset 0 0 0 3px #fff; }
		.starter-row .st-name { flex: 1; }
		.starter-row .st-go { color: var(--bal-attn); }

		#edit-head { display: flex; align-items: center; gap: 10px; padding: 12px 12px 4px; }
		#deck-name { margin: 8px 12px 6px; font-size: 22px; }
		#deck-list { flex: 1; overflow-y: auto; padding: 0 12px; min-height: 60px; }
		.deck-row { display: flex; align-items: center; gap: 8px; padding: 5px 8px 3px; margin-bottom: 4px; background: var(--bal-panel-d); border-radius: 9px; cursor: pointer; font-size: 19px; }
		.deck-row:hover, .deck-row:focus-visible { outline: none; box-shadow: inset 0 0 0 3px #fff; }
		.deck-row .gem { flex: 0 0 26px; height: 26px; border-radius: 8px; background: var(--bal-blue); color: #fff; font-size: 18px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 rgba(0,0,0,.35); text-shadow: var(--bal-text-shadow); padding-top: 2px; }
		.deck-row .dn { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		.deck-row .dx { color: var(--bal-money); }
		#deck-footer { padding: 12px; }
		#deck-stats { margin-bottom: 10px; background: var(--bal-panel-dd); border-radius: 12px; padding: 8px 8px 6px; }
		.ds-curve { display: flex; align-items: flex-end; gap: 3px; height: 54px; }
		.ds-bar { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
		.ds-bar .ds-n { font-size: 13px; line-height: 13px; height: 13px; color: #fff; }
		.ds-bar .ds-fill { width: 100%; min-height: 2px; background: var(--bal-red); border-radius: 3px 3px 0 0; }
		.ds-bar .ds-cost { font-size: 13px; line-height: 14px; color: var(--bal-text-muted); }
		.ds-line { font-size: 15px; color: var(--bal-text-soft); text-align: center; margin-top: 5px; line-height: 1.2; }
		.ds-chip { display: inline-block; background: rgba(0,0,0,.3); border-radius: 999px; padding: 2px 9px 0; margin: 2px 2px 0; color: var(--bal-text-soft); }
		.ds-chip b { color: #fff; }
		.ds-rar { color: var(--bal-text-muted); margin-top: 2px; }
		#deck-count { text-align: center; margin-bottom: 8px; font-size: 24px; text-shadow: var(--bal-text-shadow); }
		#deck-count.is-full { color: var(--bal-green); }
		#save { margin-bottom: 4px; }
		#delete-deck { margin-top: 6px; }
		#code-row { display: flex; gap: 6px; margin-top: 8px; }
		#code-row .bal-btn { flex: 1; padding-left: 4px; padding-right: 4px; }
		#status { font-size: 18px; margin-top: 6px; min-height: 18px; color: var(--bal-money); text-align: center; }
		#panel-close { display: none; }

		/* ---------- card detail page (zoom): an outlined kit dialog ---------- */
		#zoom { position: fixed; inset: 0; z-index: 60; background: rgba(15,22,24,0.7); display: none; align-items: center; justify-content: center; padding: 16px; }
		#zoom.open { display: flex; }
		#zoom-inner { display: flex; gap: 20px; max-width: 780px; width: 100%; align-items: stretch; background: var(--bal-panel); border-radius: 20px; padding: 20px; max-height: 92vh; overflow: auto;
			box-shadow: 0 10px 0 var(--bal-panel-dd), inset 0 0 0 4px var(--bal-outline-light); animation: bal-risein .4s cubic-bezier(.2, 1.2, .4, 1); }
		#zoom-card { flex: 0 0 auto; }
		#zoom-card canvas { width: 260px; max-width: 42vw; display: block; filter: drop-shadow(0 6px 0 rgba(0,0,0,.3)); }
		#zoom-right { flex: 1; display: flex; flex-direction: column; min-width: 180px; }
		#zoom-info { flex: 1; }
		.z-name { font-size: 34px; color: #fff; text-shadow: .03em .05em 0 var(--bal-red), .06em .1em 0 rgba(0,0,0,.3); }
		.z-type { color: var(--bal-text-muted); font-size: 17px; margin: 4px 0 10px; }
		.z-stats { color: var(--bal-money); margin-bottom: 10px; font-size: 20px; }
		.z-desc { font-size: 20px; line-height: 1.12; background: #fff; color: var(--bal-text-dark); border-radius: 10px; padding: 9px 11px 7px; }
		.z-kw { font-size: 17px; color: var(--bal-text-soft); margin-top: 8px; background: var(--bal-panel-d); border-radius: 10px; padding: 7px 10px 5px; line-height: 1.12; }
		.z-owned { margin-top: 14px; color: var(--bal-green); font-size: 20px; }
		#zoom-actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
		#zoom-add, #zoom-craft { flex: 1; }
		@media (prefers-reduced-motion: reduce) { #zoom-inner { animation: none; } }

		/* ---------- commander / companion loadout ---------- */
		#loadout { display: flex; gap: 8px; padding: 0 12px 8px; }
		.lo-slot { flex: 1; text-align: left; padding: 7px 10px 5px; border-radius: 10px; background: var(--bal-panel-d); border: 0; color: var(--bal-text-soft); font-family: var(--bal-font); font-size: 16px; cursor: pointer; line-height: 1.15; min-width: 0; }
		.lo-slot:hover, .lo-slot:focus-visible { outline: none; box-shadow: inset 0 0 0 3px #fff; }
		.lo-slot.set { box-shadow: inset 0 0 0 3px var(--bal-attn); }
		.lo-slot .lo-k { display: block; font-size: 14px; color: var(--bal-text-muted); }
		.lo-slot .lo-v { color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; font-size: 18px; }
		#lopick { position: fixed; inset: 0; z-index: 65; background: rgba(15,22,24,0.7); display: none; align-items: center; justify-content: center; padding: 16px; }
		#lopick.open { display: flex; }
		#lopick-inner { background: var(--bal-panel); border-radius: 20px; padding: 18px; max-width: 700px; width: 100%; max-height: 90vh; overflow: auto;
			box-shadow: 0 10px 0 var(--bal-panel-dd), inset 0 0 0 4px var(--bal-outline-light); }
		#lopick-title { margin: 0 0 12px; color: #fff; font-size: 30px; font-weight: normal; text-align: center; text-shadow: var(--bal-text-shadow); }
		#lopick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
		#lopick-grid .tile { cursor: pointer; }
		#lopick-grid .tile.chosen { outline: 4px solid var(--bal-attn); border-radius: 8px; }
		#lopick-grid .tile canvas { width: 100%; display: block; }
		#lopick-empty { color: var(--bal-text-soft); padding: 10px 4px; }
		#lopick-actions { display: flex; gap: 10px; margin-top: 14px; justify-content: flex-end; }

		/* ---------- drag to add ---------- */
		.drag-ghost { position: fixed; width: 96px; z-index: 100; pointer-events: none; opacity: 0.92; transform: translate(-50%, -50%); filter: drop-shadow(0 6px 0 rgba(0,0,0,0.35)); }
		.drag-ghost canvas { width: 100%; display: block; border-radius: 6px; }
		.drop-hover { outline: 4px dashed var(--bal-green); outline-offset: -4px; }
		#toggle-deck.drop-target { box-shadow: 0 0 0 3px var(--bal-green); }
		.tile { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }

		/* ---------- mobile ---------- */
		@media (max-width: 820px) {
			#toggle-deck { display: inline-flex; }
			#topbar .brand { font-size: 22px; }
			#topbar a { font-size: 17px; }
			#main { grid-template-columns: 1fr; }
			#grid { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 12px 8px; padding: 10px 8px 8px; }
			#deck-panel { position: fixed; inset: 0; z-index: 40; margin: 0; border-radius: 0; transform: translateY(100%); transition: transform .22s ease; }
			#deck-panel.open { transform: translateY(0); }
			#panel-close { display: inline-flex; position: absolute; top: 8px; right: 12px; z-index: 2; }
			/* phones: the controls stay compact so the card grid keeps the screen */
			#topbar { gap: 6px 8px; padding-top: 8px; padding-bottom: 4px; }
			#topbar .bal-btn, #class-select, #dust-bal { font-size: 16px; }
			#tabs { padding-top: 4px; }
			.tab { font-size: 17px; padding: 5px 14px 3px; }
			#filters { gap: 6px; padding-top: 2px; }
			#search { font-size: 17px; }
			#filters .dd { font-size: 15px; max-width: 150px; padding: 4px 26px 2px 8px; background-position: right 8px center; }
			#filters .ftoggle { font-size: 17px; padding: 4px 12px 2px; }
			.crystal { width: 30px; height: 30px; font-size: 17px; }
			#zoom-inner { flex-direction: column; align-items: center; }
			#zoom-card canvas { max-width: 60vw; }
		}
		@media (prefers-reduced-motion: reduce) { .tile, #deck-panel { transition: none !important; } }
	</style>
	<link rel="stylesheet" href="bal-skin.css">
	<script type="importmap">
	{ "imports": { "three": "/battlecards/vendor/three.module.min.js" } }
	</script>

<body class="bal-page">
	<div id="topbar">
		<!-- back affordance comes from the shared nav.js #mp-back button (fixed, top-left);
		     an inline link here duplicated it and, in mp mode, pointed to the wrong place -->
		<h1 class="brand">DECK BUILDER</h1>
		<a href="packs.html">packs</a>
		<a href="viewer.html">gallery</a>
		<select id="class-select" class="bal-select" title="your class"></select>
		<span class="spacer"></span>
		<span id="dust-bal" title="Arcane dust — craft cards you're missing" hidden></span>
		<button id="dust-extras" class="bal-btn bal-blue bal-sm" title="Extra copies beyond a playset are dead weight — turn them into dust" hidden></button>
		<button id="toggle-deck" class="bal-btn bal-red bal-sm">DECK 0/40</button>
	</div>
	<div id="tabs" role="tablist">
		<button class="tab on" role="tab" data-sfx="tab" data-tab="class">CLASS</button>
		<button class="tab" role="tab" data-sfx="tab" data-tab="neutral">NEUTRAL</button>
	</div>
	<div id="filters">
		<input id="search" class="bal-input" placeholder="Search cards…">
		<div id="mana-row"></div>
		<select id="type-filter" class="dd bal-select" title="Filter by card type"><option value="">All types</option></select>
		<select id="kw-filter" class="dd bal-select" title="Filter by keyword"><option value="">All keywords</option></select>
		<select id="set-filter" class="dd bal-select" title="Filter by set"><option value="">All sets</option></select>
		<select id="sort-by" class="dd bal-select" title="Sort cards"><option value="cost">Sort: Cost</option><option value="rarity">Sort: Rarity</option><option value="name">Sort: Name</option></select>
		<button id="owned-toggle" class="ftoggle on" title="Cycle: cards you own → the whole pool → only what you're missing">Owned</button>
	</div>
	<div id="main">
		<div id="collection">
			<div id="grid"></div>
			<div id="pager">
				<button id="prev" aria-label="Previous page">‹</button>
				<span id="pageinfo"></span>
				<input id="page-jump" class="bal-input" type="number" min="1" value="1" aria-label="Jump to page">
				<button id="next" aria-label="Next page">›</button>
			</div>
		</div>
		<aside id="deck-panel">
			<button id="panel-close" class="bal-btn bal-orange bal-back bal-sm" aria-label="Close deck panel">✕</button>
			<!-- My Decks list -->
			<div id="decks-view">
				<h3>MY DECKS <span id="slot-count"></span></h3>
				<div id="slot-list"></div>
				<div id="starter-section" style="display:none">
					<h3 class="starter-h">START FROM A TEMPLATE</h3>
					<p class="starter-note">Ready-to-play decks — one per class, all cards a new account already owns. Load one, then Save it.</p>
					<div id="starter-list"></div>
				</div>
			</div>
			<!-- Deck editor -->
			<div id="edit-view" style="display:none">
				<div id="edit-head">
					<button id="back-to-decks" class="bal-btn bal-orange bal-back bal-sm">← My Decks</button>
				</div>
				<input id="deck-name" class="bal-input" placeholder="Deck name" maxlength="40">
				<div id="loadout">
					<button class="lo-slot" id="lo-commander" data-kind="commander"></button>
					<button class="lo-slot" id="lo-companion" data-kind="companion"></button>
				</div>
				<div id="deck-list"></div>
				<div id="deck-footer">
					<div id="deck-stats" style="display:none">
						<div class="ds-curve" id="ds-curve"></div>
						<div class="ds-line" id="ds-types"></div>
						<div class="ds-line ds-rar" id="ds-rarity"></div>
						<div class="ds-line" id="ds-corr"></div>
					</div>
					<div id="deck-count">0 / 40</div>
					<button id="save" class="bal-btn bal-green bal-wide">Save Deck</button>
					<button id="delete-deck" class="bal-btn bal-red bal-sm bal-wide">Delete This Deck</button>
					<div id="code-row">
						<button id="copy-link" class="bal-btn bal-blue bal-sm" title="Copy a shareable link to this deck">🔗 Copy Link</button>
						<button id="export-code" class="bal-btn bal-blue bal-sm" title="Copy this deck as a short code">📋 Copy Code</button>
						<button id="import-code" class="bal-btn bal-purple bal-sm" title="Load a deck from a pasted code or link">📥 Import</button>
					</div>
					<div id="status"></div>
				</div>
			</div>
		</aside>
	</div>
	<div id="lopick" role="dialog" aria-modal="true" aria-label="Choose a card">
		<div id="lopick-inner">
			<h3 id="lopick-title"></h3>
			<div id="lopick-grid"></div>
			<div id="lopick-actions">
				<button id="lopick-remove" class="bal-btn bal-red">Remove</button>
				<button id="lopick-close" class="bal-btn bal-orange bal-back">Close</button>
			</div>
		</div>
	</div>
	<div id="zoom" role="dialog" aria-modal="true" aria-label="Card">
		<div id="zoom-inner">
			<div id="zoom-card"></div>
			<div id="zoom-right">
				<div id="zoom-info"></div>
				<div id="zoom-actions">
					<button id="zoom-add" class="bal-btn bal-green">＋ Add to Deck</button>
					<button id="zoom-craft" class="bal-btn bal-blue" hidden></button>
					<button id="zoom-close" class="bal-btn bal-orange bal-back">Close</button>
				</div>
			</div>
		</div>
	</div>
	<div id="tip"></div>
	<style>
		/* hover tooltip — Balatro's: a panel with the name, the rules on white card text */
		#tip {
			display: none; position: fixed; z-index: 90; max-width: 300px; pointer-events: none;
			background: var(--bal-panel); color: #fff; border-radius: 14px; padding: 8px;
			font-size: 18px; line-height: 1.12; box-shadow: 0 6px 0 var(--bal-panel-dd), inset 0 0 0 3px var(--bal-outline-light);
		}
		#tip .nm { font-size: 24px; text-align: center; text-shadow: var(--bal-text-shadow); }
		#tip .nm .cost { color: var(--bal-money); }
		#tip .meta { color: var(--bal-text-muted); font-size: 16px; text-transform: capitalize; text-align: center; }
		#tip .kws { color: var(--bal-attn); font-size: 16px; text-align: center; }
		#tip .rules { margin-top: 6px; background: #fff; color: var(--bal-text-dark); border-radius: 9px; padding: 7px 9px 5px; }
		#tip .kwline { margin-top: 6px; padding: 6px 8px 4px; border-radius: 9px; background: var(--bal-panel-d); font-size: 16px; line-height: 1.1; color: var(--bal-text-soft); }
		#tip .kwline b { color: var(--bal-attn); }
	</style>
	<script type="module" src="deck.js"></script>
	<script type="module" src="nav.js"></script>
	<script type="module" src="/site/topbar.js"></script>
	<script type="module" src="/battlecards/bal-ui.js"></script>
</body>
</html>
