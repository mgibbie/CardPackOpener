	<style>
		* { box-sizing: border-box; }
		html, body { margin: 0; height: 100%; background: #0e0b16; font-family: 'Segoe UI', system-ui, sans-serif; color: #e8e2f4; -webkit-text-size-adjust: 100%; }
		body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

		/* right padding clears the floating home/inbox cluster (site/topbar.js compact) */
		#topbar { display: flex; align-items: center; gap: 10px; padding: 10px 104px 10px 14px; border-bottom: 1px solid #2a2340; flex-wrap: wrap; }
		#topbar .brand { font-size: 16px; letter-spacing: 1px; font-weight: 700; margin: 0; }
		#topbar a { color: #9d8fd4; text-decoration: none; font-size: 13px; }
		#topbar a:hover { text-decoration: underline; }
		#class-select { background: #241b38; color: #e8e2f4; border: 1px solid #4a3f6b; border-radius: 6px; padding: 5px 8px; font-size: 14px; }
		#topbar .spacer { flex: 1; }
		#toggle-deck { display: none; background: #6b4fd4; color: #fff; border: none; border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: 700; cursor: pointer; }

		#tabs { display: flex; gap: 6px; padding: 8px 14px 0; }
		.tab { flex: 0 0 auto; background: #1c1430; color: #b7abd6; border: 1px solid #3a3055; border-bottom: none;
			border-radius: 8px 8px 0 0; padding: 8px 18px; font-size: 13px; font-weight: 700; cursor: pointer; }
		.tab.on { background: #2a2145; color: #fff; border-color: #6b4fd4; }

		#filters { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid #2a2340; flex-wrap: wrap; }
		#search { background: #241b38; color: #e8e2f4; border: 1px solid #4a3f6b; border-radius: 6px; padding: 6px 10px; font-size: 14px; min-width: 140px; flex: 1 1 160px; max-width: 260px; }
		#mana-row { display: flex; gap: 4px; flex-wrap: wrap; }
		.crystal { width: 30px; height: 30px; border-radius: 6px; background: #241b38; color: #b7abd6; border: 1px solid #4a3f6b; font-size: 13px; font-weight: 700; cursor: pointer; }
		.crystal.on { background: #2f7fe0; color: #fff; border-color: #6fb0ff; }
		#filters .dd { background: #241b38; color: #e8e2f4; border: 1px solid #4a3f6b; border-radius: 6px; padding: 6px 8px; font-size: 13px; cursor: pointer; max-width: 150px; }
		#filters .ftoggle { background: #241b38; color: #b7abd6; border: 1px solid #4a3f6b; border-radius: 6px; padding: 6px 14px; font-size: 13px; font-weight: 700; cursor: pointer; }
		#filters .ftoggle.on { background: #6b4fd4; color: #fff; border-color: #8f6fff; }

		#main { flex: 1; display: grid; grid-template-columns: 1fr 330px; min-height: 0; }
		#collection { display: flex; flex-direction: column; min-height: 0; }
		#grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
			gap: 10px 12px; padding: 12px; align-content: start; -webkit-overflow-scrolling: touch; }
		.tile { position: relative; cursor: pointer; transition: transform .08s; }
		.tile:focus-visible { outline: 3px solid #a688ff; outline-offset: 2px; border-radius: 6px; }
		.tile:active { transform: scale(0.96); }
		.tile canvas { width: 100%; display: block; }
		.tile.depleted { opacity: 0.38; }
		.tile .owned { position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%);
			background: #16121f; border: 1px solid #6b4fd4; color: #d9ccff; font-size: 12px; font-weight: 800;
			padding: 2px 12px; border-radius: 10px; letter-spacing: .5px; white-space: nowrap; pointer-events: none; }
		.tile.depleted .owned { border-color: #3a3055; color: #8f88a8; }
		#empty-hint { padding: 22px; color: #9b93b3; font-size: 14px; line-height: 1.6; }
		#pager { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 8px; border-top: 1px solid #2a2340; }
		#pager button { background: #241b38; color: #e8e2f4; border: 1px solid #4a3f6b; border-radius: 8px; width: 42px; height: 34px; font-size: 18px; cursor: pointer; }
		#pager button:disabled { opacity: 0.35; cursor: default; }
		#pageinfo { font-size: 13px; color: #b7abd6; min-width: 90px; text-align: center; }

		/* ---------- deck panel (My Decks list  ||  deck editor) ---------- */
		#deck-panel { background: #131022; border-left: 1px solid #2a2340; display: flex; flex-direction: column; min-height: 0; }
		#deck-panel h3 { font-size: 13px; margin: 12px 14px 8px; color: #c9b8ff; letter-spacing: .5px; }
		#slot-count { color: #9b93b3; font-weight: 400; font-size: 12px; }

		#decks-view, #edit-view { display: flex; flex-direction: column; min-height: 0; flex: 1; }
		#slot-list { flex: 1; overflow-y: auto; padding: 0 12px 14px; }
		.slot-row { position: relative; display: flex; align-items: center; height: 54px; margin-bottom: 8px; border-radius: 9px;
			overflow: hidden; cursor: pointer; border: 2px solid #3a3055; }
		.slot-row:hover { filter: brightness(1.12); }
		.slot-row.active { border-color: #57e389; box-shadow: 0 0 0 1px #57e389 inset; }
		.slot-row .s-name { flex: 1; font-weight: 700; font-size: 14.5px; padding-left: 14px; color: #fff; text-shadow: 0 1px 3px #000, 0 0 6px #000; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		.slot-row .s-count { font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 11px; margin-right: 12px; }
		.s-count.full { background: #2f9e5e; color: #fff; }
		.s-count.partial { background: #d1a52a; color: #201800; }
		.slot-row .s-share { flex: 0 0 auto; margin-right: 10px; width: 30px; height: 30px; border-radius: 8px; border: 1px solid #5a4d80; background: rgba(20,14,36,0.72); color: #cdbcff; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
		.slot-row .s-share:hover { background: #6b4fd4; color: #fff; border-color: #8a72e6; }
		#new-deck { display: flex; align-items: center; justify-content: center; gap: 8px; height: 50px; border-radius: 9px;
			background: #1a1330; color: #c9b8ff; border: 2px dashed #4a3f6b; font-size: 14px; font-weight: 700; cursor: pointer; }
		#new-deck:hover { border-color: #8f6fff; color: #fff; }
		#decks-empty { padding: 8px 4px 14px; color: #9b93b3; font-size: 13px; line-height: 1.5; }
		#starter-section { padding: 4px 12px 16px; border-top: 1px solid #2a2340; margin-top: 10px; }
		.starter-h { margin: 12px 0 2px; }
		.starter-note { font-size: 12px; color: #9d8fd4; margin: 0 0 10px; line-height: 1.4; }
		#starter-list { display: flex; flex-direction: column; gap: 6px; }
		.starter-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 9px; background: #201a33; border: 1px solid #3a3055; cursor: pointer; color: #e8e2f4; font: inherit; text-align: left; width: 100%; }
		.starter-row:hover { border-color: #8f6fff; background: #271f40; }
		.starter-row:focus-visible { outline: 2px solid #a688ff; outline-offset: 2px; }
		.starter-row .st-name { flex: 1; font-weight: 600; font-size: 13.5px; }
		.starter-row .st-go { color: #a688ff; font-weight: 800; }

		#edit-head { display: flex; align-items: center; gap: 10px; padding: 12px 12px 4px; }
		#back-to-decks { background: #241b38; color: #cdbcff; border: 1px solid #4a3f6b; border-radius: 8px; padding: 7px 12px; font-size: 13px; font-weight: 700; cursor: pointer; }
		#deck-name { margin: 8px 12px 6px; background: #241b38; color: #e8e2f4; border: 1px solid #4a3f6b; border-radius: 6px; padding: 8px 10px; font-size: 15px; font-weight: 600; }
		#deck-list { flex: 1; overflow-y: auto; padding: 0 12px; min-height: 60px; }
		.deck-row { display: flex; align-items: center; gap: 8px; padding: 5px 8px; margin-bottom: 3px; background: #1c1430; border-radius: 6px; cursor: pointer; font-size: 13px; }
		.deck-row:hover { background: #3a2540; }
		.deck-row .gem { flex: 0 0 24px; height: 24px; border-radius: 50%; background: #2f7fe0; color: #fff; font-weight: 800; font-size: 12.5px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 1px #6fb0ff inset; }
		.deck-row .dn { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		.deck-row .dx { color: #cdbcff; font-weight: 800; }
		#deck-footer { padding: 12px; border-top: 1px solid #2a2340; }
		#deck-stats { margin-bottom: 10px; }
		.ds-curve { display: flex; align-items: flex-end; gap: 3px; height: 48px; }
		.ds-bar { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
		.ds-bar .ds-n { font-size: 9px; line-height: 11px; height: 11px; color: #cdbcff; }
		.ds-bar .ds-fill { width: 100%; min-height: 2px; background: linear-gradient(180deg, #8f6fff, #6b4fd4); border-radius: 3px 3px 0 0; }
		.ds-bar .ds-cost { font-size: 9px; line-height: 12px; color: #7d719e; }
		.ds-line { font-size: 11px; color: #9d8fd4; text-align: center; margin-top: 5px; line-height: 1.4; }
		.ds-rar { color: #7d719e; margin-top: 2px; }
		#deck-count { font-weight: 800; text-align: center; margin-bottom: 8px; font-size: 15px; }
		#save { width: 100%; padding: 12px; font-size: 15px; font-weight: 700; background: #6b4fd4; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
		#save:hover { background: #7d63e6; }
		#delete-deck { width: 100%; margin-top: 6px; padding: 9px; font-size: 13px; background: #3a2540; color: #ffa9a9; border: 1px solid #5a3550; border-radius: 8px; cursor: pointer; }
		#code-row { display: flex; gap: 6px; margin-top: 6px; }
		#code-row button { flex: 1; padding: 9px 4px; font-size: 12px; font-weight: 700; background: #2a2340; color: #cdbcff; border: 1px solid #40356a; border-radius: 8px; cursor: pointer; }
		#code-row button:hover { background: #372c56; color: #e8ddff; }
		#status { font-size: 12.5px; margin-top: 8px; min-height: 18px; color: #ffd25f; text-align: center; }
		#panel-close { display: none; }

		/* ---------- card detail page (zoom) ---------- */
		#zoom { position: fixed; inset: 0; z-index: 60; background: rgba(6,4,12,0.88); display: none; align-items: center; justify-content: center; padding: 16px; }
		#zoom.open { display: flex; }
		#zoom-inner { display: flex; gap: 20px; max-width: 760px; width: 100%; align-items: stretch; background: #141024; border: 1px solid #3a3055; border-radius: 14px; padding: 20px; max-height: 92vh; overflow: auto; }
		#zoom-card { flex: 0 0 auto; }
		#zoom-card canvas { width: 260px; max-width: 42vw; display: block; }
		#zoom-right { flex: 1; display: flex; flex-direction: column; min-width: 180px; }
		#zoom-info { flex: 1; }
		.z-name { font-size: 22px; font-weight: 800; }
		.z-type { color: #b7abd6; font-size: 12.5px; letter-spacing: .5px; margin: 4px 0 10px; }
		.z-stats { color: #cdbcff; font-weight: 700; margin-bottom: 10px; }
		.z-desc { font-size: 14px; line-height: 1.6; }
		.z-kw { font-size: 12.5px; color: #9b93b3; margin-top: 8px; }
		.z-owned { margin-top: 14px; color: #9fd8b0; font-weight: 700; }
		#zoom-actions { display: flex; gap: 10px; margin-top: 18px; }
		#zoom-add { flex: 1; padding: 12px; font-size: 15px; font-weight: 700; background: #6b4fd4; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
		#zoom-add:hover { background: #7d63e6; }
		#zoom-close { padding: 12px 18px; background: #241b38; color: #cdbcff; border: 1px solid #4a3f6b; border-radius: 8px; cursor: pointer; }

		/* ---------- commander / companion loadout ---------- */
		#loadout { display: flex; gap: 8px; padding: 0 12px 8px; }
		.lo-slot { flex: 1; text-align: left; padding: 8px 10px; border-radius: 8px; background: #1c1430; border: 1px solid #3a3055; color: #cdbcff; font-size: 12px; cursor: pointer; line-height: 1.35; min-width: 0; }
		.lo-slot:hover { border-color: #8f6fff; }
		.lo-slot.set { border-color: #6b4fd4; background: #241b38; }
		.lo-slot .lo-k { display: block; font-size: 10px; letter-spacing: .5px; color: #8f88a8; }
		.lo-slot .lo-v { font-weight: 700; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		#lopick { position: fixed; inset: 0; z-index: 65; background: rgba(6,4,12,0.88); display: none; align-items: center; justify-content: center; padding: 16px; }
		#lopick.open { display: flex; }
		#lopick-inner { background: #141024; border: 1px solid #3a3055; border-radius: 14px; padding: 18px; max-width: 680px; width: 100%; max-height: 90vh; overflow: auto; }
		#lopick-title { margin: 0 0 12px; color: #c9b8ff; font-size: 16px; }
		#lopick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
		#lopick-grid .tile { cursor: pointer; }
		#lopick-grid .tile.chosen { outline: 3px solid #57e389; border-radius: 8px; }
		#lopick-grid .tile canvas { width: 100%; display: block; }
		#lopick-empty { color: #9b93b3; padding: 10px 4px; }
		#lopick-actions { display: flex; gap: 10px; margin-top: 14px; justify-content: flex-end; }
		#lopick-remove { padding: 10px 16px; background: #3a2540; color: #ffa9a9; border: 1px solid #5a3550; border-radius: 8px; cursor: pointer; }
		#lopick-close { padding: 10px 16px; background: #241b38; color: #cdbcff; border: 1px solid #4a3f6b; border-radius: 8px; cursor: pointer; }

		/* ---------- drag to add ---------- */
		.drag-ghost { position: fixed; width: 96px; z-index: 100; pointer-events: none; opacity: 0.92; transform: translate(-50%, -50%); filter: drop-shadow(0 6px 12px rgba(0,0,0,0.6)); }
		.drag-ghost canvas { width: 100%; display: block; border-radius: 6px; }
		.drop-hover { outline: 3px dashed #57e389; outline-offset: -3px; }
		#toggle-deck.drop-target { box-shadow: 0 0 0 2px #57e389; }
		.tile { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }

		/* ---------- mobile ---------- */
		@media (max-width: 820px) {
			#toggle-deck { display: inline-block; }
			#main { grid-template-columns: 1fr; }
			#grid { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px 8px; padding: 10px 8px 8px; }
			#deck-panel { position: fixed; inset: 0; z-index: 40; border-left: none; transform: translateY(100%); transition: transform .22s ease; }
			#deck-panel.open { transform: translateY(0); }
			#panel-close { display: block; position: absolute; top: 8px; right: 12px; font-size: 26px; color: #cdbcff; background: none; border: none; cursor: pointer; z-index: 2; }
		}
		@media (prefers-reduced-motion: reduce) { .tile, #deck-panel { transition: none !important; } }
	</style>
	<script type="importmap">
	{ "imports": { "three": "/battlecards/vendor/three.module.min.js" } }
	</script>
</head>
<body>
	<div id="topbar">
		<a href="index.html">← Back</a>
		<h1 class="brand">DECK BUILDER</h1>
		<a href="packs.html">packs</a>
		<a href="viewer.html">gallery</a>
		<select id="class-select" title="your class"></select>
		<span class="spacer"></span>
		<button id="toggle-deck">DECK 0/40</button>
	</div>
	<div id="tabs">
		<button class="tab on" data-tab="class">CLASS</button>
		<button class="tab" data-tab="neutral">NEUTRAL</button>
	</div>
	<div id="filters">
		<input id="search" placeholder="Search cards…">
		<div id="mana-row"></div>
		<select id="type-filter" class="dd" title="Filter by card type"><option value="">All types</option></select>
		<select id="kw-filter" class="dd" title="Filter by keyword"><option value="">All keywords</option></select>
		<select id="set-filter" class="dd" title="Filter by set"><option value="">All sets</option></select>
		<select id="sort-by" class="dd" title="Sort cards"><option value="cost">Sort: Cost</option><option value="rarity">Sort: Rarity</option><option value="name">Sort: Name</option></select>
		<button id="owned-toggle" class="ftoggle on" title="Show only cards you own, or the whole pool">Owned</button>
	</div>
	<div id="main">
		<div id="collection">
			<div id="grid"></div>
			<div id="pager">
				<button id="prev" aria-label="Previous page">‹</button>
				<span id="pageinfo"></span>
				<button id="next" aria-label="Next page">›</button>
			</div>
		</div>
		<aside id="deck-panel">
			<button id="panel-close" aria-label="Close deck panel">✕</button>
			<!-- My Decks list -->
			<div id="decks-view">
				<h3>MY DECKS <span id="slot-count"></span></h3>
				<div id="slot-list"></div>
				<div id="starter-section" style="display:none">
					<h3 class="starter-h">START FROM A TEMPLATE</h3>
					<p class="starter-note">Ready-to-play decks — one per class, all cards a new account already owns. Load one, then Save it.</p>
					<div id="starter-list"></div>
				</div>
			</div>
			<!-- Deck editor -->
			<div id="edit-view" style="display:none">
				<div id="edit-head">
					<button id="back-to-decks">← My Decks</button>
				</div>
				<input id="deck-name" placeholder="Deck name" maxlength="40">
				<div id="loadout">
					<button class="lo-slot" id="lo-commander" data-kind="commander"></button>
					<button class="lo-slot" id="lo-companion" data-kind="companion"></button>
				</div>
				<div id="deck-list"></div>
				<div id="deck-footer">
					<div id="deck-stats" style="display:none">
						<div class="ds-curve" id="ds-curve"></div>
						<div class="ds-line" id="ds-types"></div>
						<div class="ds-line ds-rar" id="ds-rarity"></div>
					</div>
					<div id="deck-count">0 / 40</div>
					<button id="save">Save Deck</button>
					<button id="delete-deck">Delete This Deck</button>
					<div id="code-row">
						<button id="copy-link" title="Copy a shareable link to this deck">🔗 Copy Link</button>
						<button id="export-code" title="Copy this deck as a short code">📋 Copy Code</button>
						<button id="import-code" title="Load a deck from a pasted code or link">📥 Import</button>
					</div>
					<div id="status"></div>
				</div>
			</div>
		</aside>
	</div>
	<div id="lopick">
		<div id="lopick-inner">
			<h3 id="lopick-title"></h3>
			<div id="lopick-grid"></div>
			<div id="lopick-actions">
				<button id="lopick-remove">Remove</button>
				<button id="lopick-close">Close</button>
			</div>
		</div>
	</div>
	<div id="zoom">
		<div id="zoom-inner">
			<div id="zoom-card"></div>
			<div id="zoom-right">
				<div id="zoom-info"></div>
				<div id="zoom-actions">
					<button id="zoom-add">＋ Add to Deck</button>
					<button id="zoom-close">Close</button>
				</div>
			</div>
		</div>
	</div>
	<div id="tip"></div>
	<style>
		/* hover tooltip — same inspect style as pack opening / the collection page */
		#tip {
			display: none; position: fixed; z-index: 90; max-width: 300px;
			background: #1c1830f2; color: #e8e2f4; border: 1px solid #4a4066;
			border-radius: 10px; padding: 10px 12px; pointer-events: none;
			font-size: 13px; line-height: 1.35; box-shadow: 0 6px 22px rgba(0,0,0,0.5);
		}
		#tip .nm { font-weight: 700; font-size: 15px; }
		#tip .nm .cost { color: #ffd25f; }
		#tip .meta { color: #c9b8ff; font-size: 12px; text-transform: capitalize; }
		#tip .kws { color: #9fd0ff; font-size: 12px; }
