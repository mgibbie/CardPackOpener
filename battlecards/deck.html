<!DOCTYPE html>
<html>
<head>
	<title>Magepunk Battlecards — Deck Builder</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<link rel="icon" href="data:,">
	<style>
		* { box-sizing: border-box; }
		html, body { margin: 0; height: 100%; background: #0e0b16; font-family: 'Segoe UI', system-ui, sans-serif; color: #e8e2f4; -webkit-text-size-adjust: 100%; }
		body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

		#topbar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #2a2340; flex-wrap: wrap; }
		#topbar .brand { font-size: 16px; letter-spacing: 1px; font-weight: 700; }
		#topbar a { color: #9d8fd4; text-decoration: none; font-size: 13px; }
		#topbar a:hover { text-decoration: underline; }
		#class-select { background: #241b38; color: #e8e2f4; border: 1px solid #4a3f6b; border-radius: 6px; padding: 5px 8px; font-size: 14px; }
		#topbar .spacer { flex: 1; }
		#toggle-deck { display: none; background: #6b4fd4; color: #fff; border: none; border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: 700; cursor: pointer; }

		#tabs { display: flex; gap: 6px; padding: 8px 14px 0; }
		.tab { flex: 0 0 auto; background: #1c1430; color: #b7abd6; border: 1px solid #3a3055; border-bottom: none;
			border-radius: 8px 8px 0 0; padding: 8px 18px; font-size: 13px; font-weight: 700; cursor: pointer; }
		.tab.on { background: #2a2145; color: #fff; border-color: #6b4fd4; }

		#filters { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid #2a2340; flex-wrap: wrap; }
		#search { background: #241b38; color: #e8e2f4; border: 1px solid #4a3f6b; border-radius: 6px; padding: 6px 10px; font-size: 14px; min-width: 140px; flex: 1 1 160px; max-width: 260px; }
		#mana-row { display: flex; gap: 4px; flex-wrap: wrap; }
		.crystal { width: 30px; height: 30px; border-radius: 6px; background: #241b38; color: #b7abd6; border: 1px solid #4a3f6b; font-size: 13px; font-weight: 700; cursor: pointer; }
		.crystal.on { background: #2f7fe0; color: #fff; border-color: #6fb0ff; }

		#main { flex: 1; display: grid; grid-template-columns: 1fr 340px; min-height: 0; }
		#collection { display: flex; flex-direction: column; min-height: 0; }
		#grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
			gap: 10px; padding: 12px; align-content: start; -webkit-overflow-scrolling: touch; }
		.tile { position: relative; cursor: pointer; border-radius: 10px; transition: transform .08s; }
		.tile:active { transform: scale(0.97); }
		.tile canvas { width: 100%; display: block; border-radius: 8px; }
		.tile.depleted { opacity: 0.4; }
		.tile .badge { position: absolute; right: 6px; bottom: 6px; background: rgba(10,8,20,0.85); border: 1px solid #6b4fd4;
			color: #fff; font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 10px; pointer-events: none; }
		.tile .owncount { position: absolute; left: 6px; bottom: 6px; background: rgba(10,8,20,0.8);
			color: #cdbcff; font-size: 11px; padding: 1px 6px; border-radius: 8px; pointer-events: none; }
		#empty-hint { padding: 22px; color: #9b93b3; font-size: 14px; line-height: 1.6; }
		#pager { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 8px; border-top: 1px solid #2a2340; }
		#pager button { background: #241b38; color: #e8e2f4; border: 1px solid #4a3f6b; border-radius: 8px; width: 42px; height: 34px; font-size: 18px; cursor: pointer; }
		#pager button:disabled { opacity: 0.35; cursor: default; }
		#pageinfo { font-size: 13px; color: #b7abd6; min-width: 90px; text-align: center; }

		#deck-panel { background: #131022; border-left: 1px solid #2a2340; display: flex; flex-direction: column; min-height: 0; }
		#deck-panel h3 { font-size: 13px; margin: 12px 14px 6px; color: #c9b8ff; letter-spacing: .5px; }
		#slot-count { color: #9b93b3; font-weight: 400; font-size: 12px; }
		#slot-list { max-height: 150px; overflow-y: auto; padding: 0 12px; }
		.slot-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 7px 10px; margin-bottom: 4px;
			background: #1c1430; border: 1px solid #3a3055; border-radius: 6px; cursor: pointer; font-size: 12.5px; }
		.slot-row:hover { border-color: #8f6fff; }
		.slot-row.active { border-color: #57e389; background: #1a2a20; }
		.slot-row .s-name { font-weight: 600; }
		.slot-row .s-meta { color: #9b93b3; font-size: 11px; }
		#new-deck { margin: 6px 12px 0; padding: 8px; font-size: 13px; background: #241b38; color: #c9b8ff; border: 1px dashed #4a3f6b; border-radius: 8px; cursor: pointer; }
		#deck-name { margin: 10px 12px 6px; background: #241b38; color: #e8e2f4; border: 1px solid #4a3f6b; border-radius: 6px; padding: 7px 9px; font-size: 14px; }
		#deck-list { flex: 1; overflow-y: auto; padding: 0 12px; min-height: 60px; }
		.deck-row { display: flex; align-items: center; gap: 8px; padding: 5px 8px; margin-bottom: 3px; background: #1c1430; border-radius: 6px; cursor: pointer; font-size: 13px; }
		.deck-row:hover { background: #2a2145; }
		.deck-row .gem { flex: 0 0 22px; height: 22px; border-radius: 50%; background: #2f7fe0; color: #fff; font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center; }
		.deck-row .dn { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		.deck-row .dx { color: #cdbcff; font-weight: 700; }
		#deck-footer { padding: 12px; border-top: 1px solid #2a2340; }
		#deck-count { font-weight: 700; text-align: center; margin-bottom: 8px; }
		#save { width: 100%; padding: 11px; font-size: 15px; font-weight: 700; background: #6b4fd4; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
		#save:hover { background: #7d63e6; }
		#delete-deck { width: 100%; margin-top: 6px; padding: 9px; font-size: 13px; background: #3a2540; color: #ffa9a9; border: 1px solid #5a3550; border-radius: 8px; cursor: pointer; display: none; }
		#status { font-size: 12.5px; margin-top: 8px; min-height: 18px; color: #ffd25f; text-align: center; }
		#panel-close { display: none; }

		/* ---------- mobile ---------- */
		@media (max-width: 820px) {
			#toggle-deck { display: inline-block; }
			#main { grid-template-columns: 1fr; }
			#grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; padding: 8px; }
			#deck-panel {
				position: fixed; inset: 0; z-index: 40; border-left: none;
				transform: translateY(100%); transition: transform .22s ease; }
			#deck-panel.open { transform: translateY(0); }
			#panel-close { display: block; position: absolute; top: 8px; right: 12px; font-size: 26px; color: #cdbcff; background: none; border: none; cursor: pointer; z-index: 2; }
		}
	</style>
	<script type="importmap">
	{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js" } }
	</script>
</head>
<body>
	<div id="topbar">
		<a href="index.html">← Back</a>
		<span class="brand">DECK BUILDER</span>
		<a href="packs.html">packs</a>
		<a href="viewer.html">gallery</a>
		<select id="class-select" title="your class"></select>
		<span class="spacer"></span>
		<button id="toggle-deck">DECK 0/40</button>
	</div>
	<div id="tabs">
		<button class="tab on" data-tab="class">CLASS</button>
		<button class="tab" data-tab="neutral">NEUTRAL</button>
	</div>
	<div id="filters">
		<input id="search" placeholder="Search cards…">
		<div id="mana-row"></div>
	</div>
	<div id="main">
		<div id="collection">
			<div id="grid"></div>
			<div id="pager">
				<button id="prev">‹</button>
				<span id="pageinfo"></span>
				<button id="next">›</button>
			</div>
		</div>
		<aside id="deck-panel">
			<button id="panel-close">✕</button>
			<h3>MY DECKS <span id="slot-count"></span></h3>
			<div id="slot-list"></div>
			<button id="new-deck">＋ New Deck</button>
			<h3 style="margin-top:12px">DECK — tap a card to remove</h3>
			<input id="deck-name" placeholder="Deck name" maxlength="40">
			<div id="deck-list"></div>
			<div id="deck-footer">
				<div id="deck-count">0 / 40</div>
				<button id="save">Save Deck</button>
				<button id="delete-deck">Delete This Deck</button>
				<div id="status"></div>
			</div>
		</aside>
	</div>
	<script type="module" src="deck.js"></script>
	<script type="module" src="nav.js"></script>
</body>
</html>
