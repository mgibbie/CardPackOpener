	<style>
	/* Balatro style (site/ui/balatro.css + bal-skin.css): each replay a panel; Watch is the green go button */
	.wrap { max-width:900px; margin:0 auto; padding:18px 20px 64px; }
	.hero { text-align:center; padding:24px 12px 6px; }
	.hero .glyph { font-size:2.6rem; }
	.hero h1 { font-size:clamp(2.8rem,8vw,4.2rem); margin-top:4px; line-height:1; }
	.hero .tag { margin-top:10px; }
	.tools { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin:16px 0 22px; }
	#list { display:flex; flex-direction:column; gap:14px; }
	.rep { display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:16px; background:var(--bal-panel);
		box-shadow:0 6px 0 var(--bal-panel-dd), inset 0 0 0 3px var(--bal-panel-line); }
	.rep .rp-icon { font-size:1.7rem; width:48px; height:48px; display:grid; place-items:center; border-radius:10px; background:var(--bal-panel-dd); flex-shrink:0; box-shadow:0 3px 0 rgba(0,0,0,.25); }
	.rep .rp-main { flex:1; min-width:0; }
	.rep .rp-title { font-size:1.2rem; display:flex; align-items:center; gap:9px; flex-wrap:wrap; text-shadow:var(--bal-text-shadow); }
	.rep .rp-sub { color:var(--bal-text-soft); font-size:.9rem; margin-top:3px; }
	.badge { --bal-b: var(--bal-grey); display:inline-block; font-size:16px; line-height:1; color:#fff; background:var(--bal-b); border-radius:8px; padding:4px 9px 2px; box-shadow:0 3px 0 rgba(0,0,0,.25); }
	.badge.win { --bal-b: var(--bal-green); }
	.badge.loss { --bal-b: var(--bal-red); }
	.rep .rp-actions { display:flex; gap:8px; flex-shrink:0; flex-wrap:wrap; }
	.rep .rp-watch { --bal-b: var(--bal-green); --bal-bd: var(--bal-green-d); }
	.rep .rp-del { --bal-b: var(--bal-red); --bal-bd: var(--bal-red-d); }
	.empty { text-align:center; padding:40px 20px; line-height:1.3; }
	#status { text-align:center; color:var(--bal-money); min-height:20px; margin-top:14px; text-shadow:var(--bal-text-shadow); }
	footer { margin-top:36px; text-align:center; font-size:.9rem; }
	@media (max-width:560px) { .rep { flex-wrap:wrap; } .rep .rp-actions { width:100%; } .rep .rp-actions .bal-btn { flex:1; } }
	</style>
	<link rel="stylesheet" href="bal-skin.css">
</head>
<body class="bal-page">
	<div class="wrap">
		<a class="back" href="start.html">← Battlecards</a>
		<header class="hero">
			<div class="glyph">🎬</div>
			<h1>Replays</h1>
			<p class="tag">Every game you finish is saved here. Rewatch it frame by frame, from either side.</p>
		</header>
		<div class="tools">
			<button id="import-btn" class="bal-btn bal-blue" title="Paste a replay code someone shared">📥 Import a replay code</button>
			<button id="clear-btn" class="bal-btn bal-red" title="Delete all saved replays">🗑 Clear all</button>
		</div>
		<div id="list"></div>
		<div id="status"></div>
		<footer>Replays are stored on this device only — up to the 10 most recent games.</footer>
	</div>
