<!DOCTYPE html>
<html lang="en">
<head>
<!-- first, before any game code reads storage: per-account local data (site/account_silo.js) -->
<script src="/site/account_silo.js"></script>
	<title>Magepunk Battlecards</title>
	<meta charset="UTF-8">
	<link rel="preconnect" href="https://magepunk-cardart.pages.dev" crossorigin>
	<link rel="dns-prefetch" href="https://magepunk-cardart.pages.dev">
	<!-- pinch-zoom stays enabled: card text renders into WebGL textures, so browser
	     zoom is the only way to read it up close; touch-action:none already stops
	     stray panning/double-tap zoom during play -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<link rel="preload" href="cards.json" as="fetch" crossorigin="anonymous">
	<link rel="icon" href="data:,">
	<link rel="preload" href="/micatro/assets/fonts/m6x11plus.ttf?v=2" as="font" type="font/ttf" crossorigin>
	<link rel="stylesheet" href="/site/ui/balatro.css">
	<style>
		/* Balatro style (site/ui/balatro.css): every DOM HUD piece, menu, dialog and run screen over the 3D board is
		   drawn with the kit — Micatro's panels (a dark lip + inner outline), its coloured buttons (blue End Turn,
		   green go, red danger, orange back), pixel type, card-like tooltips (a panel over white card text). The 3D
		   board itself is the game's. The run screens' own rules are in bal-game.css. */
		html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0a14; user-select: none; -webkit-user-select: none; touch-action: none; }
		/* a flat colour, not the kit's fixed felt (.bal-page): under the 3D board's canvas, which redraws every
		   frame, a fixed background makes Chrome repaint the whole page each frame (MicaSurvivor's pad suite lost
		   presses to it). The run screens bring their own felt (bal-game.css). */
		html body.bal-page { background: var(--bal-bg); }
		/* the kit's button look for the game's own buttons (they keep their ids: the colour is --bal-b / --bal-bd) */
		#end-turn, #coin-btn, #planeswalk-btn, #autopass-btn, #restart, #concede, #log-btn, #sfx-btn, #nav-toggle,
		#inspect .ins-actions button, #card-focus .ins-actions button, #card-focus .cf-nav button,
		#scry-modal .scry-cell button, #scry-modal .scry-done, #scry-modal .mull-actions button, #walker-menu button, #rotate-hint button {
			--bal-b: var(--bal-grey); --bal-bd: var(--bal-grey-d); font-family: var(--bal-font); color: #fff; border: 0; cursor: pointer; text-shadow: 0 .08em 0 rgba(0,0,0,.3); background: var(--bal-b); box-shadow: 0 .22em 0 var(--bal-bd); transition: transform .06s, box-shadow .06s, filter .1s; }
		#end-turn:hover:not(:disabled), #coin-btn:hover, #planeswalk-btn:hover, #autopass-btn:hover, #restart:hover, #concede:hover, #log-btn:hover, #sfx-btn:hover, #nav-toggle:hover,
		#inspect .ins-actions button:hover, #card-focus .ins-actions button:hover, #card-focus .cf-nav button:hover,
		#scry-modal .scry-cell button:hover, #scry-modal .scry-done:hover, #scry-modal .mull-actions button:hover, #walker-menu button:hover:not(:disabled) { filter: brightness(1.1); }
		#end-turn:active:not(:disabled), #coin-btn:active, #planeswalk-btn:active, #autopass-btn:active, #restart:active, #concede:active, #log-btn:active, #sfx-btn:active,
		#inspect .ins-actions button:active, #card-focus .ins-actions button:active, #card-focus .cf-nav button:active,
		#scry-modal .scry-cell button:active, #scry-modal .scry-done:active, #scry-modal .mull-actions button:active, #walker-menu button:active:not(:disabled) { box-shadow: 0 .07em 0 var(--bal-bd); translate: 0 .15em; }
		#end-turn:focus-visible, #coin-btn:focus-visible, #planeswalk-btn:focus-visible, #autopass-btn:focus-visible, #restart:focus-visible, #concede:focus-visible, #log-btn:focus-visible, #sfx-btn:focus-visible,
		#scry-modal button:focus-visible, #walker-menu button:focus-visible, #card-focus button:focus-visible, #inspect button:focus-visible { outline: none; box-shadow: 0 .22em 0 var(--bal-bd), 0 0 0 3px #fff; }
		body { height: 100dvh; }
		#scene { position: fixed; inset: 0; }
		.hud { position: fixed; color: #fff; text-shadow: 0 .1em 0 rgba(0,0,0,.5); pointer-events: none; }
		#title { top: 12px; left: 18px; font-size: 22px; letter-spacing: .04em; }
		#title a { color: #9fd3ff; font-size: 18px; text-decoration: none; margin-left: 12px; pointer-events: auto; }
		#title a.brand { color: #fff; text-shadow: .03em .05em 0 var(--bal-red), .06em .1em 0 rgba(0,0,0,.4); }
		#title a:hover { text-decoration: underline; }

		.panel {
			position: fixed; left: 18px; width: 190px; padding: 10px 14px;
			background: var(--bal-panel); border: 3px solid var(--bal-panel-line); border-radius: 14px; box-shadow: 0 5px 0 var(--bal-panel-dd);
			color: #fff; cursor: pointer; transition: box-shadow 0.15s, background 0.3s;
		}
		.panel:hover { border-color: var(--bal-outline-light); }
		.panel.hit { background: var(--bal-red-d); }
		.panel.armed { border-color: var(--bal-green); box-shadow: 0 5px 0 var(--bal-panel-dd), 0 0 12px rgba(75,194,146,0.6); }
		/* dashed = a legal target (matches the board rings) so red-vs-green
		   armed/targetable never rides on hue alone */
		.panel.targetable { border-color: var(--bal-red); border-style: dashed; box-shadow: 0 5px 0 var(--bal-panel-dd), 0 0 14px rgba(254,95,85,0.75); }
		.panel.turn { border-color: var(--bal-gold); }
		.panel.dead { opacity: 0.35; filter: grayscale(1); }
		.panel .gear { color: var(--bal-money); font-size: 16px; line-height: 1.3; }
		/* hero portrait + class power orb */
		.panel .hero-id { float: right; display: flex; align-items: center; gap: 6px; margin: 2px 0 4px 8px; }
		.panel .portrait { display: block; border-radius: 50%; }
		.panel .power-orb { display: block; border-radius: 50%; cursor: pointer; transition: filter 0.15s, box-shadow 0.15s; }
		.panel .power-orb.usable { box-shadow: 0 0 10px rgba(87,227,137,0.9); }
		.panel .power-orb.spent { filter: grayscale(1) brightness(0.6); cursor: default; }

		/* small projected panels, one per opponent, centered on their slice.
		   width: max-content — a fixed element's auto width shrinks to fit the
		   space right of its `left`, so panels near the viewport edge wrapped
		   their text into a tall column; max-width caps them on tiny screens
		   (positionPanels clamps them fully on-screen) */
		.panel.foe-sm {
			left: auto; width: max-content; max-width: min(46vw, 250px); min-width: 118px; padding: 6px 10px;
			transform: translate(-50%, -100%);
		}
		.panel.foe-sm .life { font-size: 20px; min-width: 34px; height: 34px; border-radius: 10px; }
		.panel.foe-sm .sub { font-size: 15px; }
		.panel.foe-sm .gear { font-size: 15px; }

		/* hover rules tooltip */
		#tooltip {
			position: fixed; display: none; z-index: 9; width: 280px; pointer-events: none;
			background: var(--bal-panel); border-radius: 14px; padding: 8px; color: #fff;
			box-shadow: 0 6px 0 var(--bal-panel-dd), inset 0 0 0 3px var(--bal-outline-light);
		}
		#tooltip .tt-name { font-size: 24px; text-align: center; color: #fff; text-shadow: var(--bal-text-shadow); }
		#tooltip .tt-type { font-size: 15px; text-align: center; color: var(--bal-text-muted); margin: 2px 0 6px; }
		#tooltip .tt-desc { font-size: 18px; line-height: 1.12; background: #fff; color: var(--bal-text-dark); border-radius: 9px; padding: 7px 9px 5px; }
		#tooltip .tt-sub { margin-top: 6px; font-size: 16px; color: var(--bal-money); text-align: center; }
		#tooltip .tt-kw { margin-top: 6px; padding: 6px 8px 4px; border-radius: 9px; background: var(--bal-panel-d); font-size: 16px; line-height: 1.1; color: var(--bal-text-soft); }
		#tooltip .tt-kw b { color: var(--bal-attn); }

		/* click-to-inspect panel: a big, pinned look at a hand card */
		#inspect {
			position: fixed; display: none; z-index: 8; left: 24px; top: 50%;
			transform: translateY(-50%); width: 300px; pointer-events: none;
			background: var(--bal-panel); border: 0; box-shadow: 0 7px 0 var(--bal-panel-dd), inset 0 0 0 4px var(--bal-outline-light); border-radius: 16px; padding: 12px;
		}
		#inspect canvas { width: 100%; height: auto; display: block; border-radius: 10px; }
		#inspect .ins-kw { margin-top: 8px; font-size: 15px; line-height: 1.12; color: var(--bal-text-soft); }
		#inspect .ins-kw .tt-kw { margin-top: 5px; padding: 5px 8px 3px; border-radius: 9px; background: var(--bal-panel-d); }
		#inspect .ins-kw .tt-kw b { color: var(--bal-attn); }
		#inspect .ins-hint { margin-top: 9px; font-size: 15px; color: var(--bal-text-muted); }
		#inspect .ins-hint.no { color: #ffb3ad; }
		/* action buttons re-enable pointer events on an otherwise click-through panel */
		#inspect .ins-actions { margin-top: 9px; display: flex; flex-direction: column; gap: 5px; pointer-events: auto; }
		#inspect .ins-actions button { --bal-b: var(--bal-blue); --bal-bd: var(--bal-blue-d); width: 100%; text-align: left; padding: 8px 11px 6px; border-radius: 9px; font-size: 17px; margin-bottom: 3px; }
		#inspect .ins-actions button.trade { --bal-b: var(--bal-purple); --bal-bd: var(--bal-purple-d); }

		/* the card FOCUS view: a centered, large reader with the board dimmed behind it
		   (right-click / hold a card, the controller's inspect button, a log name) */
		#card-focus { position: fixed; inset: 0; z-index: 9050; display: none; }
		#card-focus .cf-backdrop { position: absolute; inset: 0; background: rgba(15,22,24,0.72); }
		#card-focus .cf-panel {
			position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
			width: min(400px, 92vw); max-height: 94vh; overflow-y: auto; box-sizing: border-box;
			background: var(--bal-panel); border: 0; box-shadow: 0 7px 0 var(--bal-panel-dd), inset 0 0 0 4px var(--bal-outline-light); border-radius: 18px; padding: 12px 14px 14px;
		}
		#card-focus .cf-face { width: 100%; height: auto; display: block; border-radius: 12px; }
		#card-focus .cf-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
		#card-focus .cf-nav button { --bal-b: var(--bal-blue); --bal-bd: var(--bal-blue-d); border-radius: 9px; font-size: 20px; padding: 5px 12px 3px; margin-bottom: 4px; }
		#card-focus .cf-nav .cf-close { --bal-b: var(--bal-orange); --bal-bd: var(--bal-orange-d); margin-left: auto; }
		#card-focus .cf-count { color: var(--bal-text-muted); font-size: 16px; min-width: 44px; text-align: center; }
		#card-focus .ins-kw { margin-top: 10px; font-size: 17px; line-height: 1.12; color: var(--bal-text-soft); }
		#card-focus .ins-kw .tt-kw { margin-top: 6px; padding: 6px 9px 4px; border-radius: 10px; background: var(--bal-panel-d); }
		#card-focus .ins-kw .tt-kw b { color: var(--bal-attn); }
		#card-focus .ins-hint { margin-top: 10px; font-size: 16px; color: var(--bal-text-muted); }
		#card-focus .ins-hint.no { color: #ffb3ad; }
		#card-focus .ins-actions { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
		#card-focus .ins-actions button { --bal-b: var(--bal-blue); --bal-bd: var(--bal-blue-d); width: 100%; text-align: left; padding: 10px 12px 8px; border-radius: 10px; font-size: 19px; margin-bottom: 4px; }
		#card-focus .ins-actions button.trade { --bal-b: var(--bal-purple); --bal-bd: var(--bal-purple-d); }
		@media (max-height: 560px) { #card-focus .cf-panel { width: min(300px, 92vw); } }

		/* scry / gaze decision modal */
		/* z-index was 11, which put a BLOCKING decision below almost every other
		   panel (game UI runs 8-70, the chat sits at 9000), so a Scry/Discover/
		   discard modal could render UNDERNEATH the board furniture and read as
		   "the game stopped responding". A forced choice outranks everything except
		   the full-screen overlays (replay 9999, profile 10000, roster 10002).
		   Keep z-index near the top of the block: modal_card_tips_test reads it
		   within 200 chars of the brace to prove the card tip still sits above. */
		#scry-modal {
			position: fixed; display: none; z-index: 9500; left: 50%; top: 42%;
			transform: translate(-50%, -50%); padding: 14px 16px;
			background: var(--bal-panel); border: 4px solid var(--bal-outline-light); border-radius: 18px;
			/* the huge-spread shadow dims the whole board — decision points get a spotlight.
			   0.9 (not 0.6) so the board/hero plates don't bleed through behind the cards,
			   which read badly on phone-portrait where the card column leaves wide margins */
			box-shadow: 0 0 0 100vmax rgba(10,16,18,0.88), 0 8px 0 var(--bal-panel-dd);
			color: #fff;
		}
		/* The modal's huge spread shadow DIMS the board but cannot catch a click, so
		   every tap went straight through to a board that refuses to act while a
		   decision is owed — exactly "End Turn, attacks and spells appear broken".
		   This veil makes the modal actually modal. It is driven by the modal's own
		   visibility (see the MutationObserver in game.js) rather than by the dozen
		   places that show or hide it. */
		#modal-veil { position: fixed; inset: 0; z-index: 9499; display: none; }
		/* the pixel font runs a little taller: a long choice scrolls inside the dialog instead of off the screen */
		#scry-modal { max-height: 82vh; max-height: 82dvh; overflow-y: auto; box-sizing: border-box; }   /* (centred at 42%: its top stays on screen) */
		@media (max-width: 760px) and (orientation: portrait) {
			#scry-modal { top: 50%; max-height: 94vh; max-height: 94dvh; padding: 10px 12px; }
			html #scry-modal .wm-title { font-size: 17px; }
		}
		/* a scrolling dialog keeps its confirm button in view (Keep hand / Done ride the bottom edge) */
		#scry-modal .mull-actions { position: sticky; bottom: -14px; margin-bottom: -14px; padding: 8px 0 12px; background: var(--bal-panel); }
		#scry-modal .wm-title { color: #fff; font-size: 24px; margin-bottom: 10px; text-align: center; text-shadow: var(--bal-text-shadow); }
		#scry-modal .scry-row { display: flex; gap: 12px; }
		#scry-modal .scry-cell { text-align: center; }
		#scry-modal .scry-cell canvas { border-radius: 8px; display: block; }
		#scry-modal .adapt-opt { width: 130px; min-height: 64px; display: flex; align-items: center; justify-content: center;
			padding: 10px; border-radius: 10px; background: #fff; color: var(--bal-text-dark); box-shadow: 0 4px 0 rgba(0,0,0,.3);
			font-size: 17px; line-height: 1.12; }
		#scry-modal .scry-cell button { --bal-b: var(--bal-blue); --bal-bd: var(--bal-blue-d); margin-top: 8px; padding: 5px 16px 3px; border-radius: 9px; font-size: 18px; }
		#scry-modal .scry-cell button.bottom { --bal-b: var(--bal-red); --bal-bd: var(--bal-red-d); }
		#scry-modal .scry-done { --bal-b: var(--bal-green); --bal-bd: var(--bal-green-d); margin-top: 14px; width: 100%; padding: 9px 8px 7px; border-radius: 10px; font-size: 22px; }
		/* opening-hand mulligan: tap a card to mark it with a big ✕ for replacement */
		#scry-modal .mull-row { flex-wrap: wrap; justify-content: center; max-width: min(90vw, 760px); }
		#scry-modal .mull-row .scry-cell { position: relative; cursor: pointer; transition: transform 0.12s; }
		#scry-modal .mull-row .scry-cell:hover { transform: translateY(-4px); }
		#scry-modal .scry-cell.mull-swap canvas { outline: 3px solid #e0574f; outline-offset: 1px; opacity: 0.45; filter: grayscale(0.5); }
		#scry-modal .scry-cell.mull-swap::after {
			content: '✕'; position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%);
			font-size: 52px; color: var(--bal-red);
			text-shadow: 0 0 14px #000, 0 2px 6px #000; pointer-events: none;
		}
		#scry-modal .mull-tag { margin-top: 5px; font-size: 18px; color: var(--bal-green); text-shadow: var(--bal-text-shadow); }
		#scry-modal .scry-cell.mull-swap .mull-tag { color: var(--bal-red); }
		#scry-modal .mull-actions { margin-top: 14px; text-align: center; }
		#scry-modal .mull-actions button { --bal-b: var(--bal-green); --bal-bd: var(--bal-green-d); padding: 9px 28px 7px; border-radius: 10px; font-size: 22px; }

		/* planeswalker ability picker */
		#walker-menu {
			position: fixed; display: none; z-index: 10; min-width: 240px;
			background: var(--bal-panel); border: 0; box-shadow: 0 7px 0 var(--bal-panel-dd), inset 0 0 0 4px var(--bal-outline-light); border-radius: 16px; padding: 10px;
		}
		#walker-menu .wm-title { color: #fff; font-size: 20px; margin: 2px 4px 8px; text-shadow: var(--bal-text-shadow); }
		#walker-menu button { --bal-b: var(--bal-blue); --bal-bd: var(--bal-blue-d); display: block; width: 100%; text-align: left; margin: 4px 0 8px; padding: 8px 10px 6px; border-radius: 10px; font-size: 18px; }
		#walker-menu button:disabled { --bal-b: var(--bal-disabled); --bal-bd: var(--bal-disabled-d); color: var(--bal-disabled-text); cursor: default; }
		#walker-menu .wm-cost { color: #fff3c9; margin-right: 6px; }
		/* hand-play decisions (choose one / adventure / trade) get a centered, hard-to-miss
		   popup over a backdrop so a stray board click can't silently dismiss them */
		#menu-backdrop { position: fixed; inset: 0; z-index: 9; display: none; background: rgba(15,22,24,0.55); }
		#walker-menu.decision {
			left: 50% !important; top: 44% !important; transform: translate(-50%, -50%);
			min-width: 300px; max-width: 92vw; padding: 16px 16px 14px;
		}
		#walker-menu.decision .wm-title { font-size: 26px; text-align: center; margin: 0 0 12px; }
		#walker-menu.decision button { padding: 12px 14px 10px; font-size: 20px; }
		/* life as a Hearthstone-style blood gem (stretches to a pill for "40+3" armor) */
		.panel .life {
			min-width: 40px; height: 40px; padding: 0 7px; border-radius: 21px;
			display: inline-flex; align-items: center; justify-content: center;
			background: var(--bal-red); border: 0; box-shadow: 0 4px 0 var(--bal-red-d);
			color: #fff; font-size: 24px; text-shadow: 0 2px 0 rgba(0,0,0,.35);
			box-sizing: border-box; margin-bottom: 3px;
		}
		.panel .sub { font-size: 16px; color: var(--bal-text-soft); line-height: 1.25; }
		/* hangs down from the projected hero point (mirror of the opponents' -100%),
		   so your land slots stay above it and your hand below */
		/* hidden until a game positions it: only SPECTATE uses this DOM panel
		   (normal play draws the 3D in-scene one) — without this it dangled
		   half-clipped over the Back button on every menu screen */
		#my-panel { display: none; left: auto; width: auto; min-width: 150px; padding: 7px 12px; transform: translate(-50%, 0); transition: opacity 0.16s; }
		#my-panel .life { font-size: 26px; }
		#my-panel .sub { font-size: 15px; }
		/* in normal play the hero panel is rendered as a 3D object in the scene
		   (so the hand cards depth-sort in front of it); the DOM panel is only used
		   by the read-only spectator view */
		body.threed-hero #my-panel { display: none; }
		/* while your hand is up it overlaps the panel; dim it so the hand reads in
		   front (a WebGL hand can't paint over a DOM node). Clicking the field tucks
		   the hand down and the panel goes solid again. */

		#end-turn, #coin-btn, #planeswalk-btn {
			position: fixed; right: 26px; padding: 12px 26px 10px; font-size: 24px; border-radius: 12px;
		}
		/* End Turn is Balatro's blue Play button; the Coin gold; Planeswalk purple */
		#end-turn { --bal-b: var(--bal-blue); --bal-bd: var(--bal-blue-d); bottom: 46%; }
		#end-turn:disabled { --bal-b: var(--bal-disabled); --bal-bd: var(--bal-disabled-d); color: var(--bal-disabled-text); cursor: default; }
		#coin-btn { --bal-b: var(--bal-gold); --bal-bd: var(--bal-gold-d); bottom: calc(46% - 60px); }
		#planeswalk-btn { --bal-b: var(--bal-purple); --bal-bd: var(--bal-purple-d); bottom: calc(46% - 120px); }
		/* parked in the bottom-right corner so it never floats over the hand */
		#autopass-btn {
			position: fixed; right: 16px; bottom: 16px; z-index: 30; padding: 8px 16px 6px;
			font-size: 18px; border-radius: 10px;
		}
		#autopass-btn.holding { --bal-b: var(--bal-orange); --bal-bd: var(--bal-orange-d); }

		/* always-visible mana readout, bottom-left corner (the 3D hero panel's
		   mana text is easy to miss, so mirror it here in the clear) */
		#mana-hud {
			position: fixed; left: 16px; bottom: 16px; z-index: 30; display: none;
			align-items: center; gap: 8px; padding: 7px 14px 5px 12px;
			background: var(--bal-panel); border-radius: 12px; box-shadow: 0 5px 0 var(--bal-panel-dd), inset 0 0 0 3px var(--bal-panel-line);
			text-shadow: var(--bal-text-shadow); pointer-events: none; user-select: none;
		}
		#mana-hud .mh-label { font-size: 16px; letter-spacing: 1px; color: var(--bal-text-muted); }
		/* crystal pips: one diamond per crystal, dimmed once spent */
		#mana-pips { display: flex; gap: 4px; align-items: center; }
		#mana-pips .pip {
			width: 11px; height: 11px; border-radius: 3px; transform: rotate(45deg);
			background: linear-gradient(135deg, #b8ecff, #4fa8e8 60%, #2b6fb0);
			box-shadow: 0 0 6px rgba(90,180,255,0.7);
		}
		#mana-pips .pip.spent { background: #283452; box-shadow: none; border: 1px solid #3a4a6a; }
		#mana-hud .mh-val { font-size: 24px; color: #fff; background: var(--bal-blue); border-radius: 8px; padding: 3px 8px 1px; box-shadow: 0 3px 0 var(--bal-blue-d); line-height: 1; margin-left: 2px; }
		#mana-hud.tapped .mh-val { background: var(--bal-purple); box-shadow: 0 3px 0 var(--bal-purple-d); }
		#mana-hud.empty .mh-val { background: var(--bal-disabled); box-shadow: 0 3px 0 var(--bal-disabled-d); color: var(--bal-disabled-text); }

		/* dungeon venture panel: the current dungeon's flowchart with a "you are here" marker */
		#dungeon-panel {
			position: fixed; left: 12px; top: 50%; transform: translateY(-50%); z-index: 28;

	<script>
	// remember if the player dismissed the rotate hint

		document.getElementById('rotate-x').addEventListener('click', () => {

	<script>
	// Boot watchdog. Three times on 2026-11-06 a tester pressed Fight! and got the page
	// chrome with no board and no window.__game, and no error to go on; a plain reload +
	// Continue recovered each time. When the game module never starts (a module that failed
	// to load, or threw while loading — before the error beacon in /site/topbar.js is up),
	// keep the evidence: collect early errors, report them once, and offer the way back.
	//
	// What the reports it sent back showed (2026-11-10, -12): every time it was a module that
	// FAILED TO LOAD, on a connection that was dropping requests (the same sessions logged
	// "server unreachable" and timeouts). One failed file out of the game's hundred or so fails
	// the whole game, and the browser will not try that file again on the same page. So when
	// that is what happened, the page now loads itself again by itself, twice at most (what
	// did load is in the browser's cache, so each try has less left to fetch); Fight!'s
	// marker is still there, so the fight opens as if nothing had happened. Only when that has
	// failed too does it stop and offer the Reload button.
	(function () {
		var errs = [], KEY = 'bc_boot_retry', MAX = 2, tried = 0, acted = false, scriptFailed = false;
		try { tried = Math.max(0, Math.min(MAX, +sessionStorage.getItem(KEY) || 0)); } catch (e) {}
		window.__bootErrors = errs; window.__bootRetries = tried;
		function box(id, text) {
			var d = document.createElement('div');
			d.id = id;
			d.className = 'bal-panel bal-outlined';
			d.style.cssText = 'position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:200;padding:16px 20px;font-size:20px;text-align:center;max-width:90vw;';
			d.textContent = text;
			(document.body || document.documentElement).appendChild(d);
			return d;
		}
		/** The game cannot start on this load. loadError: a script of it failed to download. */
		function failed(loadError) {
			if (acted || window.__gameBooted) return;
			acted = true;
			var again = loadError && tried < MAX;
			var msg = 'battlecards: the game module never started (' + (errs.join(' | ') || 'no error seen') + ')' + (tried ? ' [after ' + tried + ' automatic reload' + (tried > 1 ? 's' : '') + ']' : '') + (again ? ' [reloading]' : '');
			try { console.error(msg); } catch (e) {}
			try { navigator.sendBeacon && navigator.sendBeacon('/api/mp', new Blob([JSON.stringify({ action: 'err', msg: msg.slice(0, 300), where: 'index.html boot watchdog', page: location.pathname, ua: navigator.userAgent.slice(0, 120) })], { type: 'application/json' })); } catch (e) {}
			if (again) {
				try { sessionStorage.setItem(KEY, String(tried + 1)); } catch (e) { again = false; }   // (no way to count the tries: do not loop)
			}
			if (again) {
				box('boot-retry', 'The connection dropped part of the game. Loading it again…');
				setTimeout(function () { location.reload(); }, 1200 * (tried + 1));
				return;
			}
			var d = box('boot-failed', 'The game did not finish loading. Your run is saved — ');
			var b = document.createElement('button');
			b.textContent = 'Reload';
			b.className = 'bal-btn bal-green bal-sm';
			b.style.marginLeft = '6px';
			b.onclick = function () { try { sessionStorage.removeItem(KEY); } catch (e) {} location.reload(); };
			d.appendChild(b);
		}
		addEventListener('error', function (e) {
			var t = e && e.target, src = t && t.tagName === 'SCRIPT' ? String(t.src || '') : '';
			if (errs.length < 5) errs.push(String((e && (e.message || src)) || 'error').slice(0, 160));
			// the game's own script (game.js, or a file it imports: the failure is reported on game.js): act now, not in 12 s
			if (src && /\/battlecards\/game\.js(\?|$)/.test(src)) { scriptFailed = true; setTimeout(function () { failed(true); }, 0); }
		}, true);
		addEventListener('unhandledrejection', function (e) { if (errs.length < 5) errs.push(String((e && e.reason && (e.reason.message || e.reason)) || 'rejection').slice(0, 160)); });
		addEventListener('load', function () {
			setTimeout(function () {
				if (window.__gameBooted) { try { sessionStorage.removeItem(KEY); } catch (e) {} return; }   // (it started: the next failure starts counting afresh)
				failed(scriptFailed);
			}, 12000);
		});
	})();
	</script>
