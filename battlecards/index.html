<!DOCTYPE html>
<html>
<head>
	<title>Magepunk Battlecards</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<link rel="icon" href="data:,">
	<style>
		html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0a14; font-family: 'Segoe UI', sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
		body { height: 100dvh; }
		#scene { position: fixed; inset: 0; }
		.hud { position: fixed; color: #e8e2f4; text-shadow: 0 2px 6px #000; pointer-events: none; }
		#title { top: 12px; left: 18px; font-size: 17px; font-weight: 700; letter-spacing: 1px; }
		#title a { color: #9d8fd4; font-weight: 400; font-size: 13px; text-decoration: none; margin-left: 12px; pointer-events: auto; }
		#title a:hover { text-decoration: underline; }

		.panel {
			position: fixed; left: 18px; width: 190px; padding: 10px 14px;
			background: rgba(30,22,48,0.9); border: 1px solid #4a3f6b; border-radius: 10px;
			color: #e8e2f4; cursor: pointer; transition: box-shadow 0.15s, background 0.3s;
		}
		.panel:hover { box-shadow: 0 0 12px rgba(143,111,255,0.6); }
		.panel.hit { background: rgba(140,40,40,0.95); }
		.panel.armed { border-color: #57e389; box-shadow: 0 0 12px rgba(87,227,137,0.55); }
		.panel.targetable { border-color: #ff5f4f; box-shadow: 0 0 14px rgba(255,95,79,0.75); }
		.panel.turn { border-color: #ffd25f; }
		.panel.dead { opacity: 0.35; filter: grayscale(1); }
		.panel .gear { color: #ffd25f; font-size: 12.5px; line-height: 1.5; }
		/* hero portrait + class power orb */
		.panel .hero-id { float: right; display: flex; align-items: center; gap: 6px; margin: 2px 0 4px 8px; }
		.panel .portrait { display: block; border-radius: 50%; }
		.panel .power-orb { display: block; border-radius: 50%; cursor: pointer; transition: filter 0.15s, box-shadow 0.15s; }
		.panel .power-orb.usable { box-shadow: 0 0 10px rgba(87,227,137,0.9); }
		.panel .power-orb.spent { filter: grayscale(1) brightness(0.6); cursor: default; }

		/* small projected panels, one per opponent, centered on their slice */
		.panel.foe-sm {
			left: auto; width: auto; min-width: 118px; padding: 6px 10px;
			transform: translate(-50%, -100%);
		}
		.panel.foe-sm .life { font-size: 21px; }
		.panel.foe-sm .sub { font-size: 11.5px; }
		.panel.foe-sm .gear { font-size: 11.5px; }

		#player-count {
			background: #241b38; color: #e8e2f4; border: 1px solid #4a3f6b;
			border-radius: 6px; padding: 2px 6px; margin-left: 12px; pointer-events: auto;
		}

		/* hover rules tooltip */
		#tooltip {
			position: fixed; display: none; z-index: 9; width: 264px; pointer-events: none;
			background: rgba(22,16,36,0.96); border: 1px solid #8f6fff; border-radius: 10px;
			padding: 10px 12px; color: #e8e2f4; box-shadow: 0 6px 22px rgba(0,0,0,0.6);
		}
		#tooltip .tt-name { font-weight: 800; font-size: 15px; color: #f4eede; }
		#tooltip .tt-type { font-size: 10.5px; letter-spacing: 1px; color: #9d8fd4; margin: 2px 0 6px; }
		#tooltip .tt-desc { font-size: 13px; line-height: 1.45; }
		#tooltip .tt-sub { margin-top: 6px; font-size: 12px; color: #ffd25f; }
		#tooltip .tt-kw { margin-top: 5px; padding-top: 5px; border-top: 1px solid rgba(255,255,255,0.12); font-size: 11.5px; line-height: 1.3; }
		#tooltip .tt-kw b { color: #9fd0ff; }

		/* click-to-inspect panel: a big, pinned look at a hand card */
		#inspect {
			position: fixed; display: none; z-index: 8; left: 24px; top: 50%;
			transform: translateY(-50%); width: 300px; pointer-events: none;
			background: rgba(18,12,30,0.92); border: 1px solid #8f6fff; border-radius: 14px;
			padding: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.7);
		}
		#inspect canvas { width: 100%; height: auto; display: block; border-radius: 10px; }
		#inspect .ins-kw { margin-top: 8px; font-size: 11.5px; line-height: 1.35; color: #d8d0ee; }
		#inspect .ins-kw .tt-kw { margin-top: 5px; padding-top: 5px; border-top: 1px solid rgba(255,255,255,0.12); }
		#inspect .ins-kw .tt-kw b { color: #9fd0ff; }
		#inspect .ins-hint { margin-top: 9px; font-size: 11px; color: #9a8fc0; letter-spacing: .3px; }
		#inspect .ins-hint.no { color: #d98a8a; }

		/* scry / gaze decision modal */
		#scry-modal {
			position: fixed; display: none; z-index: 11; left: 50%; top: 42%;
			transform: translate(-50%, -50%); padding: 14px 16px;
			background: rgba(24,17,40,0.97); border: 1px solid #8f6fff; border-radius: 12px;
			box-shadow: 0 10px 40px rgba(0,0,0,0.8); color: #e8e2f4;
		}
		#scry-modal .wm-title { color: #c9b8ff; font-size: 14px; font-weight: 700; margin-bottom: 10px; }
		#scry-modal .scry-row { display: flex; gap: 12px; }
		#scry-modal .scry-cell { text-align: center; }
		#scry-modal .scry-cell canvas { border-radius: 8px; display: block; }
		#scry-modal .scry-cell button {
			margin-top: 6px; padding: 5px 16px; border-radius: 8px; border: 1px solid #5a4a8a;
			background: #3a2e5c; color: #e8e2f4; cursor: pointer; font-size: 13px;
		}
		#scry-modal .scry-cell button.bottom { background: #5c2e2e; border-color: #8a4a4a; }
		#scry-modal .scry-done {
			margin-top: 12px; width: 100%; padding: 8px; border-radius: 8px; border: none;
			background: #6b4fd4; color: #fff; font-weight: 700; cursor: pointer;
		}

		/* planeswalker ability picker */
		#walker-menu {
			position: fixed; display: none; z-index: 10; min-width: 230px;
			background: rgba(30,22,48,0.97); border: 1px solid #8f6fff; border-radius: 10px;
			padding: 8px; box-shadow: 0 6px 24px rgba(0,0,0,0.6);
		}
		#walker-menu .wm-title { color: #c9b8ff; font-size: 13px; font-weight: 700; margin: 2px 4px 8px; }
		#walker-menu button {
			display: block; width: 100%; text-align: left; margin: 4px 0; padding: 8px 10px;
			background: #3a2e5c; color: #e8e2f4; border: 1px solid #5a4a8a; border-radius: 8px;
			font-size: 13px; cursor: pointer;
		}
		#walker-menu button:hover:not(:disabled) { background: #4c3d78; }
		#walker-menu button:disabled { opacity: 0.4; cursor: default; }
		#walker-menu .wm-cost { color: #ffd25f; font-weight: 700; margin-right: 6px; }
		.panel .life { font-size: 30px; font-weight: 800; color: #ff8a7a; }
		.panel .sub { font-size: 12.5px; opacity: 0.85; line-height: 1.5; }
		/* hangs down from the projected hero point (mirror of the opponents' -100%),
		   so your land slots stay above it and your hand below */
		#my-panel { left: auto; width: auto; min-width: 150px; padding: 7px 12px; transform: translate(-50%, 0); transition: opacity 0.18s; }
		#my-panel .life { font-size: 23px; }
		#my-panel .sub { font-size: 11.5px; }
		/* while your hand is up it overlaps the panel; dim it so the hand reads in
		   front (a WebGL hand can't paint over a DOM node). Clicking the field tucks
		   the hand down and the panel goes solid again. */
		#my-panel.hand-up { opacity: 0.32; }
		#my-panel.hand-up:hover { opacity: 1; }

		#end-turn, #coin-btn, #planeswalk-btn {
			position: fixed; right: 26px; padding: 12px 26px; font-size: 16px; font-weight: 700;
			background: #6b4fd4; color: #fff; border: none; border-radius: 10px; cursor: pointer;
		}
		#end-turn { bottom: 46%; }
		#end-turn:disabled { background: #3a3055; color: #9b93b3; cursor: default; }
		#end-turn:not(:disabled):hover { background: #7d63e6; }
		#coin-btn { bottom: calc(46% - 56px); background: #b8952e; }
		#coin-btn:hover { background: #d4ad38; }
		#planeswalk-btn { bottom: calc(46% - 112px); background: #2f7d8c; }
		#planeswalk-btn:hover { background: #3c9fb2; }
		#autopass-btn {
			position: fixed; right: 26px; bottom: calc(46% - 156px); padding: 8px 16px;
			font-size: 13px; font-weight: 700; border: none; border-radius: 8px; cursor: pointer;
			background: #3a3055; color: #cfc7e6;
		}
		#autopass-btn.holding { background: #c76b2e; color: #fff; }

		#log {
			position: fixed; right: 18px; top: 52px; width: 250px; font-size: 12.5px; color: #b9b0d4;
			text-shadow: 0 1px 4px #000; pointer-events: none; line-height: 1.55;
		}
		#hint {
			position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
			color: #ffd25f; font-size: 14.5px; text-shadow: 0 2px 6px #000; pointer-events: none;
		}
		#banner {
			position: fixed; top: 38%; left: 50%; transform: translate(-50%, -50%);
			font-size: 54px; font-weight: 900; letter-spacing: 4px; color: #f4eede;
			text-shadow: 0 0 24px rgba(143,111,255,0.9), 0 4px 12px #000;
			opacity: 0; transition: opacity 0.35s; pointer-events: none;
		}
		#restart {
			position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
			padding: 14px 34px; font-size: 19px; font-weight: 700;
			background: #6b4fd4; color: #fff; border: none; border-radius: 12px; cursor: pointer;
		}
		#concede {
			position: fixed; right: 12px; top: 44px; z-index: 40;
			padding: 5px 12px; font-size: 12px; letter-spacing: 1px;
			background: #3a2f57; color: #cbb8e8; border: 1px solid #5a4a80;
			border-radius: 8px; cursor: pointer; opacity: 0.8;
		}
		#concede:hover { opacity: 1; }

		/* phones + small screens: compact chrome, finger-sized controls */
		@media (max-width: 760px) {
			#title { font-size: 13px; left: 10px; top: 8px; }
			#title a { font-size: 11px; margin-left: 7px; }
			#class-select, #player-count { font-size: 11px; margin-left: 6px !important; }
			.panel { left: 8px; width: 148px; padding: 7px 10px; }
			.panel .life { font-size: 24px; }
			.panel .sub, .panel .gear { font-size: 11px; }
			#end-turn, #coin-btn { right: 10px; padding: 14px 18px; font-size: 15px; }
			#log { display: none; }
			#hint { font-size: 12.5px; bottom: 6px; width: 94%; text-align: center; }
			#banner { font-size: 34px; }
			#tooltip { width: 216px; }
			#inspect { width: 158px; left: 8px; padding: 7px; }
			#inspect .ins-kw { display: none; }
		}
	</style>
	<script type="importmap">
	{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js" } }
	</script>
</head>
<body>
	<div id="scene"></div>
	<div id="title" class="hud">MAGEPUNK BATTLECARDS <a href="packs.html">packs</a> <a href="deck.html">deck builder</a> <a href="viewer.html">gallery</a> <a href="../overworld/">play the RPG</a>
		<select id="class-select" title="your class" style="background:#241b38;color:#e8e2f4;border:1px solid #4a3f6b;border-radius:6px;padding:2px 6px;margin-left:12px;pointer-events:auto"></select>
		<select id="player-count" title="players">
			<option value="2">2 players</option>
			<option value="3">3 players</option>
			<option value="4">4 players</option>
			<option value="5">5 players</option>
			<option value="6">6 players</option>
			<option value="7">7 players</option>
			<option value="8">8 players</option>
		</select>
	</div>

	<div id="foe-panels"></div>
	<div id="my-panel" class="panel">
		<div class="life" id="my-life">40</div>
		<div class="sub"><span id="my-title">Your Hero</span><br>Mana <span id="my-mana">1/1</span> · Deck <span id="my-deck">57</span></div>
		<div class="gear" id="my-gear"></div>
	</div>

	<button id="end-turn">End Turn</button>
	<button id="coin-btn" style="display:none">Coin (+1 mana)</button>
	<button id="planeswalk-btn" style="display:none">Planeswalk</button>
	<button id="autopass-btn" title="When on, you auto-pass priority. Turn off to get a 4s window to respond at instant speed.">Auto-pass: ON</button>
	<div id="log" class="hud"></div>
	<div id="hint" class="hud"></div>
	<div id="banner"></div>
	<div id="tooltip"></div>
	<div id="inspect"></div>
	<div id="walker-menu"></div>
	<div id="scry-modal"></div>
	<button id="restart" style="display:none">Play Again</button>
	<button id="concede" style="display:none">🏳 Concede run</button>

	<script type="module" src="game.js"></script>
	<script>window.__noEscBack = true; /* the game uses Esc for its own menus */</script>
	<script type="module" src="nav.js"></script>
</body>
</html>
