<!DOCTYPE html>
<html lang="en">
<head>
<!-- first, before any game code reads storage: per-account local data (site/account_silo.js) -->
<script src="/site/account_silo.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mp-topbar" content="compact">
<title>Magepunk — Sign in</title>
<meta name="description" content="Sign in to Magepunk to save your Battlecards collection, decks, and progress across devices.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%E2%9A%99%EF%B8%8F</text></svg>">
<!-- the site's Balatro-style UI kit (site/ui/): its tokens, the m6x11 font, the .bal-* components -->
<link rel="preload" href="/micatro/assets/fonts/m6x11plus.ttf?v=2" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="/site/ui/balatro.css">
<style>
	/* The Balatro look (site/ui/balatro.css): the felt, the m6x11 font, the sign-in box the kit's dialog panel, the
	   fields its dark wells, Log in a big blue kit button */
	* { box-sizing: border-box; }
	body { display: flex; align-items: center; justify-content: center; padding: 20px; }
	.panel { width: min(420px, 94vw); text-align: center; padding: 26px 24px 22px; }
	h1.bal-logo { margin: 0 0 6px; font-weight: normal; font-size: clamp(34px, 10vw, 64px); }
	.sub { color: var(--bal-text-soft); font-size: 20px; margin-bottom: 16px; }
	label { display: block; text-align: left; font-size: 19px; color: var(--bal-text-muted); margin: 12px 2px 5px; }
	input { width: 100%; }
	button#go { margin-top: 20px; }
	.flip { background: none; border: none; color: #9fd3ff; font-family: var(--bal-font); font-size: 19px; margin-top: 14px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
	.flip:focus-visible { outline: 3px solid #fff; outline-offset: 2px; border-radius: 6px; }
	.err { color: var(--bal-red); font-size: 19px; min-height: 22px; margin-top: 12px; text-shadow: var(--bal-text-shadow); }
	.hint { font-size: 16px; color: var(--bal-text-muted); margin-top: 16px; line-height: 1.2; }
</style>
</head>
<body class="bal-page">
<div class="panel bal-panel bal-outlined">
	<h1 class="bal-logo">MAGEPUNK</h1>
	<div class="sub" id="sub">Sign in to enter the world</div>

	<form id="form" autocomplete="on">
		<label for="u">Username</label>
		<input class="bal-input" id="u" name="username" autocomplete="username" maxlength="20" autocapitalize="none" autocorrect="off" spellcheck="false" required>
		<label for="p">Password</label>
		<input class="bal-input" id="p" name="password" type="password" autocomplete="current-password" minlength="6" required>
		<button class="bal-btn bal-blue bal-lg bal-wide" id="go" type="submit">Log in</button>
	</form>
	<div class="err" id="err"></div>
	<button class="flip" id="flip" type="button">No account? Create one</button>

	<div class="hint">Your collection, decks, packs, and progress live in your account. The Overworld and Battlecards 3D need a login; everything else is open.</div>
</div>

<script type="module">
import * as MP from '../battlecards/mpmode.js';

// where to go after signing in — the page that sent you here, else the
// Battlecards hub (the flagship, with the tour + every mode on one page).
// only same-origin absolute paths are honored, so ?next can't bounce off-site.
const params = new URLSearchParams(location.search);
const raw = params.get('next') || '/battlecards/start.html';
const next = /^\/(?!\/)/.test(raw) ? raw : '/battlecards/start.html';

// already signed in? skip the door.
if (MP.hasToken()) location.replace(next);

const $ = id => document.getElementById(id);
let registering = false;

function render() {
	$('go').textContent = registering ? 'Create account' : 'Log in';
	$('flip').textContent = registering ? 'Have an account? Log in' : 'No account? Create one';
	$('sub').textContent = registering ? 'Create an account to enter the world' : 'Sign in to enter the world';
	$('p').autocomplete = registering ? 'new-password' : 'current-password';
}
$('flip').addEventListener('click', () => { registering = !registering; $('err').textContent = ''; render(); });

$('form').addEventListener('submit', async (e) => {
	e.preventDefault();
	const u = $('u').value.trim(), p = $('p').value;
	if (!u || !p) { $('err').textContent = 'Enter a username and password.'; return; }
	$('err').textContent = '';
	$('go').disabled = true;
	try {
		const data = await MP.auth(registering ? 'register' : 'login', u, p);
		if (data && data.token) { location.replace(next); return; }
		$('err').textContent = (data && data.error) || 'Something went wrong. Try again.';
	} catch (err) {
		$('err').textContent = 'Network error. Try again.';
	}
	$('go').disabled = false;
});
render();
</script>
<!-- no mouse needed: arrows / WASD / d-pad move, Z / Enter / A picks, X / B backs out (site/focusnav.js) -->
<script type="module">import { initFocusNav } from '/site/focusnav.js'; initFocusNav();</script>
<script type="module" src="/site/topbar.js"></script>
<!-- Balatro's button sounds on every button and link (site/pagesounds.js; nothing plays before a press, no music) -->
<script type="module">import { wirePage } from '/site/pagesounds.js'; wirePage();</script> <!-- the shared top bar + the Games switcher (` / hold Esc / Start+Select / ⚙️) -->
</body>
</html>
