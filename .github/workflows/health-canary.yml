name: Production health canary

# TEMPORARY DIAGNOSTIC build — characterizing why curl gets a TLS handshake failure
# to the apex while browsers work. Will be replaced with the real canary.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose reachability
        run: |
          set +e
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36"
          for t in \
            "https://michaelgibalerio.com/" \
            "https://www.michaelgibalerio.com/" \
            "https://magepunk-cardart.pages.dev/" ; do
            echo "=== $t"
            printf 'default:   '; curl -sS -o /dev/null -w '%{http_code}\n' --max-time 15 "$t" 2>&1 | head -1
            printf 'browserUA: '; curl -sS -o /dev/null -w '%{http_code}\n' --max-time 15 -A "$UA" "$t" 2>&1 | head -1
            printf 'tls1.2:    '; curl -sS -o /dev/null -w '%{http_code}\n' --max-time 15 --tlsv1.2 --tls-max 1.2 "$t" 2>&1 | head -1
            printf 'tls1.3:    '; curl -sS -o /dev/null -w '%{http_code}\n' --max-time 15 --tlsv1.3 "$t" 2>&1 | head -1
            printf 'http1.1:   '; curl -sS -o /dev/null -w '%{http_code}\n' --max-time 15 --http1.1 "$t" 2>&1 | head -1
          done
          exit 0
