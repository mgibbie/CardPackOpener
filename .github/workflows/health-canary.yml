name: Production health canary

# Watches the LIVE site every 15 minutes and FAILS (emailing the repo owner) if
# anything is down — a bad deploy, a Cloudflare/D1 incident, or a lapsing cert.
# Public repo ⇒ Actions minutes are free; curl --retry rides out transient blips.
#
# Two things this guards that a real incident taught us: (1) it probes BOTH the
# apex and www, so an apex/DNS regression is caught (the apex was silently certless
# for months before we noticed); (2) it checks TLS cert EXPIRY on both hostnames and
# fails while there's still >=14 days left — so a broken or non-renewing cert pages
# you days ahead, not when a user hits a handshake failure.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe the live site, API, and TLS certs
        run: |
          set +e   # GitHub runs steps with -e; we manage failures ourselves
          UA="magepunk-health-canary"
          CERT_MIN_DAYS=14
          fail=0
          code() { curl -sS -A "$UA" --max-time 20 --retry 3 --retry-delay 5 --retry-all-errors \
            -o /dev/null -w '%{http_code}' "$@"; }
          # days until the cert at $1 expires; -1 if the handshake fails / no cert
          cert_days() {
            local host="$1"
            local end=$(echo | openssl s_client -connect "$host":443 -servername "$host" 2>/dev/null \
              | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
            [ -z "$end" ] && { echo "-1"; return; }
            local ee=$(date -d "$end" +%s 2>/dev/null); local now=$(date +%s)
            [ -z "$ee" ] && { echo "-1"; return; }
            echo $(( (ee - now) / 86400 ))
          }

          # BOTH hostnames must serve the site AND present a valid, non-expiring cert
          for host in www.michaelgibalerio.com michaelgibalerio.com; do
            c=$(code "https://$host/"); [ "$c" = 200 ] && echo "ok   $host root ($c)" || { echo "FAIL $host root: $c"; fail=1; }
            d=$(cert_days "$host")
            if [ "$d" -lt 0 ]; then echo "FAIL $host cert: could not read expiry (handshake failure / no cert)"; fail=1
            elif [ "$d" -lt "$CERT_MIN_DAYS" ]; then echo "FAIL $host cert expires in $d days (< $CERT_MIN_DAYS)"; fail=1
            else echo "ok   $host cert valid, $d days left"; fi
          done

          # key pages
          c=$(code "https://www.michaelgibalerio.com/battlecards/"); [ "$c" = 200 ] && echo "ok   battlecards page ($c)" || { echo "FAIL battlecards page: $c"; fail=1; }
          c=$(code "https://www.michaelgibalerio.com/overworld/");   [ "$c" = 200 ] && echo "ok   overworld page ($c)"   || { echo "FAIL overworld page: $c"; fail=1; }

          # API up AND its D1 read path works: `stats` is unauthenticated, no write
          resp=$(curl -sS -A "$UA" --max-time 20 --retry 3 --retry-delay 5 --retry-all-errors \
            -w $'\n%{http_code}' -X POST "https://www.michaelgibalerio.com/api/mp" -H 'content-type: application/json' -d '{"action":"stats","days":1}')
          apicode=$(printf '%s' "$resp" | tail -n1)
          apibody=$(printf '%s' "$resp" | sed '$d')
          if [ "$apicode" = 200 ] && printf '%s' "$apibody" | grep -q '"days"'; then echo "ok   /api/mp stats (200, D1 read ok)";
          else echo "FAIL /api/mp stats: status=$apicode body=$(printf '%s' "$apibody" | head -c 120)"; fail=1; fi

          # the auth gate is live: a protected action with no token must be 401
          c=$(code -X POST "https://www.michaelgibalerio.com/api/mp" -H 'content-type: application/json' -d '{"action":"state"}')
          [ "$c" = 401 ] && echo "ok   /api/mp auth gate rejects no-token ($c)" || { echo "FAIL auth gate (expected 401): $c"; fail=1; }

          echo "---"; [ "$fail" = 0 ] && echo "all healthy" || echo "one or more checks FAILED"
          exit $fail
