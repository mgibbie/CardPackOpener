name: Production health canary

# Everything else tests the CODE; this watches the LIVE site. Every 15 minutes it
# checks that the site and its /api/mp backend are up and behaving, and FAILS if
# not — a failed scheduled run emails the repo owner, so a real outage (a bad
# deploy, a Cloudflare/D1 incident) pages you instead of a player noticing first.
# Public repo ⇒ Actions minutes are free; curl --retry rides out transient blips.
#
# NOTE: probes www.michaelgibalerio.com, NOT the apex. The apex
# (michaelgibalerio.com) rejects non-browser TLS clients — curl gets an SSL
# handshake failure from both OpenSSL and schannel, while www serves 200 to all of
# them and browsers reach both. Same Cloudflare Pages project, so www is a faithful
# proxy for deployment health. (The apex/www TLS discrepancy is worth fixing
# separately — API/monitoring tools currently can't reach the canonical apex.)
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe the live site + API
        run: |
          set +e   # GitHub runs steps with -e; we manage failures ourselves
          BASE="https://www.michaelgibalerio.com"
          UA="magepunk-health-canary"
          fail=0
          code() { curl -sS -A "$UA" --max-time 20 --retry 3 --retry-delay 5 --retry-all-errors \
            -o /dev/null -w '%{http_code}' "$@"; }

          c=$(code "$BASE/");             [ "$c" = 200 ] && echo "ok   site root ($c)"        || { echo "FAIL site root: $c"; fail=1; }
          c=$(code "$BASE/battlecards/"); [ "$c" = 200 ] && echo "ok   battlecards page ($c)" || { echo "FAIL battlecards page: $c"; fail=1; }
          c=$(code "$BASE/overworld/");   [ "$c" = 200 ] && echo "ok   overworld page ($c)"   || { echo "FAIL overworld page: $c"; fail=1; }

          # API up AND its D1 read path works: `stats` is unauthenticated, reads the
          # analytics rollups, returns { days: [...] } — no write, no auth.
          resp=$(curl -sS -A "$UA" --max-time 20 --retry 3 --retry-delay 5 --retry-all-errors \
            -w $'\n%{http_code}' -X POST "$BASE/api/mp" -H 'content-type: application/json' -d '{"action":"stats","days":1}')
          apicode=$(printf '%s' "$resp" | tail -n1)
          apibody=$(printf '%s' "$resp" | sed '$d')
          if [ "$apicode" = 200 ] && printf '%s' "$apibody" | grep -q '"days"'; then echo "ok   /api/mp stats (200, D1 read ok)";
          else echo "FAIL /api/mp stats: status=$apicode body=$(printf '%s' "$apibody" | head -c 120)"; fail=1; fi

          # the auth gate is live: a protected action with no token must be 401, not 200
          c=$(code -X POST "$BASE/api/mp" -H 'content-type: application/json' -d '{"action":"state"}')
          [ "$c" = 401 ] && echo "ok   /api/mp auth gate rejects no-token ($c)" || { echo "FAIL auth gate (expected 401): $c"; fail=1; }

          echo "---"; [ "$fail" = 0 ] && echo "all healthy" || echo "one or more checks FAILED"
          exit $fail
