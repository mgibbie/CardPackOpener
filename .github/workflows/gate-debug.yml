name: Gate debug (temporary)
on:
  push:
    branches: [feat/ci-gate]
permissions:
  contents: read
jobs:
  debug:
    if: contains(github.event.head_commit.message, '[ci-debug]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHROME: /usr/bin/google-chrome
      MICATRO_MAIN: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: |
            overworld/data
            micasurvivor/assets
            micatro/mods/*/assets
          key: gate-assets-v1-${{ hashFiles('tools/cloud/*_manifest.txt') }}
      - run: npm install --no-audit --no-fund && node tools/cloud/fetch-owdata.mjs > /dev/null && node tools/cloud/fetch-assets.mjs
      - name: suites
        env:
          TZ: America/New_York
        run: |
          timeout 200 node overworld/tests/micasurvivor_expedition_terrain_test.mjs 2>&1 | grep -E 'FAIL|passed' | cut -c1-3000
          TZ=UTC timeout 200 node overworld/tests/micasurvivor_expedition_terrain_test.mjs 2>&1 | grep -E 'FAIL|passed' | cut -c1-3000
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-shots
          path: overworld/tests/*.png
          if-no-files-found: ignore
