name: Add apex custom domain to Cloudflare Pages

# One-shot helper to fix the apex TLS failure: registers michaelgibalerio.com as a
# custom domain on the Pages project so Cloudflare provisions a certificate for it.
#
# REQUIRES two repo secrets first (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — a token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account id
# Then run it: Actions tab → this workflow → "Run workflow"  (or: gh workflow run add-apex-domain.yml)
#
# NOTE: this domain's DNS is at Namecheap, not Cloudflare. The apex A records already
# point to Cloudflare Pages, so registering the custom domain should trigger cert
# issuance — but external-DNS apex validation can lag or need a verification record.
# The Cloudflare dashboard shows that status most clearly; the cleanest permanent fix
# is to move the domain's nameservers to Cloudflare. This workflow prints each
# domain's status so you can see whether the cert went "active".
on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Custom domain to add"
        default: "michaelgibalerio.com"
      project:
        description: "Cloudflare Pages project name"
        default: "michaelgibalerio"

permissions:
  contents: read

jobs:
  add-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Register the custom domain via the Cloudflare API
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOMAIN: ${{ inputs.domain }}
          PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          if [ -z "${CF_TOKEN:-}" ] || [ -z "${CF_ACCOUNT:-}" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets first, then re-run."
            exit 1
          fi
          API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$PROJECT/domains"
          echo "Registering '$DOMAIN' on Pages project '$PROJECT'…"
          add=$(curl -sS -X POST "$API" \
            -H "Authorization: Bearer $CF_TOKEN" -H 'content-type: application/json' \
            -d "{\"name\":\"$DOMAIN\"}")
          echo "$add" | jq . 2>/dev/null || echo "$add"
          # success, or "already added", both count as OK
          if [ "$(echo "$add" | jq -r '.success' 2>/dev/null)" != "true" ] \
             && ! echo "$add" | jq -e '.errors[]?|select((.message//"")|test("already";"i"))' >/dev/null 2>&1; then
            echo "::error::Could not add the domain (see the response above)."
            exit 1
          fi
          echo "--- custom domains on the project now (name → status) ---"
          curl -sS "$API" -H "Authorization: Bearer $CF_TOKEN" \
            | jq -r '.result[] | "\(.name)\t→ \(.status)"' 2>/dev/null || true
          echo "If the apex shows 'pending', give Cloudflare a few minutes to issue the cert,"
          echo "then verify:  curl -I https://$DOMAIN/   (expect 200 or a 301 to www, not a handshake failure)."
