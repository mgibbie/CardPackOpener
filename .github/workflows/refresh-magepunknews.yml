name: Refresh Magepunk News

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-migration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rebuild Magepunk News from Battlecards history
        run: node tools/gen-magepunknews.mjs
      - name: Commit refreshed news feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add magepunknews/news.json
          git diff --cached --quiet || git commit -m "Refresh Magepunk News"
          git push origin HEAD:cloudflare-migration
