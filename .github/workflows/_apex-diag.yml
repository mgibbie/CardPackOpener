name: apex TLS diagnostic (throwaway)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: DNS — apex vs www
        run: |
          set +e
          echo "== apex A ==";     dig +short michaelgibalerio.com A
          echo "== apex AAAA ==";  dig +short michaelgibalerio.com AAAA
          echo "== apex CNAME =="; dig +short michaelgibalerio.com CNAME
          echo "== www A ==";      dig +short www.michaelgibalerio.com A
          echo "== www CNAME ==";  dig +short www.michaelgibalerio.com CNAME
          echo "== nameservers =="; dig +short michaelgibalerio.com NS
      - name: HTTP :80 — does the apex answer / where does it point?
        run: |
          set +e
          echo "== apex http (:80) headers =="
          curl -sS -I --max-time 15 http://michaelgibalerio.com/ 2>&1 | head -25
          echo "== www https headers =="
          curl -sS -I --max-time 15 https://www.michaelgibalerio.com/ 2>&1 | grep -iE 'HTTP/|server:|cf-ray:|location:' | head
      - name: TLS — apex handshake (SNI = apex)
        run: |
          set +e
          echo "== openssl apex, SNI=apex =="
          echo | timeout 15 openssl s_client -connect michaelgibalerio.com:443 -servername michaelgibalerio.com 2>&1 | head -30
      - name: TLS — www cert (issuer + SANs)
        run: |
          set +e
          echo "== www cert =="
          echo | timeout 15 openssl s_client -connect www.michaelgibalerio.com:443 -servername www.michaelgibalerio.com 2>&1 \
            | grep -iE 'subject=|issuer=|Verify return|Protocol|Cipher' | head
          echo "== www cert SANs =="
          echo | timeout 15 openssl s_client -connect www.michaelgibalerio.com:443 -servername www.michaelgibalerio.com 2>&1 \
            | openssl x509 -noout -ext subjectAltName 2>/dev/null
      - name: TLS — SNI isolation (same edge IP, apex SNI vs www SNI)
        run: |
          set +e
          IP=$(dig +short michaelgibalerio.com A | head -1); echo "apex resolves to: $IP"
          echo "== IP + SNI=www (does the edge have a cert for www?) =="
          echo | timeout 15 openssl s_client -connect "$IP:443" -servername www.michaelgibalerio.com 2>&1 | grep -iE 'subject=|issuer=|Verify return|handshake|alert' | head
          echo "== IP + SNI=apex (does the edge have a cert for the APEX?) =="
          echo | timeout 15 openssl s_client -connect "$IP:443" -servername michaelgibalerio.com 2>&1 | grep -iE 'subject=|issuer=|Verify return|handshake|alert' | head
