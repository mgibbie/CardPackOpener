<!DOCTYPE html>
<html lang="en">
<head>
<!-- first, before any game code reads storage: per-account local data (site/account_silo.js) -->
<script src="/site/account_silo.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mp-topbar" content="compact">
<title>Magepunk — Profile</title>
<meta name="description" content="Your Magepunk player profile — friend code, stats, and achievements.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%E2%9A%99%EF%B8%8F</text></svg>">
<!-- the site's Balatro-style UI kit (site/ui/): its tokens, the m6x11 font, the .bal-* components -->
<link rel="preload" href="/micatro/assets/fonts/m6x11plus.ttf?v=2" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="/site/ui/balatro.css">
<style>
	/* The Balatro look (site/ui/balatro.css): the felt, the m6x11 font, stat and achievement tiles as kit panels on
	   a dark lip, bars as the kit's bars, buttons by meaning (Log out red, Save green). It used to borrow the Design
	   Wiki's stylesheet for its shell; it now stands on the kit alone. The page's own names map onto the kit's tokens. */
	:root { --panel: var(--bal-panel); --panel-2: var(--bal-panel-d); --panel-3: var(--bal-panel-dd); --border: var(--bal-panel-line); --text: var(--bal-text); --muted: var(--bal-text-muted);
		--gold: var(--bal-money); --blue: var(--bal-blue); --violet: var(--bal-purple); --green: var(--bal-green); }
	* { box-sizing: border-box; }
	a { color: #9fd3ff; text-decoration: none; }
	a:hover { text-decoration: underline; }
	h1 { margin: 0 0 4px; font-size: 46px; font-weight: normal; text-shadow: 0 .09em 0 rgba(0,0,0,.35); }
	h2 { margin: 28px 0 10px; font-size: 30px; font-weight: normal; text-shadow: var(--bal-text-shadow); display: flex; align-items: baseline; gap: 10px; }
	.muted, .num { color: var(--muted); }
	.num { font-size: 22px; }

	/* the page's own header: the kit's dark strip; the floating compact top-bar cluster (site/topbar.js) sits
	   top-right, so clear room for it */
	header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; background: var(--bal-panel-dd); box-shadow: 0 5px 0 rgba(0,0,0,.25);
		padding: 10px 104px 8px 18px; font-size: 21px; }
	.bal-page header a { color: #fff; }
	header .brand { font-size: 28px; text-shadow: .03em .04em 0 var(--bal-red), .06em .08em 0 var(--bal-blue); }
	header .right { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 20px; }
	.bal-page header .right a, header #who { color: var(--gold); }
	#content { max-width: 900px; margin: 0 auto; padding: 22px 16px 48px; }
	.friendcode { color: var(--muted); font-size: 20px; margin: 2px 0 18px; }
	.friendcode b { letter-spacing: 3px; font-size: 24px; color: var(--gold); }

	/* stat tiles */
	.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px 10px; margin: 12px 0 10px; }
	.stat { background: var(--panel); border-radius: 14px; padding: 10px 14px 8px; box-shadow: 0 6px 0 var(--panel-3), inset 0 0 0 3px var(--border); }
	.stat .v { font-size: 32px; color: var(--gold); text-shadow: var(--bal-text-shadow); }
	.stat .l { font-size: 16px; color: var(--muted); margin-top: 2px; line-height: 1.1; }

	/* achievement tiles */
	.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px 10px; margin-top: 12px; }
	.ach { display: flex; gap: 12px; background: var(--panel); border-radius: 14px; padding: 12px 14px 10px; align-items: flex-start; box-shadow: 0 6px 0 var(--panel-3), inset 0 0 0 3px var(--border); }
	.ach.done { box-shadow: 0 6px 0 var(--panel-3), inset 0 0 0 3px var(--bal-gold); }
	.ach.locked { opacity: 0.6; filter: grayscale(0.6); }
	.ach .ico { font-size: 28px; line-height: 1; margin-top: 2px; }
	.ach .nm { font-size: 21px; }
	.ach .ds { font-size: 16px; color: var(--muted); margin: 1px 0 6px; line-height: 1.1; }
	.ach .bar { background: rgba(0,0,0,.4); border-radius: 6px; height: 12px; overflow: hidden; }
	.ach .bar > span { display: block; height: 12px; border-radius: 6px; background: var(--bal-blue); }
	.ach.done .bar > span { background: var(--bal-green); }
	.ach .pr { font-size: 15px; color: var(--muted); margin-top: 4px; }
	.ach-summary { color: var(--muted); margin: 4px 0 0; font-size: 18px; }

	/* account panel (recovery email) */
	.acct-panel { background: var(--panel); border-radius: 16px; padding: 14px 16px; margin-top: 12px; box-shadow: 0 7px 0 var(--panel-3), inset 0 0 0 3px var(--border); }
	.acct-panel label { font-size: 22px; }
	.acct-opt { color: var(--muted); font-size: 17px; }
	.acct-line { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; align-items: flex-start; }
	.acct-line input { flex: 1 1 220px; }
	.bal-btn[hidden] { display: none; }   /* (the kit's buttons are inline-flex: keep [hidden] hiding Remove) */
	.acct-note { color: var(--muted); font-size: 16px; margin: 8px 0 0; line-height: 1.2; }
	.acct-msg { color: var(--green); font-size: 18px; min-height: 22px; margin-top: 6px; }
	@media (max-width: 520px) { header { padding-right: 104px; gap: 10px; font-size: 19px; } h1 { font-size: 38px; } }
</style>
</head>
<body class="bal-page">
<header>
	<a class="brand" href="/">Magepunk</a>
	<a href="/collection/">Collection</a>
	<a href="/overworld/">Overworld</a>
	<a href="/battlecards/">Battlecards</a>
	<div class="right">
		<span id="who"></span>
		<button class="logout bal-btn bal-red bal-sm" id="logout">Log out</button>
	</div>
</header>
<div id="content"><p class="muted">Loading your profile…</p></div>

<script type="module">
import * as MP from '../battlecards/mpmode.js';
import { ACH, metrics, markAllSeen } from '/site/achievements.js';
if (!MP.hasToken()) location.replace('/login/?next=' + encodeURIComponent('/profile/'));
document.getElementById('logout').addEventListener('click', () => MP.logout());

const content = document.getElementById('content');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// the achievements list + metric builder live in /site/achievements.js (shared
// with the in-game unlock toasts)

(async () => {
	let s;
	try { s = await MP.freshState(); } catch (e) { s = MP.cachedState(); }
	if (!s) { location.replace('/login/?next=' + encodeURIComponent('/profile/')); return; }
	document.getElementById('who').textContent = s.username;

	// the collectible pool packs/decks draw from — for completion achievements
	let poolSize = 0;
	try { poolSize = Object.keys(await (await fetch('/server/pool-rarity.json')).json()).length; } catch (e) {}

	const col = s.collection || {};
	const distinct = Object.values(col).filter(n => n > 0).length;
	const copies = Object.values(col).reduce((a, b) => a + (b || 0), 0);
	const m = metrics(s, { poolSize });
	markAllSeen(m); // viewing the profile syncs the in-game unlock-toast seen-set
	const achievements = ACH(m);
	const unlocked = achievements.filter(a => a.have >= a.need).length;

	const statTile = (v, l) => `<div class="stat"><div class="v">${v}</div><div class="l">${l}</div></div>`;
	const achTile = (a) => {
		const done = a.have >= a.need;
		const pct = Math.min(100, Math.round(a.have / a.need * 100));
		return `<div class="ach ${done ? 'done' : 'locked'}">
			<div class="ico">${a.ico}</div>
			<div style="flex:1">
				<div class="nm">${esc(a.nm)}</div>
				<div class="ds">${esc(a.ds)}</div>
				<div class="bar"><span style="width:${pct}%"></span></div>
				<div class="pr">${done ? 'Unlocked' : `${a.have.toLocaleString()} / ${a.need.toLocaleString()}`}</div>
			</div>
		</div>`;
	};

	content.innerHTML = `
		<h1>${esc(s.username)}</h1>
		<div class="friendcode">${s.friendCode ? `Friend code: <b>${esc(s.friendCode)}</b>` : ''}</div>
		<div class="stats-grid">
			${statTile(distinct.toLocaleString(), 'different cards' + (poolSize ? ` (${Math.round(distinct / poolSize * 100)}% of ${poolSize.toLocaleString()})` : ''))}
			${statTile(copies.toLocaleString(), 'total copies')}
			${statTile(m.packsOpened.toLocaleString(), 'packs opened')}
			${statTile((s.packs || 0).toLocaleString(), 'packs unopened')}
			${statTile(m.runs.toLocaleString(), 'dungeon runs')}
			${statTile(m.wins.toLocaleString(), 'wins')}
			${statTile(m.decks.toLocaleString(), 'decks saved')}
			${statTile(m.friends.toLocaleString(), 'friends')}
		</div>
		<h2>Achievements <span class="num">${unlocked} / ${achievements.length}</span></h2>
		<p class="ach-summary">Earned by playing — runs, wins, packs, collecting, deckbuilding, friends, and your Pokémon journey.</p>
		<div class="ach-grid">${achievements.map(achTile).join('')}</div>
		<h2>Account</h2>
		<div class="acct-panel">
			<div class="acct-row">
				<label for="acct-email">Recovery email <span class="acct-opt">(optional)</span></label>
				<div class="acct-line">
					<input class="bal-input" id="acct-email" type="email" maxlength="254" placeholder="you@example.com" autocomplete="email" value="${esc(s.email || '')}">
					<button class="bal-btn bal-green" id="acct-email-save">Save</button>
					<button id="acct-email-remove" class="acct-ghost bal-btn bal-grey" ${s.email ? '' : 'hidden'}>Remove</button>
				</div>
				<p class="acct-note">Never required. If you ever forget your password, an email on file is how we verify it's really you and restore the account — without one, a lost password loses the account. It's never shown to other players or used for anything else.</p>
				<div class="acct-msg" id="acct-email-msg" role="status"></div>
			</div>
		</div>
		<h2>Collection</h2>
		<p>Browse every card you own in the <a href="/collection/">Collection gallery</a>.</p>
		<h2>Pocket Enhanced</h2>
		<div id="pocket-stats"><p class="ach-summary">Loading…</p></div>
		<h2>Your replays</h2>
		<p>Every replay of yours, from every game. Friends playing live are on the <a href="/watch/">Watch page</a>.</p>
		<div id="replay-library"></div>
	`;

	// ---- the account's replay library (site/replaylib.js; the same list as the Watch page) ----
	import('/site/replaylib.js').then((L) => {
		const st = document.createElement('style'); st.textContent = L.LIBRARY_CSS; document.head.appendChild(st);
		return L.renderLibrary(document.getElementById('replay-library'), MP);
	}).catch(() => { document.getElementById('replay-library').innerHTML = '<p class="ach-summary">Could not load your replays just now.</p>'; });

	// ---- Pocket Enhanced: the account's card collection there (a read; this page never creates or changes one) ----
	(async () => {
		const box = document.getElementById('pocket-stats');
		const none = '<p>No cards yet. <a href="/pocketenhanced/">Play Pocket Enhanced →</a></p>';
		try {
			const r = await MP.call('pkcol-get', {});
			if (!r || !r.col) { box.innerHTML = none; return; }
			const [C, D] = await Promise.all([import('/pocketenhanced/js/collection.js'), import('/pocketenhanced/js/data/cards.js')]);
			const col = C.cleanCollection(r.col);
			if (!col) { box.innerHTML = none; return; }
			const unique = C.uniqueOwned(col), total = Object.values(col.prints).reduce((a, b) => a + b, 0);
			box.innerHTML = `<div class="stats-grid">
				${statTile(unique.toLocaleString(), `different cards (${Math.round(unique / D.CARDS.length * 100)}% of ${D.CARDS.length.toLocaleString()})`)}
				${statTile(total.toLocaleString(), 'total copies')}
				${statTile((col.opened || 0).toLocaleString(), 'packs opened')}
				${statTile((col.packs || 0).toLocaleString(), 'packs unopened')}
			</div><p><a href="/pocketenhanced/">Play Pocket Enhanced →</a></p>`;
		} catch (e) { box.innerHTML = '<p class="ach-summary">Could not load your Pocket Enhanced collection just now.</p>'; }
	})();

	// ---- optional recovery email (set-email; empty = remove) ----
	const emailIn = document.getElementById('acct-email');
	const emailMsg = document.getElementById('acct-email-msg');
	const removeBtn = document.getElementById('acct-email-remove');
	async function saveEmail(value) {
		emailMsg.textContent = 'Saving…';
		let r; try { r = await MP.call('set-email', { email: value }); } catch { r = null; }
		if (r && r.ok) {
			emailIn.value = r.email || '';
			removeBtn.hidden = !r.email;
			emailMsg.textContent = r.email ? 'Saved. This email can now vouch for your account.' : 'Removed — no email on file.';
		} else {
			emailMsg.textContent = (r && r.error) || 'Could not save — try again.';
		}
	}
	document.getElementById('acct-email-save').addEventListener('click', () => saveEmail(emailIn.value.trim()));
	emailIn.addEventListener('keydown', e => { if (e.key === 'Enter') saveEmail(emailIn.value.trim()); });
	removeBtn.addEventListener('click', () => saveEmail(''));
})();
</script>
	<!-- no mouse needed: arrows / WASD / d-pad move, Z / Enter / A picks, X / B backs out (site/focusnav.js) -->
	<script type="module">import { initFocusNav } from '/site/focusnav.js'; initFocusNav();</script>
	<script type="module" src="/site/topbar.js"></script>
	<!-- Balatro's button sounds on every button and link (site/pagesounds.js; nothing plays before a press, no music) -->
	<script type="module">import { wirePage } from '/site/pagesounds.js'; wirePage();</script>
</body>
</html>
