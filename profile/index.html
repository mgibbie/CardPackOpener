<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magepunk — Profile</title>
<!-- shares the Design Wiki's look -->
<link rel="stylesheet" href="../designwiki/style.css?v=20260817">
<style>
	header .right { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; }
	header .right a { color: #ffe9a8; font-weight: 600; }
	header button.logout { background: #3a4a74; padding: 5px 12px; font-size: 12.5px; }
	header button.logout:hover { background: #4a5c8c; }
	#content { max-width: 900px; margin: 0 auto; }
	.friendcode { color: #76819c; font-size: 14px; margin: 2px 0 18px; }
	.friendcode b { font-family: monospace; font-size: 17px; letter-spacing: 3px; color: #b9770e; }

	/* stat tiles */
	.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 12px 0 6px; }
	.stat { background: #fff; border: 1px solid #e1e6f0; border-radius: 10px; padding: 12px 14px; }
	.stat .v { font-size: 22px; font-weight: 700; color: #1f2a44; }
	.stat .l { font-size: 12px; color: #76819c; margin-top: 2px; }

	/* achievement tiles */
	.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin-top: 12px; }
	.ach { display: flex; gap: 12px; background: #fff; border: 1px solid #e1e6f0; border-radius: 10px; padding: 12px 14px; align-items: flex-start; }
	.ach.locked { opacity: 0.55; filter: grayscale(0.6); }
	.ach .ico { font-size: 26px; line-height: 1; margin-top: 2px; }
	.ach .nm { font-weight: 600; }
	.ach .ds { font-size: 12.5px; color: #76819c; margin: 1px 0 6px; }
	.ach .bar { background: #eef1f7; border-radius: 4px; height: 7px; }
	.ach .bar > span { display: block; height: 7px; border-radius: 4px; background: #2b6cb0; }
	.ach.done .bar > span { background: #1f9d57; }
	.ach .pr { font-size: 11.5px; color: #98a2bd; margin-top: 3px; }
	.ach-summary { color: #76819c; margin: 4px 0 0; }
</style>
</head>
<body>
<header>
	<a class="brand" href="/">Magepunk</a>
	<a href="/collection/">Collection</a>
	<a href="/overworld/">Overworld</a>
	<a href="/battlecards/">Battlecards</a>
	<div class="right">
		<span id="who"></span>
		<button class="logout" id="logout">Log out</button>
	</div>
</header>
<div id="content"><p class="muted">Loading your profile…</p></div>

<script type="module">
import * as MP from '../battlecards/mpmode.js';
if (!MP.hasToken()) location.replace('/login/?next=' + encodeURIComponent('/profile/'));
document.getElementById('logout').addEventListener('click', () => MP.logout());

const content = document.getElementById('content');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// tiered achievements, all computed from the real account state
const ACH = (m) => [
	{ ico: '🕯️', nm: 'First Delve', ds: 'Complete a dungeon run.', have: m.runs, need: 1 },
	{ ico: '⛏️', nm: 'Seasoned Delver', ds: 'Complete 10 dungeon runs.', have: m.runs, need: 10 },
	{ ico: '🏰', nm: 'Dungeon Fixture', ds: 'Complete 50 dungeon runs.', have: m.runs, need: 50 },
	{ ico: '⚔️', nm: 'First Victory', ds: 'Win a run.', have: m.wins, need: 1 },
	{ ico: '🛡️', nm: 'Boss Breaker', ds: 'Win 10 runs.', have: m.wins, need: 10 },
	{ ico: '👑', nm: 'Dungeon Master', ds: 'Win 25 runs.', have: m.wins, need: 25 },
	{ ico: '📦', nm: 'Fresh Wrapper', ds: 'Open a card pack.', have: m.packsOpened, need: 1 },
	{ ico: '🎁', nm: 'Pack Rat', ds: 'Open 25 packs.', have: m.packsOpened, need: 25 },
	{ ico: '💰', nm: 'Cardboard Tycoon', ds: 'Open 100 packs.', have: m.packsOpened, need: 100 },
	{ ico: '🃏', nm: 'Collector', ds: 'Own 100 different cards.', have: m.distinct, need: 100 },
	{ ico: '📚', nm: 'Curator', ds: 'Own 500 different cards.', have: m.distinct, need: 500 },
	{ ico: '🏛️', nm: 'Archivist', ds: 'Own 2,000 different cards.', have: m.distinct, need: 2000 },
	...(m.poolSize ? [
		{ ico: '🌱', nm: 'Getting Started', ds: 'Collect 10% of all cards.', have: m.distinct, need: Math.ceil(m.poolSize * 0.10) },
		{ ico: '⚖️', nm: 'Halfway There', ds: 'Collect 50% of all cards.', have: m.distinct, need: Math.ceil(m.poolSize * 0.50) },
		{ ico: '💎', nm: 'Completionist', ds: 'Collect every card.', have: m.distinct, need: m.poolSize },
	] : []),
	{ ico: '🛠️', nm: 'Deck Builder', ds: 'Save a deck.', have: m.decks, need: 1 },
	{ ico: '🧠', nm: 'Strategist', ds: 'Save 5 decks.', have: m.decks, need: 5 },
	{ ico: '🗃️', nm: 'Arsenal', ds: 'Save 20 decks.', have: m.decks, need: 20 },
	{ ico: '🤝', nm: 'Well Met', ds: 'Add a friend.', have: m.friends, need: 1 },
	{ ico: '🎉', nm: 'Popular', ds: 'Have 5 friends.', have: m.friends, need: 5 },
];

(async () => {
	let s;
	try { s = await MP.freshState(); } catch (e) { s = MP.cachedState(); }
	if (!s) { location.replace('/login/?next=' + encodeURIComponent('/profile/')); return; }
	document.getElementById('who').textContent = s.username;

	// the collectible pool packs/decks draw from — for completion achievements
	let poolSize = 0;
	try { poolSize = Object.keys(await (await fetch('/server/pool-rarity.json')).json()).length; } catch (e) {}

	const col = s.collection || {};
	const distinct = Object.values(col).filter(n => n > 0).length;
	const copies = Object.values(col).reduce((a, b) => a + (b || 0), 0);
	const st = s.stats || {};
	const m = {
		runs: st.runs || 0, wins: st.wins || 0, packsOpened: st.packsOpened || 0,
		distinct, decks: (s.decks || []).length, friends: (s.friends || []).length, poolSize,
	};
	const achievements = ACH(m);
	const unlocked = achievements.filter(a => a.have >= a.need).length;

	const statTile = (v, l) => `<div class="stat"><div class="v">${v}</div><div class="l">${l}</div></div>`;
	const achTile = (a) => {
		const done = a.have >= a.need;
		const pct = Math.min(100, Math.round(a.have / a.need * 100));
		return `<div class="ach ${done ? 'done' : 'locked'}">
			<div class="ico">${a.ico}</div>
			<div style="flex:1">
				<div class="nm">${esc(a.nm)}</div>
				<div class="ds">${esc(a.ds)}</div>
				<div class="bar"><span style="width:${pct}%"></span></div>
				<div class="pr">${done ? 'Unlocked' : `${a.have.toLocaleString()} / ${a.need.toLocaleString()}`}</div>
			</div>
		</div>`;
	};

	content.innerHTML = `
		<h1>${esc(s.username)}</h1>
		<div class="friendcode">${s.friendCode ? `Friend code: <b>${esc(s.friendCode)}</b>` : ''}</div>
		<div class="stats-grid">
			${statTile(distinct.toLocaleString(), 'different cards' + (poolSize ? ` (${Math.round(distinct / poolSize * 100)}% of ${poolSize.toLocaleString()})` : ''))}
			${statTile(copies.toLocaleString(), 'total copies')}
			${statTile(m.packsOpened.toLocaleString(), 'packs opened')}
			${statTile((s.packs || 0).toLocaleString(), 'packs unopened')}
			${statTile(m.runs.toLocaleString(), 'dungeon runs')}
			${statTile(m.wins.toLocaleString(), 'wins')}
			${statTile(m.decks.toLocaleString(), 'decks saved')}
			${statTile(m.friends.toLocaleString(), 'friends')}
		</div>
		<h2>Achievements <span class="num">${unlocked} / ${achievements.length}</span></h2>
		<p class="ach-summary">Earned by playing — runs, wins, packs, collecting, deckbuilding, and friends.</p>
		<div class="ach-grid">${achievements.map(achTile).join('')}</div>
		<h2>Collection</h2>
		<p>Browse every card you own in the <a href="/collection/">Collection gallery</a>.</p>
	`;
})();
</script>
	<script type="module" src="/site/topbar.js"></script>
</body>
</html>
