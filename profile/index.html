<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mp-topbar" content="compact">
<title>Magepunk — Profile</title>
<meta name="description" content="Your Magepunk player profile — friend code, stats, and achievements.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%E2%9A%99%EF%B8%8F</text></svg>">
<!-- shares the Design Wiki's look -->
<link rel="stylesheet" href="../designwiki/style.css?v=20260817">
<style>
	/* Battlecards dark identity laid over the wiki's light shell (mirrors
	   collection/index.html) — Profile is a game-facing page, so it holds the
	   dark purple/brass look instead of the wiki's light default */
	:root { --bg-0:#0c1122; --bg-1:#141a35; --panel:#1a2140; --panel-2:#212a52; --border:#2e3a63; --text:#e8eaf6; --muted:#9aa3c8; --gold:#ffcf6b; --blue:#6ea8ff; --violet:#a688ff; --green:#6bd6a0; }
	body { color: var(--text); background: radial-gradient(1100px 560px at 12% -10%, rgba(166,136,255,.16), transparent 60%), radial-gradient(900px 480px at 92% 0%, rgba(255,207,107,.12), transparent 55%), linear-gradient(180deg, var(--bg-1), var(--bg-0) 60%); background-attachment: fixed; }
	a { color: var(--blue); }
	h1, h2 { color: var(--text); }
	h2 { border-bottom-color: var(--border); }
	.muted, .num { color: var(--muted); }

	/* the page keeps its own single header; the floating compact topbar cluster
	   (site/topbar.js) sits top-right, so clear room for it */
	header { padding-right: 104px; }
	header .right { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; }
	header .right a { color: #ffe9a8; font-weight: 600; }
	header button.logout { background: #3a4a74; padding: 5px 12px; font-size: 12.5px; }
	header button.logout:hover { background: #4a5c8c; }
	#content { max-width: 900px; margin: 0 auto; }
	.friendcode { color: var(--muted); font-size: 14px; margin: 2px 0 18px; }
	.friendcode b { font-family: monospace; font-size: 17px; letter-spacing: 3px; color: var(--gold); }

	/* stat tiles */
	.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 12px 0 6px; }
	.stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
	.stat .v { font-size: 22px; font-weight: 700; color: var(--text); }
	.stat .l { font-size: 12px; color: var(--muted); margin-top: 2px; }

	/* achievement tiles */
	.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin-top: 12px; }
	.ach { display: flex; gap: 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; align-items: flex-start; }
	.ach.locked { opacity: 0.55; filter: grayscale(0.6); }
	.ach .ico { font-size: 26px; line-height: 1; margin-top: 2px; }
	.ach .nm { font-weight: 600; }
	.ach .ds { font-size: 12.5px; color: var(--muted); margin: 1px 0 6px; }
	.ach .bar { background: var(--panel-2); border-radius: 4px; height: 7px; }
	.ach .bar > span { display: block; height: 7px; border-radius: 4px; background: var(--blue); }
	.ach.done .bar > span { background: var(--green); }
	.ach .pr { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
	.ach-summary { color: var(--muted); margin: 4px 0 0; }
</style>
</head>
<body>
<header>
	<a class="brand" href="/">Magepunk</a>
	<a href="/collection/">Collection</a>
	<a href="/overworld/">Overworld</a>
	<a href="/battlecards/">Battlecards</a>
	<div class="right">
		<span id="who"></span>
		<button class="logout" id="logout">Log out</button>
	</div>
</header>
<div id="content"><p class="muted">Loading your profile…</p></div>

<script type="module">
import * as MP from '../battlecards/mpmode.js';
import { ACH, metrics, markAllSeen } from '/site/achievements.js';
if (!MP.hasToken()) location.replace('/login/?next=' + encodeURIComponent('/profile/'));
document.getElementById('logout').addEventListener('click', () => MP.logout());

const content = document.getElementById('content');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// the achievements list + metric builder live in /site/achievements.js (shared
// with the in-game unlock toasts)

(async () => {
	let s;
	try { s = await MP.freshState(); } catch (e) { s = MP.cachedState(); }
	if (!s) { location.replace('/login/?next=' + encodeURIComponent('/profile/')); return; }
	document.getElementById('who').textContent = s.username;

	// the collectible pool packs/decks draw from — for completion achievements
	let poolSize = 0;
	try { poolSize = Object.keys(await (await fetch('/server/pool-rarity.json')).json()).length; } catch (e) {}

	const col = s.collection || {};
	const distinct = Object.values(col).filter(n => n > 0).length;
	const copies = Object.values(col).reduce((a, b) => a + (b || 0), 0);
	const m = metrics(s, { poolSize });
	markAllSeen(m); // viewing the profile syncs the in-game unlock-toast seen-set
	const achievements = ACH(m);
	const unlocked = achievements.filter(a => a.have >= a.need).length;

	const statTile = (v, l) => `<div class="stat"><div class="v">${v}</div><div class="l">${l}</div></div>`;
	const achTile = (a) => {
		const done = a.have >= a.need;
		const pct = Math.min(100, Math.round(a.have / a.need * 100));
		return `<div class="ach ${done ? 'done' : 'locked'}">
			<div class="ico">${a.ico}</div>
			<div style="flex:1">
				<div class="nm">${esc(a.nm)}</div>
				<div class="ds">${esc(a.ds)}</div>
				<div class="bar"><span style="width:${pct}%"></span></div>
				<div class="pr">${done ? 'Unlocked' : `${a.have.toLocaleString()} / ${a.need.toLocaleString()}`}</div>
			</div>
		</div>`;
	};

	content.innerHTML = `
		<h1>${esc(s.username)}</h1>
		<div class="friendcode">${s.friendCode ? `Friend code: <b>${esc(s.friendCode)}</b>` : ''}</div>
		<div class="stats-grid">
			${statTile(distinct.toLocaleString(), 'different cards' + (poolSize ? ` (${Math.round(distinct / poolSize * 100)}% of ${poolSize.toLocaleString()})` : ''))}
			${statTile(copies.toLocaleString(), 'total copies')}
			${statTile(m.packsOpened.toLocaleString(), 'packs opened')}
			${statTile((s.packs || 0).toLocaleString(), 'packs unopened')}
			${statTile(m.runs.toLocaleString(), 'dungeon runs')}
			${statTile(m.wins.toLocaleString(), 'wins')}
			${statTile(m.decks.toLocaleString(), 'decks saved')}
			${statTile(m.friends.toLocaleString(), 'friends')}
		</div>
		<h2>Achievements <span class="num">${unlocked} / ${achievements.length}</span></h2>
		<p class="ach-summary">Earned by playing — runs, wins, packs, collecting, deckbuilding, friends, and your Pokémon journey.</p>
		<div class="ach-grid">${achievements.map(achTile).join('')}</div>
		<h2>Collection</h2>
		<p>Browse every card you own in the <a href="/collection/">Collection gallery</a>.</p>
	`;
})();
</script>
	<script type="module" src="/site/topbar.js"></script>
</body>
</html>
