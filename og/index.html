<!DOCTYPE html>
<html>
<head>
	<title>Mike's Card Pack Opening Simulator — OG</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../style.css">
	<style>
	/* CSS code for card images */
	.card-image {
		width: 150px;
		height: 210px;
		object-fit: contain;
		transition: transform 0.2s;
	}

	.card-image:hover {
		transform: scale(1.5);
	}

	.home { display: inline-block; margin-bottom: 16px; color: #0070f3; text-decoration: none; font-size: 14px; }
	.home:hover { text-decoration: underline; }
	</style>
	<meta name="description" content="The original MTG card pack opening simulator.">
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="Magepunk">
	<meta property="og:title" content="Card Pack Opener — Magepunk">
	<meta property="og:description" content="The original MTG card pack opening simulator.">
	<meta property="og:url" content="https://www.michaelgibalerio.com/og/">
	<meta property="og:image" content="https://www.michaelgibalerio.com/og-image.png">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="Card Pack Opener — Magepunk">
	<meta name="twitter:description" content="The original MTG card pack opening simulator.">
	<meta name="twitter:image" content="https://www.michaelgibalerio.com/og-image.png">
</head>
<body>
	<a class="home" href="/">← back home</a>
	<h1>Mike's Card Pack Opening Simulator</h1>
	<p>The original — where it all started.</p>
	<button id="reveal-cards-button">Reveal 15 random Magic: The Gathering cards</button>
	<div id="card-container"></div>

	<!-- JavaScript code to fetch and display the cards -->
	<script>
	const API_ENDPOINT = 'https://api.scryfall.com/cards/random?';
	const CARD_COUNT = 15;
	const cardContainer = document.getElementById('card-container');
	const revealCardsButton = document.getElementById('reveal-cards-button');

	revealCardsButton.addEventListener('click', async () => {
		revealCardsButton.disabled = true;
		cardContainer.innerHTML = '';

		for (let i = 0; i < CARD_COUNT; i++) {
			const response = await fetch(API_ENDPOINT);
			const { image_uris } = await response.json();
			const cardImage = document.createElement('img');
			cardImage.className = 'card-image';
			cardImage.src = image_uris.normal;
			cardContainer.appendChild(cardImage);
		}

		revealCardsButton.disabled = false;
	});
	</script>
	<script type="module" src="/site/topbar.js"></script>
</body>
</html>
