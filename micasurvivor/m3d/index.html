<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>MicaSurvivor 3D — test room</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<!-- a test room (Plans/MICASURVIVOR_3D_PLAN.md, phase P0), not a page for the public: keep it out of search -->
	<meta name="robots" content="noindex">
	<link rel="icon" href="../favicon.ico">
	<style>
		html, body { margin: 0; height: 100%; overflow: hidden; background: #9fc4e8; font: 13px/1.35 ui-monospace, Menlo, Consolas, monospace; color: #fff; touch-action: none; user-select: none; -webkit-user-select: none; }
		#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
		#hud { position: fixed; left: max(10px, env(safe-area-inset-left)); top: max(8px, env(safe-area-inset-top)); white-space: pre; background: rgba(12, 18, 30, .62); padding: 6px 9px; border-radius: 8px; pointer-events: none; }
		#help { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(8px, env(safe-area-inset-bottom)); background: rgba(12, 18, 30, .62); padding: 5px 10px; border-radius: 8px; pointer-events: none; text-align: center; max-width: 92vw; }
		#boot { position: fixed; inset: 0; display: grid; place-items: center; background: #9fc4e8; color: #17324d; font-size: 16px; }
		.btn { position: fixed; right: max(16px, env(safe-area-inset-right)); width: 78px; height: 78px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, .85); background: rgba(12, 18, 30, .45); color: #fff; font: 700 14px ui-sans-serif, system-ui, sans-serif; display: none; touch-action: none; }
		#b-jump { bottom: max(26px, env(safe-area-inset-bottom)); }
		#b-slide { bottom: calc(max(26px, env(safe-area-inset-bottom)) + 92px); right: calc(max(16px, env(safe-area-inset-right)) + 58px); width: 64px; height: 64px; }
		@media (pointer: coarse) { .btn { display: block; } #help { display: none; } }
	</style>
	<script type="importmap">
	{ "imports": { "three": "/battlecards/vendor/three.module.min.js" } }
	</script>
</head>
<body>
	<canvas id="c"></canvas>
	<div id="hud"></div>
	<div id="help">Move WASD / arrows · Jump Space (again in the air) · Slide Shift while running · Camera: drag, or Q / E · R: back to the start</div>
	<button class="btn" id="b-slide">SLIDE</button>
	<button class="btn" id="b-jump">JUMP</button>
	<div id="boot">MicaSurvivor 3D test room…</div>
	<noscript><p style="padding:20px">This test room needs JavaScript.</p></noscript>
	<!-- the sprites' geometry, as the 2D game reads it (a plain script that fills G.SPRITE_META) -->
	<script>window.G = {};</script>
	<script src="../js/data/sprites-meta.js"></script>
	<script type="module" src="main.js"></script>
</body>
</html>
