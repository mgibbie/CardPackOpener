<!DOCTYPE html>
<html lang="en">
<head>
<!-- first, before any game code reads storage: per-account local data (site/account_silo.js) -->
<script src="/site/account_silo.js"></script>
<meta charset="UTF-8">
<title>Magepunk — Errors</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<!-- the site's Balatro-style UI kit (site/ui/): its tokens, the m6x11 font, the .bal-* components -->
<link rel="preload" href="/micatro/assets/fonts/m6x11plus.ttf?v=2" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="/site/ui/balatro.css">
<style>
	* { box-sizing: border-box; }
	body { margin: 0; background: #0e0b16; color: #e8e2f4; font-family: 'Segoe UI', system-ui, sans-serif; padding: 20px; }
	h1 { font-size: 20px; letter-spacing: 1px; margin: 0 0 4px; }
	.sub { color: #9b93b3; font-size: 13px; margin-bottom: 16px; }
	.controls { display: flex; gap: 8px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
	select, button { background: #241b38; color: #e8e2f4; border: 1px solid #4a3f6b; border-radius: 7px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
	button:hover, select:hover { border-color: #8f6fff; }
	.wrap { max-width: 980px; }
	.day { color: #9b93b3; font-size: 12px; margin: 18px 0 8px; letter-spacing: .5px; }
	.day b { color: #ffb4a2; }
	table { width: 100%; border-collapse: collapse; }
	th { text-align: left; color: #8f88a8; font-size: 11px; text-transform: uppercase; letter-spacing: .8px; padding: 4px 8px; font-weight: 700; }
	td { padding: 7px 8px; border-top: 1px solid #221b36; font-size: 13px; vertical-align: top; }
	td.n { font-weight: 800; color: #ffb4a2; text-align: right; white-space: nowrap; }
	td.msg { color: #f0e6ff; word-break: break-word; }
	td.where { color: #9fd0ff; font-size: 12px; word-break: break-all; }
	td.meta { color: #9b93b3; font-size: 11.5px; white-space: nowrap; }
	#msg { color: #9b93b3; font-size: 14px; padding: 8px 0; }
	.tot { color: #9fd8b0; font-weight: 700; }
	/* ---- the Balatro look (site/ui/balatro.css): the felt + the m6x11 font (body.bal-page), boxes as kit panels on
	   a dark lip, buttons as kit buttons (a flat block on a darker lip that sinks when pressed), fields as the kit's
	   dark wells. Long free text (a bug report, a log line) stays in a reading font. */
	html { background: var(--bal-bg); }
	.bal-page { font-size: 18px; line-height: 1.2; color: #fff; }
	.bal-page b, .bal-page strong { font-weight: normal; }
	.bal-page h1 { font-size: 36px; font-weight: normal; letter-spacing: 0; text-shadow: 0 .09em 0 rgba(0,0,0,.35); }
	.bal-page h2 { font-weight: normal; font-size: 24px; color: #fff; text-shadow: var(--bal-text-shadow); }
	.bal-page .hint, .bal-page .sub { color: var(--bal-text-soft); font-size: 16px; }
	.bal-page button { --b: var(--bal-grey); --bd: var(--bal-grey-d); background: var(--b); color: #fff; border: 0; border-radius: 10px; box-shadow: 0 4px 0 var(--bd);
		text-shadow: 0 2px 0 rgba(0,0,0,.3); font: 18px/1 var(--bal-font); padding: 8px 14px 6px; margin-bottom: 4px; cursor: pointer; touch-action: manipulation; transition: transform .06s, box-shadow .06s, filter .1s; }
	.bal-page button:hover:not(:disabled) { background: var(--b); filter: brightness(1.1); }
	.bal-page button:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--bd); }
	.bal-page button:disabled { --b: var(--bal-disabled); --bd: var(--bal-disabled-d); color: var(--bal-disabled-text); opacity: 1; cursor: default; }
	.bal-page button.primary { --b: var(--bal-blue); --bd: var(--bal-blue-d); }
	.bal-page button.danger, .bal-page button.x { --b: var(--bal-red); --bd: var(--bal-red-d); color: #fff; }
	.bal-page input[type=text], .bal-page input[type=search], .bal-page input:not([type]), .bal-page select, .bal-page textarea { background: var(--bal-panel-dd); color: #fff;
		border: 3px solid var(--bal-outline-light); border-radius: 10px; font-family: var(--bal-font); font-size: 18px; padding: 6px 10px 4px; }
	.bal-page input:focus, .bal-page select:focus, .bal-page textarea:focus { outline: none; border-color: #fff; }
	.bal-page select option { background: var(--bal-panel-d); }
	.bal-page :focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
	.day { color: var(--bal-text-muted); font-size: 16px; } .day b { color: var(--bal-red); }
	table { border-collapse: separate; border-spacing: 0 4px; }
	th { color: var(--bal-text-muted); font-weight: normal; font-size: 15px; letter-spacing: 0; }
	td { background: var(--bal-panel-d); border-top: 0; font-size: 16px; }
	td:first-child { border-radius: 10px 0 0 10px; } td:last-child { border-radius: 0 10px 10px 0; }
	td.n { font-weight: normal; color: var(--bal-red); font-size: 18px; }
	td.msg { color: #fff; font-family: ui-monospace, Consolas, monospace; font-size: 13px; } td.where { color: #9fd3ff; font-family: ui-monospace, Consolas, monospace; } td.meta { color: var(--bal-text-muted); font-size: 14px; }
	.tot { color: var(--bal-green); font-weight: normal; }
	#msg { color: var(--bal-text-soft); }
</style>
</head>
<body class="bal-page">
<div class="wrap">
	<h1>Magepunk — Errors</h1>
	<div class="sub">Uncaught client crashes (message · location · browser). No accounts, cookies, or IPs. Deduped + capped per visitor.</div>
	<div class="controls">
		<label>Window
			<select id="days"><option value="1">Today</option><option value="7" selected>7 days</option><option value="31">31 days</option></select>
		</label>
		<button id="refresh">Refresh</button>
	</div>
	<div id="msg">Loading…</div>
	<div id="out"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ago = ts => { const s = Math.max(0, Math.round((Date.now() - ts) / 1000)); if (s < 60) return s + 's ago'; if (s < 3600) return Math.round(s / 60) + 'm ago'; if (s < 86400) return Math.round(s / 3600) + 'h ago'; return Math.round(s / 86400) + 'd ago'; };
const shortUA = ua => { const m = /(Chrome|Firefox|Safari|Edg|Edge|OPR)\/[\d.]+/.exec(ua || ''); const os = /(Windows|Mac OS X|Android|iPhone|iPad|Linux)/.exec(ua || ''); return [(m && m[0].replace('Edg', 'Edge')) || (ua || '').slice(0, 24), os && os[1]].filter(Boolean).join(' · '); };

async function load() {
	const days = +$('days').value;
	$('msg').textContent = 'Loading…'; $('out').innerHTML = '';
	let data;
	try { const r = await fetch('/api/mp', { method: 'POST', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + (localStorage.getItem('magepunk_mp_token_v1') || '') }, body: JSON.stringify({ action: 'errors', days }) }); data = await r.json(); }
	catch (e) { $('msg').textContent = 'Could not load (' + (e.message || 'error') + ').'; return; }
	if (data && data.error) { $('msg').innerHTML = 'Owner only — <a href="/login/?next=' + encodeURIComponent(location.pathname) + '" style="color:#9d8fd4">log in</a> as the owner to view crash reports.'; return; }
	const list = (data && data.days) || [];
	if (!list.length) { $('msg').textContent = 'No errors recorded 🎉 — nothing crashed in this window.'; return; }
	$('msg').textContent = '';
	$('out').innerHTML = list.map(d => {
		const rows = Object.values(d.errors || {}).sort((a, b) => b.count - a.count);
		const total = rows.reduce((s, r) => s + r.count, 0);
		return `<div class="day">${d.date} · <b>${total}</b> error${total === 1 ? '' : 's'} · ${rows.length} distinct</div>`
			+ `<table><tr><th style="text-align:right">×</th><th>Message</th><th>Where</th><th>Page</th><th>Browser</th><th>Last</th></tr>`
			+ rows.map(r => `<tr><td class="n">${r.count}</td><td class="msg">${esc(r.msg)}</td>`
				+ `<td class="where">${esc(r.where)}</td><td class="meta">${esc(r.page)}</td>`
				+ `<td class="meta">${esc(shortUA(r.ua))}</td><td class="meta">${ago(r.last)}</td></tr>`).join('')
			+ `</table>`;
	}).join('');
}
$('refresh').addEventListener('click', load);
$('days').addEventListener('change', load);
load();
</script>
<!-- Balatro's button sounds on every button and link (site/pagesounds.js; nothing plays before a press, no music) -->
<script type="module">import { wirePage } from '/site/pagesounds.js'; wirePage();</script>
</body>
</html>
