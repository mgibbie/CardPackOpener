<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magepunk Test Realm</title>
<style>
	* { box-sizing: border-box; }
	body {
		margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
		background: radial-gradient(circle at 50% 20%, #221a3e 0%, #0e0b16 70%);
		color: #e8e2f4; font-family: Georgia, serif;
	}
	.panel {
		width: min(440px, 92vw); background: #1c1830cc; border: 1px solid #4a4066;
		border-radius: 14px; padding: 28px 26px; text-align: center;
		box-shadow: 0 12px 40px #0009;
	}
	h1 { margin: 0 0 4px; letter-spacing: 2px; font-size: 26px; color: #cbb8ff; }
	.sub { opacity: 0.7; font-size: 13px; margin-bottom: 20px; }
	input {
		width: 100%; padding: 11px 12px; margin: 5px 0; border-radius: 8px;
		border: 1px solid #4a4066; background: #141021; color: #e8e2f4;
		font-size: 15px; font-family: inherit;
	}
	button {
		width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid #6a5a9a;
		background: linear-gradient(180deg, #4a3a7a, #332759); color: #f0eaff;
		font-size: 16px; font-family: inherit; letter-spacing: 1px; cursor: pointer;
	}
	button:hover { filter: brightness(1.15); }
	button.mode { padding: 16px; font-size: 18px; margin-top: 12px; }
	.alt { background: none; border: none; color: #9b8fc9; font-size: 13px; margin-top: 12px;
		cursor: pointer; text-decoration: underline; width: auto; }
	.err { color: #ff9b9b; font-size: 13px; min-height: 18px; margin-top: 8px; }
	.bar { display: flex; justify-content: space-between; align-items: center; font-size: 13px;
		opacity: 0.85; margin-bottom: 14px; }
	.bar button { width: auto; padding: 4px 10px; margin: 0; font-size: 12px; }
	.stats { font-size: 13px; opacity: 0.75; margin-top: 14px; line-height: 1.6; }
	.code { font-size: 14px; margin-bottom: 16px; color: #cbb8ff; letter-spacing: 1px; }
	.code b { font-family: monospace; font-size: 20px; letter-spacing: 4px; color: #ffe08a; }
	.hint2 { font-size: 11.5px; opacity: 0.55; margin-top: 14px; line-height: 1.5; }
	.badge { background: #4a3a7a; border-radius: 10px; padding: 1px 9px; margin-left: 4px; }
	#app-auth, #app-menu { display: none; }
</style>
</head>
<body>
<div class="panel">
	<h1>MAGEPUNK</h1>
	<div class="sub">test realm — dungeon runs build your collection</div>

	<div id="app-auth">
		<input id="u" placeholder="username" autocomplete="username" maxlength="20">
		<input id="p" placeholder="password" type="password" autocomplete="current-password">
		<button id="go">Log in</button>
		<div class="err" id="err"></div>
		<button class="alt" id="flip">No account? Create one</button>
	</div>

	<div id="app-menu">
		<div class="bar">
			<span id="who"></span>
			<button id="logout">Log out</button>
		</div>
		<div class="code" id="code"></div>
		<button class="mode" id="m-world">▶ Enter the World</button>
		<div class="stats" id="stats"></div>
		<div class="hint2">Your journey, packs, decks, and dungeon runs all live in the world now — press START in-game for the menu.</div>
	</div>
</div>
<script type="module" src="./mp.js"></script>
</body>
</html>
