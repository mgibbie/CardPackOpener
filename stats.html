<!DOCTYPE html>
<html lang="en">
<head>
<!-- first, before any game code reads storage: per-account local data (site/account_silo.js) -->
<script src="/site/account_silo.js"></script>
<meta charset="UTF-8">
<title>Magepunk — Usage</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<!-- the site's Balatro-style UI kit (site/ui/): its tokens, the m6x11 font, the .bal-* components -->
<link rel="preload" href="/micatro/assets/fonts/m6x11plus.ttf?v=2" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="/site/ui/balatro.css">
<style>
	* { box-sizing: border-box; }
	body { margin: 0; background: #0e0b16; color: #e8e2f4; font-family: 'Segoe UI', system-ui, sans-serif; padding: 20px; }
	h1 { font-size: 20px; letter-spacing: 1px; margin: 0 0 4px; }
	.sub { color: #9b93b3; font-size: 13px; margin-bottom: 16px; }
	.controls { display: flex; gap: 8px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
	select, button { background: #241b38; color: #e8e2f4; border: 1px solid #4a3f6b; border-radius: 7px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
	button:hover, select:hover { border-color: #8f6fff; }
	.wrap { max-width: 720px; }
	.card { background: #16121f; border: 1px solid #2a2340; border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
	.card h2 { font-size: 15px; margin: 0 0 12px; color: #c9b8ff; }
	.row { display: grid; grid-template-columns: 150px 1fr 54px; align-items: center; gap: 10px; margin-bottom: 6px; }
	.row .lbl { font-size: 13px; color: #d9ccff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.row .bar { height: 16px; background: linear-gradient(90deg, #6b4fd4, #8f6fff); border-radius: 4px; min-width: 2px; }
	.row .n { font-size: 13px; font-weight: 700; text-align: right; color: #cbb8e8; }
	.day { color: #9b93b3; font-size: 12px; margin: 14px 0 6px; letter-spacing: .5px; }
	.mini { color: #b7abd6; font-size: 12.5px; line-height: 1.7; }
	.mini b { color: #e8e2f4; }
	#msg { color: #9b93b3; font-size: 14px; padding: 8px 0; }
	.tot { color: #9fd8b0; font-weight: 800; }
	/* ---- the Balatro look (site/ui/balatro.css): the felt + the m6x11 font (body.bal-page), boxes as kit panels on
	   a dark lip, buttons as kit buttons (a flat block on a darker lip that sinks when pressed), fields as the kit's
	   dark wells. Long free text (a bug report, a log line) stays in a reading font. */
	html { background: var(--bal-bg); }
	.bal-page { font-size: 18px; line-height: 1.2; color: #fff; }
	.bal-page b, .bal-page strong { font-weight: normal; }
	.bal-page h1 { font-size: 36px; font-weight: normal; letter-spacing: 0; text-shadow: 0 .09em 0 rgba(0,0,0,.35); }
	.bal-page h2 { font-weight: normal; font-size: 24px; color: #fff; text-shadow: var(--bal-text-shadow); }
	.bal-page .hint, .bal-page .sub { color: var(--bal-text-soft); font-size: 16px; }
	.bal-page button { --b: var(--bal-grey); --bd: var(--bal-grey-d); background: var(--b); color: #fff; border: 0; border-radius: 10px; box-shadow: 0 4px 0 var(--bd);
		text-shadow: 0 2px 0 rgba(0,0,0,.3); font: 18px/1 var(--bal-font); padding: 8px 14px 6px; margin-bottom: 4px; cursor: pointer; touch-action: manipulation; transition: transform .06s, box-shadow .06s, filter .1s; }
	.bal-page button:hover:not(:disabled) { background: var(--b); filter: brightness(1.1); }
	.bal-page button:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--bd); }
	.bal-page button:disabled { --b: var(--bal-disabled); --bd: var(--bal-disabled-d); color: var(--bal-disabled-text); opacity: 1; cursor: default; }
	.bal-page button.primary { --b: var(--bal-blue); --bd: var(--bal-blue-d); }
	.bal-page button.danger, .bal-page button.x { --b: var(--bal-red); --bd: var(--bal-red-d); color: #fff; }
	.bal-page input[type=text], .bal-page input[type=search], .bal-page input:not([type]), .bal-page select, .bal-page textarea { background: var(--bal-panel-dd); color: #fff;
		border: 3px solid var(--bal-outline-light); border-radius: 10px; font-family: var(--bal-font); font-size: 18px; padding: 6px 10px 4px; }
	.bal-page input:focus, .bal-page select:focus, .bal-page textarea:focus { outline: none; border-color: #fff; }
	.bal-page select option { background: var(--bal-panel-d); }
	.bal-page :focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
	.card { background: var(--bal-panel); border: 0; border-radius: 14px; box-shadow: 0 6px 0 var(--bal-panel-dd), inset 0 0 0 3px var(--bal-panel-line); }
	.card h2 { color: #fff; font-size: 24px; }
	.row .lbl { color: var(--bal-text-soft); font-size: 17px; }
	.row .bar { height: 18px; border-radius: 6px; background: var(--bal-blue); }
	.row .n { font-weight: normal; color: var(--bal-money); font-size: 18px; }
	.day { color: var(--bal-text-muted); font-size: 16px; }
	.mini { color: var(--bal-text-soft); font-size: 16px; }
	.tot { color: var(--bal-green); font-weight: normal; }
	#msg { color: var(--bal-text-soft); }
</style>
</head>
<body class="bal-page">
<div class="wrap">
	<h1>Magepunk — Usage</h1>
	<div class="sub">Cookieless page-open counts (no accounts, no IPs). Which modes people actually open.</div>
	<div class="controls">
		<label>Window
			<select id="days">
				<option value="7">7 days</option>
				<option value="14" selected>14 days</option>
				<option value="31">31 days</option>
			</select>
		</label>
		<button id="refresh">Refresh</button>
	</div>
	<div id="msg">Loading…</div>
	<div id="summary" class="card" style="display:none">
		<h2>Totals over the window</h2>
		<div id="summary-rows"></div>
	</div>
	<div id="daily"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const NICE = {
	'home': 'Home', 'overworld': 'Overworld', 'collection': 'Collection', 'wiki': 'Design Wiki',
	'learn': 'Learn', 'news': 'News', 'profile': 'Profile',
	'bc': 'Battlecards', 'bc:start': 'BC · Mode picker', 'bc:deck': 'BC · Deck builder',
	'bc:packs': 'BC · Packs', 'bc:gallery': 'BC · Gallery', 'bc:quickmatch': 'BC · Quick Match',
	'bc:ai': 'BC · Matchmade AI', 'bc:duel': 'BC · PvP duel', 'bc:spectate': 'BC · Spectating',
	'bc:dungeon': 'BC · Dungeon', 'bc:heist': 'BC · Heist', 'bc:tombs': 'BC · Tombs', 'bc:duels': 'BC · Duels',
	'ow:battle': 'OW · Pokémon battle', 'ow:spectate': 'OW · Spectating',
};
const nice = k => NICE[k] || k;

async function load() {
	const days = +$('days').value;
	$('msg').textContent = 'Loading…';
	$('summary').style.display = 'none';
	$('daily').innerHTML = '';
	let data;
	try {
		const r = await fetch('/api/mp', { method: 'POST', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + (localStorage.getItem('magepunk_mp_token_v1') || '') }, body: JSON.stringify({ action: 'stats', days }) });
		data = await r.json();
	} catch (e) { $('msg').textContent = 'Could not load stats (' + (e.message || 'error') + ').'; return; }
	if (data && data.error) { $('msg').innerHTML = 'Owner only — <a href="/login/?next=' + encodeURIComponent(location.pathname) + '" style="color:#9d8fd4">log in</a> as the owner to view usage stats.'; return; }
	const list = (data && data.days) || [];
	if (!list.length) { $('msg').textContent = 'No data yet — open a few pages, then refresh.'; return; }
	$('msg').textContent = '';

	// aggregate across the window (skip the _total bookkeeping key)
	const agg = {};
	let grand = 0;
	for (const d of list) for (const [k, v] of Object.entries(d.counts || {})) {
		if (k === '_total') { grand += v; continue; }
		agg[k] = (agg[k] || 0) + v;
	}
	const entries = Object.entries(agg).sort((a, b) => b[1] - a[1]);
	const max = entries.length ? entries[0][1] : 1;
	$('summary-rows').innerHTML = `<div class="row"><div class="lbl tot">Total page opens</div><div></div><div class="n tot">${grand}</div></div>`
		+ entries.map(([k, v]) =>
			`<div class="row"><div class="lbl">${nice(k)}</div><div class="bar" style="width:${Math.max(2, Math.round(v / max * 100))}%"></div><div class="n">${v}</div></div>`).join('');
	$('summary').style.display = '';

	// per-day compact breakdown
	$('daily').innerHTML = list.map(d => {
		const items = Object.entries(d.counts || {}).filter(([k]) => k !== '_total').sort((a, b) => b[1] - a[1]);
		const total = (d.counts && d.counts._total) || items.reduce((s, [, v]) => s + v, 0);
		return `<div class="day">${d.date} · <b style="color:#9fd8b0">${total}</b> opens</div>`
			+ `<div class="mini">${items.map(([k, v]) => `${nice(k)} <b>${v}</b>`).join(' · ') || '—'}</div>`;
	}).join('');
}
$('refresh').addEventListener('click', load);
$('days').addEventListener('change', load);
load();
</script>
<!-- Balatro's button sounds on every button and link (site/pagesounds.js; nothing plays before a press, no music) -->
<script type="module">import { wirePage } from '/site/pagesounds.js'; wirePage();</script>
</body>
</html>
